<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' file: blob:; connect-src 'self' file:;">
<title>Circuit Composer</title>
<style>
:root {
  --bg: #1a1a2e;
  --panel: #22223a;
  --panel2: #1e1e34;
  --accent: #6a6acc;
  --accent2: #4a4aaa;
  --glow: 0 0 12px rgba(106, 106, 204, 0.35);
  --text-dim: #6a6a9a;
  --text-med: #9999bb;
  --text-high: #ddddee;
  --border: #2e2e44;
  --border2: #3a3a52;
  --radius: 4px;
  --dark: #161628;
}

* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; background:var(--bg); color:var(--text-high); font-family:'SF Mono','Consolas',monospace; overflow:hidden; }
#app { display:grid; grid-template-rows:42px 1fr 120px 42px; height:100vh; }

/* Scrollbar */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#333355; border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--accent2); }

/* Topbar */
#topbar { display:flex; align-items:center; padding:0 16px; gap:6px; border-bottom:1px solid var(--border); background:var(--panel); box-shadow: var(--glow); z-index: 10; }
#topbar-title { font-size:12px; letter-spacing:6px; color:var(--text-med); text-transform:uppercase; flex:1; font-weight:700; }
#topbar-title::before { content:'◆ '; color:var(--accent); font-size:10px; }
#profile-badge { font-size:11px; letter-spacing:2px; color:var(--text-med); padding:5px 14px; border:1px solid var(--border); border-radius:16px; cursor:pointer; transition:all .25s; }
#profile-badge:hover { border-color:var(--accent); color:var(--text-high); box-shadow: 0 0 12px rgba(106,106,204,0.2); }
.tbtn-sm { padding:6px 11px; border:1px solid var(--border); background:transparent; color:var(--text-med); font-size:10px; letter-spacing:1px; font-family:inherit; cursor:pointer; border-radius:var(--radius); text-transform:uppercase; transition: all 0.15s; white-space:nowrap; }
.tbtn-sm:hover { border-color:var(--accent); color:var(--text-high); background: rgba(106,106,204,0.08); }
.tbtn-sm:active { transform:scale(0.96); }
.tbtn-sm.danger:hover { border-color:#aa4444; color:#dd6666; background:rgba(170,68,68,0.08); }
.tdivider { width:1px; height:22px; background:var(--border); margin:0 6px; }

/* Main */
#main { display:grid; grid-template-columns:1fr 340px; overflow:hidden; }
#tl-area { display:flex; flex-direction:column; overflow:hidden; border-right:1px solid var(--border); background: rgba(15,15,30,0.3); }
#tl-header { display:flex; align-items:center; padding:10px 18px; gap:16px; border-bottom:1px solid var(--border); background: var(--panel2); flex-shrink:0; }
#tl-header span { font-size:10px; letter-spacing:3px; color:var(--text-dim); text-transform:uppercase; }
#tl-wrap { flex:1; overflow:auto; }
#tl-canvas { display:block; cursor:crosshair; }
#tl-controls { display:flex; align-items:center; gap:8px; padding:6px 16px; border-bottom:1px solid var(--border); background:var(--panel2); flex-shrink:0; font-size:10px; color:var(--text-dim); }
#tl-controls select, #tl-controls input { background:var(--dark); border:1px solid var(--border); color:var(--text-high); font-size:10px; padding:4px 8px; border-radius:var(--radius); font-family:inherit; }
#tl-controls select { width:88px; }

/* Curve */
#curve-area { border-top:1px solid var(--border); background:var(--panel2); position:relative; height:120px; flex-shrink:0; overflow: hidden; }
#curve-label { position:absolute; left:18px; top:10px; font-size:10px; letter-spacing:3px; color:var(--text-dim); text-transform:uppercase; pointer-events: none; }
#curve-info  { position:absolute; right:18px; top:10px; font-size:10px; letter-spacing:2px; color:var(--text-med); text-transform:uppercase; pointer-events: none; }
#curve-canvas { display:block; width:100%; height:100%; transition: opacity 0.5s; }

/* Right panel */
#right { display:flex; flex-direction:column; background:var(--panel); overflow:hidden; border-left: 1px solid var(--border); min-width:0; }
#panel-tabs { display:flex; border-bottom:1px solid var(--border); flex-shrink:0; background: var(--panel2); }
.ptab { flex:1; padding:10px 4px; text-align:center; font-size:9px; letter-spacing:1px; color: var(--text-dim); text-transform:uppercase; cursor:pointer; border-bottom:2px solid transparent; transition:all .2s; }
.ptab:hover { color:var(--text-med); background: rgba(255,255,255,0.02); }
.ptab.on { color:var(--text-high); border-bottom-color:var(--accent); background: rgba(106,106,204,0.06); }
#panel-body { flex:1; overflow-y:auto; overflow-x:hidden; padding:12px; word-wrap:break-word; }

/* Chips */
.gsec { margin-bottom:12px; }
.gsec-lbl { font-size:9px; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; font-weight:700; opacity:0.9; }
.gsec-lbl.release       { color:#5dba5d; }
.gsec-lbl.stress_growth { color:#cc5d5d; }
.gsec-lbl.extreme_growth{ color:#7a7adb; }
.gsec-lbl.mainstream    { color:var(--text-med); }
.chips { display:flex; flex-wrap:wrap; gap:5px; }
.chip { padding:5px 10px; border-radius:14px; border:1px solid var(--border2); font-size:9px; color:var(--text-med); cursor:pointer; transition:all .15s; white-space:nowrap; background: rgba(255,255,255,0.02); }
.chip:hover { color:var(--text-high); border-color:var(--text-dim); background: rgba(255,255,255,0.05); transform: translateY(-1px); }
.chip.release       { border-color:#2a4a2a; color:#4a8a4a; }
.chip.stress_growth { border-color:#4a2a2a; color:#8a4a4a; }
.chip.extreme_growth{ border-color:#2a2a48; color:#5a5a9a; }
.chip.mainstream    { color:var(--text-med); }
.chip.sel { border-color: var(--accent) !important; color:var(--text-high) !important; background: rgba(106,106,204,0.15); box-shadow: 0 0 8px rgba(106,106,204,0.2); }
.chip-score { display:inline-block; height:3px; border-radius:2px; vertical-align:middle; margin-left:6px; opacity:0.5; }

/* Transport */
#transport { border-top:1px solid var(--border); background:var(--panel); display:flex; align-items:center; padding:0 14px; gap:6px; }
.trbtn { padding:6px 11px; border:1px solid var(--border); background:transparent; color:var(--text-med); font-size:9px; letter-spacing:1px; font-family:inherit; cursor:pointer; border-radius:var(--radius); text-transform:uppercase; transition: all 0.15s; white-space:nowrap; }
.trbtn:hover { border-color:var(--accent); color:var(--text-high); background: rgba(106,106,204,0.06); }
.trbtn:active { transform:scale(0.96); }
.trbtn.on { border-color:var(--accent); color:var(--text-high); background: rgba(106,106,204,0.15); box-shadow: 0 0 8px rgba(106,106,204,0.15); }
.trbtn.play { min-width:54px; text-align:center; font-weight:700; font-size:10px; }
#tr-info { flex:1; text-align:right; font-size:10px; color:var(--text-dim); letter-spacing:1px; font-style:italic; }
.tr-sep { width:1px; height:18px; background:var(--border); margin:0 3px; }
.tr-label { font-size:9px; color:var(--text-dim); letter-spacing:2px; }

@keyframes pulse-block {
  0% { opacity: 0.8; }
  50% { opacity: 1; transform: scale(1.02); }
  100% { opacity: 0.8; }
}
.playing-block { animation: pulse-block 0.5s infinite ease-in-out; }

/* Block gen status overlay (drawn on canvas, but also DOM overlay for spin) */
@keyframes spin { to { transform:rotate(360deg); } }
.block-spinner { width:8px; height:8px; border:1px solid var(--text-dim); border-top-color:var(--text-med); border-radius:50%; animation:spin .8s linear infinite; display:inline-block; vertical-align:middle; margin-right:4px; }

/* ── Onboarding overlay ── */
#onboard {
  display:flex; position:fixed; inset:0; background:linear-gradient(135deg,var(--bg) 0%,#252540 50%,var(--panel2) 100%);
  z-index:1000; align-items:center; justify-content:center;
  flex-direction:column; overflow-y:auto; padding:40px 20px;
}
#ob-wrap { width:640px; max-width:92vw; max-height:92vh; padding:8px; display:flex; flex-direction:column; }
#ob-title { font-size:12px; letter-spacing:6px; color:var(--text-high); text-transform:uppercase; margin-bottom:24px; font-weight:700; }
#ob-title::after { content:''; display:block; width:40px; height:2px; background:var(--accent); margin-top:12px; border-radius:2px; }

#ob-content { min-height:200px; }

/* Step 2 — 8 sound pads (no scroll, no genre labels) */
#ob-sounds { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
.ob-sound {
  aspect-ratio:1; padding:0; border:1px solid var(--border2); background:rgba(255,255,255,0.03); border-radius:10px;
  cursor:pointer; transition:all .2s; position:relative; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
}
.ob-sound:hover { border-color:var(--accent); background:rgba(106,106,204,0.08); transform:translateY(-2px); }
.ob-sound.picked { border-color:var(--accent); background:rgba(106,106,204,0.14); box-shadow:0 0 14px rgba(106,106,204,0.2); }
.ob-sound.playing { border-color:var(--accent); box-shadow:0 0 16px rgba(106,106,204,0.35); }
.ob-pad-glyph { font-size:28px; color:var(--text-high); letter-spacing:1px; font-weight:700; }
.ob-pad-bar { width:60%; height:3px; border-radius:3px; }
.ob-pad-hint { font-size:8px; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; }

.ob-btn {
  width:100%; padding:12px; background:transparent; border:1px solid var(--border);
  color:var(--text-med); font-family:inherit; font-size:10px; letter-spacing:3px;
  text-transform:uppercase; cursor:pointer; border-radius:var(--radius); transition:all .2s; margin-top:10px;
}
.ob-btn:hover { border-color:var(--text-med); color:var(--text-high); }
.ob-btn.primary { background:var(--accent); color:var(--text-high); border-color:var(--accent); margin-top:20px; font-weight:700; }
.ob-btn.primary:hover { background:var(--accent2); border-color:var(--accent2); box-shadow:0 0 14px rgba(106,106,204,0.3); }
.ob-btn-row { display:flex; gap:8px; margin-top:16px; }
.ob-btn-row .ob-btn { margin-top:0; }

/* Rec panel */
.rec-sec { margin-bottom:14px; }
.rec-sec-lbl { font-size:9px; letter-spacing:3px; text-transform:uppercase; margin-bottom:8px; font-weight:700; opacity:0.9; }
.rec-row { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-radius:var(--radius); cursor:pointer; margin-bottom:4px; border:1px solid transparent; transition:all .15s; }
.rec-row:hover { border-color:var(--border); background:rgba(255,255,255,0.03); }
.rec-row.release:hover { border-color:#2a4a2a; }
.rec-row.stress_growth:hover { border-color:#4a2a2a; }
.rec-row.extreme_growth:hover { border-color:#2a2a48; }
.rec-genre { font-size:10px; color:var(--text-med); letter-spacing:0.5px; flex:1; }
.rec-row:hover .rec-genre { color:var(--text-high); }
.rec-score-wrap { display:flex; align-items:center; gap:6px; }
.rec-score-bar { width:40px; height:2px; background:var(--dark); border-radius:2px; overflow:hidden; }
.rec-score-fill { height:100%; border-radius:2px; }
.rec-why { font-size:8px; color:var(--text-dim); letter-spacing:1px; width:28px; text-align:right; }

/* ── Mixer panel ── */
#mixer-panel {
  display:none; position:absolute; bottom:46px; left:0; right:0; height:200px;
  background:var(--panel); border-top:1px solid var(--border); z-index:20;
  flex-direction:row; padding:8px 12px; gap:6px; overflow-x:auto;
}
#mixer-panel.show { display:flex; }
.mix-strip {
  display:flex; flex-direction:column; align-items:center; gap:4px;
  min-width:72px; flex:1; max-width:110px; background:rgba(255,255,255,0.02);
  border:1px solid var(--border); border-radius:var(--radius); padding:6px 4px;
}
.mix-strip.master { border-color:var(--accent2); background:rgba(106,106,204,0.06); }
.mix-label { font-size:8px; letter-spacing:2px; color:var(--text-med); text-transform:uppercase; text-align:center; }
.mix-fader { -webkit-appearance:none; appearance:none; writing-mode:vertical-lr; direction:rtl;
  width:6px; height:70px; background:var(--dark); border-radius:3px; outline:none; cursor:pointer; }
.mix-fader::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:8px; border-radius:3px; background:var(--text-high); cursor:pointer; }
.mix-knob-row { display:flex; gap:3px; }
.mix-knob-wrap { display:flex; flex-direction:column; align-items:center; }
.mix-knob { -webkit-appearance:none; appearance:none; width:20px; height:20px; border-radius:50%;
  background:var(--dark); border:1px solid var(--border); outline:none; cursor:pointer; }
.mix-knob::-webkit-slider-thumb { -webkit-appearance:none; width:8px; height:8px; border-radius:50%; background:var(--text-high); cursor:pointer; }
.mix-knob-lbl { font-size:7px; color:var(--text-dim); letter-spacing:1px; margin-top:1px; }
.mix-btn-row { display:flex; gap:3px; }
.mix-btn { padding:2px 6px; font-size:7px; letter-spacing:1px; border:1px solid var(--border);
  background:transparent; color:var(--text-med); font-family:inherit; cursor:pointer; border-radius:3px; text-transform:uppercase; }
.mix-btn.on { background:var(--accent2); color:var(--text-high); border-color:var(--accent); }
.mix-btn.muted { background:#5a1a1a; color:#8a3a3a; border-color:#8a3a3a; }
.mix-val { font-size:8px; color:var(--text-med); letter-spacing:1px; text-align:center; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="topbar-title">Circuit Composer</div>
    <div id="profile-badge" onclick="resetOnboard()">Calibrating…</div>
    <div class="tdivider"></div>
    <button class="tbtn-sm" id="btn-mixer" onclick="toggleMixer()">Mixer</button>
    <button class="tbtn-sm" onclick="exportComp()">WAV</button>
    <button class="tbtn-sm" onclick="exportMidi()">MIDI</button>
    <button class="tbtn-sm" onclick="exportStems()">Stems</button>
    <div class="tdivider"></div>
    <button class="tbtn-sm" onclick="saveProject()">Save</button>
    <button class="tbtn-sm" onclick="document.getElementById('load-input').click()">Load</button>
    <input type="file" id="load-input" style="display:none" accept=".json" onchange="loadProject(this)">
    <button class="tbtn-sm" onclick="undoLast()">Undo</button>
    <button class="tbtn-sm danger" onclick="clearAll()">Clear</button>
  </div>
  <div id="main">
    <div id="tl-area">
      <div id="tl-header">
        <span>Timeline</span>
        <span id="tl-info">Complete calibration to begin</span>
      </div>
      <div id="tl-controls">
        <span>Markers</span>
        <select id="marker-type">
          <option value="Intro">Intro</option>
          <option value="Verse">Verse</option>
          <option value="Chorus">Chorus</option>
          <option value="Bridge">Bridge</option>
          <option value="Drop">Drop</option>
          <option value="Break">Break</option>
          <option value="Outro">Outro</option>
        </select>
        <input id="marker-bar" type="number" min="1" value="1" title="Bar number">
        <button class="tbtn-sm" onclick="addMarker()">Set</button>
        <button class="tbtn-sm" onclick="clearMarkers()">Clear</button>
      </div>
      <div id="tl-wrap"><canvas id="tl-canvas"></canvas></div>
    </div>
    <div id="right">
      <div id="panel-tabs">
        <div class="ptab on" onclick="showTab('sounds',this)">Sounds</div>
        <div class="ptab"    onclick="showTab('recs',this)">Next Layer ↑</div>
        <div class="ptab"    onclick="showTab('seq',this)">Seq</div>
        <div class="ptab"    onclick="showTab('arp',this)">Arp</div>
        <div class="ptab"    onclick="showTab('piano',this)">Piano</div>
      </div>
      <div id="panel-body"></div>
    </div>
  </div>
  <div id="curve-area">
    <div id="curve-label">Tension Curve</div>
    <div id="curve-info"></div>
    <canvas id="curve-canvas"></canvas>
  </div>
  <!-- ── Mixer panel ── -->
  <div id="mixer-panel"></div>
  <div id="transport">
    <button class="trbtn play" id="btn-play" onclick="togglePlay()">▶ Play</button>
    <div class="tr-sep"></div>
    <button class="trbtn" id="btn-loop" onclick="toggleLoop()">↺ Loop</button>
    <button class="trbtn" onclick="setLoopStart()">L-In</button>
    <button class="trbtn" onclick="setLoopEnd()">L-Out</button>
    <button class="trbtn" onclick="clearLoopRegion()">L-Clr</button>
    <div class="tr-sep"></div>
    <button class="trbtn" id="btn-record" onclick="toggleRecord()">● Rec</button>
    <button class="trbtn" id="btn-metro" onclick="toggleMetronome()">♪ Metro</button>
    <button class="trbtn" onclick="initMIDI()">MIDI</button>
    <button class="trbtn" onclick="tapTempo()">Tap</button>
    <div class="tr-sep"></div>
    <span class="tr-label">BPM</span>
    <span id="bpm-val" style="font-size:13px;color:var(--text-med);font-weight:700;min-width:30px">—</span>
    <span class="tr-label">BAR</span>
    <input type="number" id="seek-bar" value="1" min="1" style="width:40px;background:var(--dark);border:1px solid var(--border);color:var(--text-high);font-size:10px;padding:3px 6px;border-radius:var(--radius);text-align:center;font-family:inherit" onchange="seekToBar(this.value)">
    <button class="trbtn" onclick="seekToBar(document.getElementById('seek-bar').value)">Go</button>
    <span id="time-display" style="font-size:11px;color:var(--text-med);font-family:inherit;letter-spacing:2px;min-width:44px">00:00</span>
    <div class="tr-sep"></div>
    <button class="trbtn" onclick="exportProjectFile()">Export</button>
    <button class="trbtn" onclick="document.getElementById('import-file').click()">Import</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importProjectFile(this)">
    <button class="trbtn" onclick="newProject()">New</button>
    <div id="tr-info">Complete calibration to start composing</div>
  </div>
</div>

<!-- ── Onboarding overlay ── -->
<div id="onboard">
  <div id="ob-wrap">
    <div id="ob-title">Sound Calibration</div>
    <div id="ob-content"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// CIRCUIT COMPOSER v3
//
// Onboarding flow — NO MBTI/blood/gender input:
//   Step 1: 3 sliders (energy, complexity, intent)
//   Step 2: Pick 3 sounds from 8 samples
//   Step 3: System infers profile internally, shows only a
//           "sound signature" code — no pseudoscience labels
//
// Profile inference:
//   slider values + sound picks → tension range + category weights
//   → best-matching profile key from music_map.json
//   → user never sees MBTI/blood/gender
// ═══════════════════════════════════════════════════════════════

let mm = null;
let profile    = null;
let profileKey = null;
let profileVectors = {};
let selGenre   = null;
let lastTargetVec = null;
let userRH = '+';          // RH factor: '+' or '-' (default +)
let timeline   = [];
let activeTab  = 'sounds';
let isPlaying  = false;
let isLooping  = false;
let _blockIdCounter = 0;
let _blockAudio = {};   // block_id → { wavPath, audio: HTMLAudioElement }
let _markers = [];      // arrangement markers: { col, type, color }
let _playhead   = -1;   // current playing col index (-1 = stopped)
let _selectedBlock = null;
let _clipboardBlock = null;
let _seekToCol  = null; // seek target col
let _loopStart  = 0;    // loop region start col
let _loopEnd    = null; // loop region end col (null = no region)
let _playTimer  = null;
let _unsubProgress = null;

// 128 Unified Master data
let unifiedMasterData = [];

// 512 circadian shift table (128 slots × 4 layers)
let _shiftTable = {}; // key: 'slot_NNN_layer_X' → {final_vec8, energy_direction, ...}

// ── SoundFont / Genre Timbre State ────────────────────────────
let sf2Buffers = {};      // genre → AudioBuffer
let genreToGM = {};       // genre → {preset, name, role}
let sf2Loaded = false;
let _unique8D = {};   // genre → {r,h,d,p,s,gamma,g,nu} from 640_UNIQUE_8D_VECTORS.json
let _universe1318 = {}; // genre → full annotated profile from UNIVERSE_1318_ANNOTATED.json
let _genreTimbres = {
  'ambient':               { waveform: 'sine',  filt: 'lowpass',  cutoff: 800,  resonance: 1.5, attack: 2.0, decay: 4.0 },
  'aero ambient':          { waveform: 'sine',  filt: 'lowpass',  cutoff: 600,  resonance: 2.0, attack: 1.5, decay: 5.0 },
  'minimalistic ambient':  { waveform: 'sine',  filt: 'lowpass',  cutoff: 400,  resonance: 3.0, attack: 3.0, decay: 6.0 },
  'lowercase noise':       { waveform: 'sine',  filt: 'lowpass',  cutoff: 200,  resonance: 4.0, attack: 4.0, decay: 8.0 },
  'experimental folk':     { waveform: 'triangle', filt: 'lowpass', cutoff: 1200, resonance: 1.0, attack: 0.3, decay: 2.0 },
  'folk':                  { waveform: 'triangle', filt: 'lowpass', cutoff: 1200, resonance: 1.0, attack: 0.3, decay: 2.0 },
  'folk rock':             { waveform: 'sawtooth', filt: 'lowpass', cutoff: 1800, resonance: 1.2, attack: 0.1, decay: 1.5 },
  'new age':               { waveform: 'sine',  filt: 'lowpass',  cutoff: 1500, resonance: 2.0, attack: 1.0, decay: 3.0 },
  'britpop':               { waveform: 'sawtooth', filt: 'lowpass', cutoff: 2500, resonance: 1.5, attack: 0.05, decay: 1.0 },
  'indie rock':            { waveform: 'sawtooth', filt: 'lowpass', cutoff: 2200, resonance: 1.8, attack: 0.05, decay: 1.2 },

// Get GM preset for any genre — first try genre_to_gm.json, then family mapping
function getGMForGenre(genre, vec) {
  const g = (genre || '').toLowerCase();
  if (genreToGM[g]) return genreToGM[g];
  // Fuzzy match
  for (const key of Object.keys(genreToGM)) {
    if (g.includes(key) || key.includes(g)) return genreToGM[key];
  }
  // Family-based mapping
  const family = vec ? assignFamily(vec) : 'BoC Aesthetic';
  return _familyGMPreset[family] || _familyGMPreset['BoC Aesthetic'];
}

// ── Melodic lead patterns per music_role ──
// Each role gets a different melodic contour pattern
function getMelodicPattern(role, barBeats, rootMidi, scale, p) {
  const notes = [];
  const seed = Math.floor(rootMidi * 7 + p * 997) % 997;
  if (!role || role.includes('Rhythm') || role.includes('Percussion')) {
    // Rhythm-focused: sparse rhythmic hits on root and fifth
    for (let i = 0; i < barBeats; i++) {
      if (i % 2 === 0 || (p > 0.5 && Math.random() < p * 0.6)) {
        notes.push({ midi: rootMidi + (i % 4 === 0 ? 0 : 7), time: i / barBeats, dur: 0.5 / barBeats });
      }
    }
  } else if (role.includes('Lead') || role.includes('Topline') || role.includes('Hook')) {
    // Lead melody: ascending/descending phrase with passing tones
    const intervals = [0, 2, 4, 7, 4, 2, 5, 7, 9, 7, 4, 2];
    const noteCount = Math.max(4, Math.floor(barBeats * 1.5));
    for (let i = 0; i < noteCount; i++) {
      const idx = (seed + i) % intervals.length;
      const scaleIdx = intervals[idx] % scale.length;
      const octave = Math.floor(intervals[idx] / scale.length) * 12;
      notes.push({ midi: rootMidi + 12 + scale[scaleIdx] + octave, time: i / noteCount, dur: 0.8 / noteCount });
    }
  } else if (role.includes('Bass') || role.includes('Low')) {
    // Bass: root-fifth-octave pattern
    const pattern = [0, 0, 7, 0, 0, 5, 7, 0];
    for (let i = 0; i < barBeats; i++) {
      const idx = i % pattern.length;
      notes.push({ midi: rootMidi - 12 + pattern[idx], time: i / barBeats, dur: 0.9 / barBeats });
    }
  } else if (role.includes('Vocal') || role.includes('Expressive')) {
    // Vocal-like: longer expressive notes with melodic leaps
    const intervals = [0, 4, 7, 12, 9, 5, 7, 4];
    const noteCount = Math.max(3, Math.floor(barBeats * 0.75));
    for (let i = 0; i < noteCount; i++) {
      const idx = (seed + i * 3) % intervals.length;
      const scaleIdx = intervals[idx] % scale.length;
      const octave = Math.floor(intervals[idx] / scale.length) * 12;
      notes.push({ midi: rootMidi + 12 + scale[scaleIdx] + octave, time: i / noteCount, dur: 1.2 / noteCount });
    }
  } else if (role.includes('Harmony') || role.includes('Pad') || role.includes('Sustained')) {
    // Sustained harmony: long chord tones
    for (let i = 0; i < Math.min(4, barBeats); i++) {
      const degrees = [0, 2, 4, 3];
      const idx = i % degrees.length;
      notes.push({ midi: rootMidi + 12 + scale[degrees[idx] % scale.length], time: i / 4, dur: 1.0 / 4 * 0.95 });
    }
  } else if (role.includes('Texture') || role.includes('Ambient') || role.includes('Field')) {
    // Texture: sparse high notes with long decay
    const intervals = [12, 19, 24, 16];
    for (let i = 0; i < Math.min(3, barBeats); i++) {
      const idx = (seed + i) % intervals.length;
      notes.push({ midi: rootMidi + intervals[idx], time: i * 0.3, dur: 0.5 });
    }
  } else if (role.includes('Anchor') || role.includes('Root') || role.includes('Tonic')) {
    // Anchor: pedal tone with occasional movement
    for (let i = 0; i < barBeats; i++) {
      const variation = (i === Math.floor(barBeats / 2)) ? 7 : 0;
      notes.push({ midi: rootMidi + variation, time: i / barBeats, dur: 0.95 / barBeats });
    }
  } else {
    // Default: simple melodic phrase
    const intervals = [0, 2, 4, 7, 5, 2];
    for (let i = 0; i < Math.min(6, barBeats); i++) {
      const idx = (seed + i) % intervals.length;
      notes.push({ midi: rootMidi + 12 + intervals[idx], time: i / Math.min(6, barBeats), dur: 0.8 / Math.min(6, barBeats) });
    }
  }
  return notes;
}

function assignFamily(vec) {
  const { r, h, d, p, s } = vec || {};
  if (d > 0.7 && s < 0.4)        return 'Industrial Noise';
  if (d < 0.3 && s < 0.3)        return 'Ambient Drone';
  if (d < 0.3 && s > 0.6)        return 'Dream Pop Pad';
  if (r < 0.3 && h > 0.6)        return 'Chamber Acoustic';
  if (p > 0.7)                   return 'Glitch Digital';
  if (r > 0.7 && d > 0.6)        return 'Metal Heavy';
  if (s > 0.6 && h < 0.3)        return 'Bright Digital Synth';
  if (d > 0.5 && p > 0.5)        return 'Noise Rock';
  if (r > 0.6 && p < 0.2)        return 'Krautrock Motorik';
  if (s < 0.4 && p < 0.3)        return 'Muffled LoFi';
  if (h > 0.6 && r < 0.5)        return 'Orchestral String';
  if (d > 0.4 && s > 0.5)        return 'Plucked Folk';
  if (r > 0.5 && h < 0.3)        return 'Hip Hop Bass';
  if (h > 0.5 && d < 0.5 && s < 0.5) return 'Warm Analog Pad';
  return 'BoC Aesthetic';
}

function getFamilyTimbre(family, vec) {
  const def = _timbreFamilies[family] || _timbreFamilies['BoC Aesthetic'];
  const t = { ...def.base };  // one allocation, consumed immediately by caller
  if (vec) {
    if (def.rMod) def.rMod(t, clamp01(vec.r));
    if (def.hMod) def.hMod(t, clamp01(vec.h));
    if (def.dMod) def.dMod(t, clamp01(vec.d));
    if (def.sMod) def.sMod(t, clamp01(vec.s));
    // 8D spatial / binding / recursion mods (internal only)
    if (vec.gamma != null) {
      t.reverbDecay = (t.reverbDecay || 1.0) * (0.5 + clamp01(vec.gamma) * 4);
      t.stereoWidth = 0.2 + clamp01(vec.gamma) * 0.8;
    }
    if (vec.g != null) {
      t.voicingTightness = 0.5 + clamp01(vec.g) * 0.5;
      t.unisonDetune = clamp01(vec.g) * 0.03;
    }
    if (vec.nu != null) {
      t.patternDepth = Math.floor(1 + clamp01(vec.nu) * 4);
      t.selfSimilarity = clamp01(vec.nu);
    }
  }
  return t;
}

// Pre-computed family for every 128 slot
let _slotFamilies = [];
let _slotFamilyMap = new Map();
function buildSlotFamilies() {
  if (!unifiedMasterData.length) return;
  _slotFamilies = unifiedMasterData.map(row => {
    const order = parseInt(row.Reverse_Order) || 0;
    const vec = {
      r: parseFloat(row['Tension_R_Release'] || 0),
      h: parseFloat(row['Tension_H_Release'] || 0),
      d: parseFloat(row['Tension_D_Release'] || 0),
      p: parseFloat(row['Tension_P_Release'] || 0),
      s: parseFloat(row['Tension_S_Release'] || 0)
    };
    const stressVec = {
      r: parseFloat(row['Tension_R_Stress'] || 0),
      h: parseFloat(row['Tension_H_Stress'] || 0),
      d: parseFloat(row['Tension_D_Stress'] || 0),
      p: parseFloat(row['Tension_P_Stress'] || 0),
      s: parseFloat(row['Tension_S_Stress'] || 0)
    };
    const extremeVec = {
      r: parseFloat(row['Tension_R_Extreme'] || 0),
      h: parseFloat(row['Tension_H_Extreme'] || 0),
      d: parseFloat(row['Tension_D_Extreme'] || 0),
      p: parseFloat(row['Tension_P_Extreme'] || 0),
      s: parseFloat(row['Tension_S_Extreme'] || 0)
    };
    const mbti = (row.MBTI || '').trim();
    let temperament = 'NF';
    if (mbti.length >= 4) {
      const n = mbti[1], t = mbti[2], j = mbti[3];
      if (n === 'N' && t === 'F') temperament = 'NF';
      else if (n === 'N' && t === 'T') temperament = 'NT';
      else if (n === 'S' && j === 'J') temperament = 'SJ';
      else if (n === 'S' && j === 'P') temperament = 'SP';
    }
    return {
      order,
      genre: row.Genre_Release || '',
      family: assignFamily(vec),
      vec,
      stressVec,
      extremeVec,
      temperament,
      mbti,
      profileKey: (row.Profile_Key || '').trim(),
      bpm: parseInt(row.BPM_Release) || 120
    };
  }).filter(s => s.order >= 1 && s.order <= 128);
  _slotFamilyMap = new Map(_slotFamilies.map(s => [s.order, s]));
  console.log('Slot families built:', _slotFamilies.length);
}

function getTimbreForGenre(genre, vec) {
  const g = (genre || 'ambient').toLowerCase();
  // 1. Exact genre match in legacy table
  if (_genreTimbres[g]) return _genreTimbres[g];
  // 2. Substring match (e.g. "dark ambient" → "ambient")
  for (const key of Object.keys(_genreTimbres)) {
    if (g.includes(key) || key.includes(g)) return _genreTimbres[key];
  }
  // 3. Family-modulated timbre derived from 5D vector
  const family = vec ? assignFamily(vec) : 'BoC Aesthetic';
  return getFamilyTimbre(family, vec);
}

function inferTensionFromTimbre(t, genre) {
  const g = (genre || '').toLowerCase();
  const s = Math.min(1, (t.cutoff || 2000) / 5000);
  // Rhythm: faster attack / brighter timbre = more rhythmic energy
  const r = Math.min(1, (t.cutoff || 2000) / 4000 + 1 / (1 + (t.attack || 0.5) * 10));
  // Dynamics: long attack / long decay = high dynamic range
  const d = Math.min(1, 1 / (1 + (t.attack || 0.5) * 2));
  // Harmonic tension: high resonance or bright waveform = more tension
  let h = Math.min(1, (t.resonance || 1) / 5 + s * 0.3);
  // Predictability: chaotic/noise/glitch = high p, classical/ambient = low p
  let p = Math.min(1, ((t.cutoff || 2000) > 3000 ? 0.6 : 0) + ((t.resonance || 1) > 3 ? 0.4 : 0));

  // Genre-name overrides for stronger musical identity
  if (g.includes('drone') || g.includes('ambient') || g.includes('lowercase') || g.includes('field') || g.includes('grouper')) {
    return { r: 0.15, h: 0.25, d: 0.75, p: 0.15, s: 0.25, score: 0.31 };
  }
  if (g.includes('lofi') || g.includes('folk') || g.includes('chill') || g.includes('new age') || g.includes('gabu')) {
    return { r: 0.35, h: 0.30, d: 0.40, p: 0.20, s: 0.30, score: 0.31 };
  }
  if (g.includes('jazz') || g.includes('soul') || g.includes('funk') || g.includes('country') || g.includes('blues')) {
    return { r: 0.55, h: 0.55, d: 0.45, p: 0.40, s: 0.45, score: 0.48 };
  }
  if (g.includes('rock') || g.includes('metal') || g.includes('industrial') || g.includes('punk') || g.includes('noise') || g.includes('harsh')) {
    return { r: 0.85, h: 0.75, d: 0.65, p: 0.55, s: 0.70, score: 0.70 };
  }
  if (g.includes('idm') || g.includes('glitch') || g.includes('break') || g.includes('techno') || g.includes('drum') || g.includes('hardcore') || g.includes('dnb') || g.includes('jungle')) {
    return { r: 0.92, h: 0.60, d: 0.55, p: 0.80, s: 0.75, score: 0.72 };
  }
  if (g.includes('synthwave') || g.includes('retrowave') || g.includes('pop') || g.includes('britpop') || g.includes('indie rock')) {
    return { r: 0.65, h: 0.45, d: 0.35, p: 0.25, s: 0.60, score: 0.46 };
  }
  if (g.includes('boards') || g.includes('hauntology') || g.includes('experimental electronic') || g.includes('procedural')) {
    return { r: 0.45, h: 0.50, d: 0.60, p: 0.55, s: 0.40, score: 0.50 };
  }

  return { r: clamp01(r), h: clamp01(h), d: clamp01(d), p: clamp01(p), s: clamp01(s), score: (r + h + d + p + s) / 5 };
}

function inferScoreFromTimbre(t) {
  return inferTensionFromTimbre(t).score;
}

function createMinimalMusicMap() {
  const gc = { release: [], stress_growth: [], extreme_growth: [], observer: { genres: [] } };
  const gtp = {};
  const mg = {
    "baroque":"neo-classical","jazz":"nu-jazz","emotional hip hop":"boards of canada",
    "conventional classical":"neo-classical","k-pop structured":"city pop","edm":"big beat",
    "mainstream R&B":"neo-soul","pop":"indie pop","dance pop":"synthwave",
    "synth pop":"synthwave","trap":"hip hop","drill":"industrial electronic",
    "classic rock":"psychedelic rock","arena rock":"prog rock","pop soul":"soul",
    "motown":"soul","country rock":"folk","pop country":"indie folk"
  };
  Object.keys(_genreTimbres).forEach(genre => {
    const t = _genreTimbres[genre];
    const vec = inferTensionFromTimbre(t, genre);
    gtp[genre] = { ...vec, tags: [] };
    if (vec.score < 0.35) gc.release.push(genre);
    else if (vec.score < 0.65) gc.stress_growth.push(genre);
    else gc.extreme_growth.push(genre);
  });
  // Add onboarding sample genres with distinct profiles
  OB_SAMPLES.forEach(s => {
    const g = (s.coreGenre || s.genre || '').toLowerCase();
    if (!gtp[g]) {
      gtp[g] = inferTensionFromSample(s);
    }
  });
  const profile = { release: gc.release.slice(0,5), stress_growth: gc.stress_growth.slice(0,5), extreme_growth: gc.extreme_growth.slice(0,5), references: [] };
  return {
    _meta: { genre_categories: gc, mainstream_gateway: mg },

}

function getReverseEnergyPhase(hour) {
  // 0-3 AB discharge, 3-9 A accumulate, 9-15 O accumulate, 15-21 B accumulate, 21-3 AB accumulate
  if (hour >= 0 && hour < 3) return 'AB_discharge';
  if (hour >= 3 && hour < 9) return 'A_accumulate';
  if (hour >= 9 && hour < 15) return 'O_accumulate';
  if (hour >= 15 && hour < 21) return 'B_accumulate';
  return 'AB_accumulate';
}
function applyHysteresisShuffle(vec, hour, rh, slotPos) {
  // slotPos: 1~128 position in the 128 time window (bar position mapped to slot)
  // Deterministic micro-variation: D (attack envelope), S (spectral brightness), RH bias
  const phase = getReverseEnergyPhase(hour);
  const isDischarge = phase.includes('discharge');
  const seedBase = profileKey ? profileKey.split('').reduce((a,c)=>a+c.charCodeAt(0),0) : 0;
  const hSeed = (hour * 13 + seedBase) % 97;
  const dDelta = ((hSeed % 31) - 15) / 100 * 0.15;
  const sDelta = (((hSeed * 7) % 31) - 15) / 100 * 0.15;
  const dShift = isDischarge ? dDelta : -dDelta;
  const sShift = isDischarge ? sDelta : -sDelta;
  const rhDir = getRHDirection(rh || '+');
  const rhBias = (rhDir.melodicContour === 'ascending') ? 0.08 : -0.08;
  let out = {
    ...vec,
    d: clamp01(vec.d + dShift),
    s: clamp01(vec.s + sShift),
    r: clamp01(vec.r + (isDischarge ? Math.abs(dShift)*0.5 : -Math.abs(dShift)*0.5) + rhBias)
  };
  // 3AM hysteresis zone: slots 1~16 (AB_Discharge, 00:00~03:00)
  // memory_entropy / peonidine / reverse_co2 related params: p, s, nu
  // ST/SF heterozygous: only p and s are randomized; nu is pinned near maximum
  // Other profiles: p and s fully randomized; nu randomized but leans toward max
  if (slotPos != null && slotPos >= 1 && slotPos <= 16) {
    const _layer3am = getLayer(profileKey, rh);
    out.p = clamp01(Math.random());
    out.s = clamp01(0.5 + Math.random() * 0.5);
    if (_layer3am === 'D') {
      // Heterozygous RH- : maximum 3AM entropy (peonidine/reverse-CO2/memory-entropy zone)
      out.p  = clamp01(Math.random());
      out.s  = clamp01(Math.random());
      out.nu = 0.9 + Math.random() * 0.1;
      out.g  = clamp01((out.g || 0.5) * (0.3 + Math.random() * 0.4)); // gluon collapse
    } else if (_layer3am === 'C') {
      // Homozygous RH- : nu elevated (ghost flux), p/s stable
      out.nu = clamp01((out.nu || 0.5) + 0.15 + Math.random() * 0.1);
    } else if (isStSfHeterozygous(profileKey)) {
      // ST/SF Heterozygous RH+ : nu pinned near max
      out.nu = 0.9 + Math.random() * 0.1;
    } else {
      out.nu = out.nu != null ? clamp01(out.nu * (0.7 + Math.random() * 0.3)) : 0.7 + Math.random() * 0.3;
    }
  }
  return out;
}

// No MusicGen. No pre-made models.
// Tension_profile parameters directly control:

//   2. Harmonic chord structure
//   3. Spectral filter trajectory
//   4. Spatial reverb/delay

// ── Math: Euclidean Rhythm ──────────────────────────────────
function euclideanRhythm(pulses, steps) {
  // Bjorklund's algorithm: distribute `pulses` across `steps` evenly
  const pattern = new Array(steps).fill(0);
  if (pulses === 0 || steps === 0) return pattern;
  const divisor = steps / pulses;
  for (let i = 0; i < pulses; i++) {
    pattern[Math.floor(i * divisor)] = 1;
  }
  return pattern;
}

function getRootMidi(block, H) {
  const key = getBlockKey(block);
  // Match original frequency mapping: low tension → 220Hz (A3=69), mid → 110Hz (A2=57), high → 55Hz (A1=45)
  const base = H > 0.7 ? 45 : H > 0.4 ? 57 : 69;
  return base + key.root;
}

// ── The Engine ──────────────────────────────────────────────
// All 5 axes from genre_tension_profiles now drive synthesis:
//   r (rhythm_density)       → BPM, Euclidean pulse count
//   h (harmonic_tension)     → chord dissonance, FM depth
//   d (dynamic_curve)        → envelope attack/release shape
//   p (predictability_inverse)→ timing jitter, pattern chaos
//   s (spectral_brightness)  → filter cutoff, waveform type
function circuitSynthesize(blockOrParams, startTime, duration) {
  try {
  if (!obAudioCtx) obAudioCtx = new(window.AudioContext||window.webkitAudioContext)();
  const s = startTime;
  const dur = duration;
  const nodes = [];

  // Accept either a block object or a simple {r,h,d,p,s,bpm,genre} params object
  let params = blockOrParams;
  let isBlock = !!blockOrParams.genre;
  if (isBlock && !blockOrParams.r) {
    // Extract 8D from genre lookup + internal profile
    const rawVec = blockOrParams.vec || getTension8D(blockOrParams.coreGenre || blockOrParams.genre, profileKey);
    const hour = new Date().getHours();
    const traits = resolveUserTraits(profileKey);
    // Map bar col position → 128 slot position for 3AM hysteresis
    const totalCols = Math.max(timeline.length * 2, 16);
    const barCol = blockOrParams.col != null ? blockOrParams.col : 0;
    const slotPos = Math.floor((barCol / totalCols) * 128) + 1;
    const vec = applyHysteresisShuffle(rawVec, hour, traits.rh, slotPos);
    params = {r: vec.r, h: vec.h, d: vec.d, p: vec.p, s: vec.s, gamma: vec.gamma, g: vec.g, nu: vec.nu, bpm: blockOrParams.bpm || getBPM(blockOrParams.coreGenre || blockOrParams.genre), genre: blockOrParams.genre || 'unknown'};
  }

  const R = params.r != null ? params.r : 0.5;
  const H = params.h != null ? params.h : 0.5;
  const D = params.d != null ? params.d : 0.5;
  const P = params.p != null ? params.p : 0.5;
  const S = params.s != null ? params.s : 0.5;
  const Gamma = params.gamma != null ? params.gamma : 0.5;
  const G = params.g != null ? params.g : 0.5;
  const Nu = params.nu != null ? params.nu : 0.5;
  const bpm = params.bpm || 120;
  const beatDur  = 60 / bpm;
  const barBeats = Math.max(4, Math.floor(dur / beatDur));

  // ── r → Euclidean rhythm density ──
  const density     = Math.max(1, Math.round(R * 16));
  // p adds jitter to the density (unpredictable patterns)
  const kickPulses  = Math.max(1, Math.round(density * (0.3 + P * 0.2)));
  const snrPulses   = Math.max(0, Math.round(density * (0.2 + P * 0.15)));
  const hatPulses   = Math.max(1, Math.round(density * (0.5 + P * 0.3)));
  const kickPattern = euclideanRhythm(kickPulses, barBeats);
  const snrPattern  = euclideanRhythm(snrPulses,  barBeats);
  const hatPattern  = euclideanRhythm(hatPulses,  barBeats);

  // ── Route to track bus (per-lane mixer strip) ──
  const mixer = ensureMixer();
  const trackInput = mixer.getTrackInput(blockOrParams.lane ?? 0);
  const _dest = trackInput || mixer.master.gain;

  // ── Block-level gain envelope ──
  const blockGain = obAudioCtx.createGain();
  const fadeIn  = _fadeTime + (1 - D) * 1.5;
  const fadeOut = _fadeTime + (1 - D) * 1.0;
  blockGain.gain.setValueAtTime(0, s);
  blockGain.gain.linearRampToValueAtTime(0.88, s + fadeIn);
  blockGain.gain.setValueAtTime(0.88, s + dur - fadeOut);
  blockGain.gain.linearRampToValueAtTime(0, s + dur);
  blockGain.connect(_dest);

  // ── Per-block reverb send (h drives wet/dry, s drives brightness, gamma drives spatial depth) ──
  const revWet = 0.15 + (1 - S) * 0.55 + Gamma * 0.25;
  const blockRevSend = obAudioCtx.createGain();
  blockRevSend.gain.value = revWet * 0.5;
  blockRevSend.connect(mixer.reverb.gain);

  // ── Genre family (used for percussion & bass character) ──
  const genreName = (blockOrParams.coreGenre || blockOrParams.genre || 'ambient').toLowerCase();
  const vecForFamily = blockOrParams.vec || { r: R, h: H, d: D, p: P, s: S };
  const family = (!_genreTimbres[genreName]) ? assignFamily(vecForFamily) : '';

  // ── TIMBRE & HARMONY SETUP (must be before bass/chord/lead layers) ──
  const genre = genreName;
  const vecForTimbre = vecForFamily;
  const timbre = getTimbreForGenre(genre, vecForTimbre);
  const chordCount = Math.min(8, Math.max(2, Math.floor(dur / 2)));
  const key = getBlockKey(blockOrParams);
  const rootMidi = getRootMidi(blockOrParams, H);
  const progression = pickProgression(H, blockOrParams.col * 0.3 + blockOrParams.lane * 0.1);
  const chordQualOverride = getGenreChordQuality(genreName, null);

  // ── PERCUSSION LAYER ──
  // r → kick volume, p → timing jitter
  // Family-aware percussion: ambient/drone = sparse/soft, industrial/metal = hard/aggressive
  const isAmbientFam = family === 'Ambient Drone' || family === 'BoC Aesthetic' || family === 'Dream Pop Pad' || family === 'Muffled LoFi';
  const isAggroFam   = family === 'Industrial Noise' || family === 'Metal Heavy' || family === 'Noise Rock' || family === 'Glitch Digital';
  const hasPercussion = R >= 0.25;
  const kickGainMul  = isAmbientFam ? 0.15 : isAggroFam ? 0.7 : 0.45;
  const kickDecayMul = isAmbientFam ? 1.8 : isAggroFam ? 0.6 : 1.0;
  const kickClickMul = isAggroFam ? 1.0 : isAmbientFam ? 0.1 : 0.4;
  const snrGainMul   = isAmbientFam ? 0.1 : isAggroFam ? 0.8 : 0.45;
  const hatGainMul   = isAmbientFam ? 0.1 : isAggroFam ? 0.7 : 0.45;

  if (hasPercussion) {
  kickPattern.forEach((hit, i) => {
    if (!hit) return;
    const jitter = P * 0.015 * (Math.random() - 0.5);
    const t0 = s + i * beatDur + jitter;
    const o = obAudioCtx.createOscillator();
    const g = obAudioCtx.createGain();
    o.type = isAggroFam ? 'square' : 'sine';
    const kickFreqHigh = (isAggroFam ? 120 : 80) + R * 120;
    o.frequency.setValueAtTime(kickFreqHigh, t0);
    o.frequency.exponentialRampToValueAtTime((isAggroFam ? 40 : 30) + R * 20, t0 + 0.06 + (1 - D) * 0.1);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.28 * R * kickGainMul, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + (0.3 + (1 - D) * 0.3) * kickDecayMul);
    // Click transient (high-pass noise burst)
    const clickSize = Math.floor(obAudioCtx.sampleRate * 0.01);
    const clickBuf = obAudioCtx.createBuffer(1, clickSize, obAudioCtx.sampleRate);
    const cd = clickBuf.getChannelData(0);
    for (let k = 0; k < clickSize; k++) cd[k] = (Math.random() * 2 - 1) * (1 - k / clickSize);
    const clickSrc = obAudioCtx.createBufferSource();
    const clickGain = obAudioCtx.createGain();
    const clickFilt = obAudioCtx.createBiquadFilter();
    clickFilt.type = 'highpass'; clickFilt.frequency.value = isAggroFam ? 3500 : 2000;
    clickSrc.buffer = clickBuf;
    clickGain.gain.setValueAtTime(0, t0);
    clickGain.gain.linearRampToValueAtTime(0.12 * R * kickClickMul, t0 + 0.003);
    clickGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.02);
    clickSrc.connect(clickFilt); clickFilt.connect(clickGain); clickGain.connect(blockGain);
    clickSrc.start(t0);

    o.connect(g); g.connect(blockGain);
    o.start(t0); o.stop(t0 + 0.6);
    nodes.push({osc:o, gain:g}, {osc:clickSrc, gain:clickGain});
  });
  }

  // ── BASS LAYER (follows chord progression roots) ──
  const bassWave = isAggroFam ? 'sawtooth' : 'sine';
  const bassKey = key;
  const bassRootMidi = rootMidi;
  const bassProg = progression;
  for (let ci = 0; ci < chordCount; ci++) {
    const degree = bassProg[ci % bassProg.length];
    const chordNotes = getChordNotes(bassRootMidi, degree, bassKey.scale, chordQualOverride);
    const bassNote = chordNotes[0] - 12; // octave down
    const freq = midiToFreq(bassNote);
    const t0 = s + (ci / chordCount) * dur;
    const noteDur = dur / chordCount;
    const o = obAudioCtx.createOscillator();
    const g = obAudioCtx.createGain();
    const f = obAudioCtx.createBiquadFilter();
    o.type = bassWave;
    o.frequency.setValueAtTime(freq, t0);
    // Pitch bend: subtle for smooth genres, more aggressive for industrial
    const bendAmt = (family === 'Industrial Noise' || family === 'Metal Heavy') ? 0.85 : 0.97;
    o.frequency.exponentialRampToValueAtTime(freq * bendAmt, t0 + noteDur * 0.8);
    f.type = 'lowpass';
    f.frequency.value = Math.max(200, (timbre.cutoff || 800) * 0.3);
    f.Q.value = 0.5 + (timbre.resonance || 1) * 0.3;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.28 * R, t0 + Math.max(0.02, timbre.attack || 0.06));
    g.gain.exponentialRampToValueAtTime(0.001, t0 + noteDur * 0.95);
    o.connect(f); f.connect(g); g.connect(blockGain);
    o.start(t0); o.stop(t0 + noteDur);
    nodes.push({osc:o, gain:g});
  }

  // Snare: body + noise tail
  if (hasPercussion && R > 0.35) {
  const snareGainMul = isAmbientFam ? 0.08 : isAggroFam ? 0.7 : 0.4;
  const snareNoiseMul = isAmbientFam ? 0.08 : isAggroFam ? 0.8 : 0.5;
  snrPattern.forEach((hit, i) => {
    if (!hit) return;
    const jitter = P * 0.01 * (Math.random() - 0.5);
    const t0 = s + i * beatDur + jitter;
    // Body: tuned oscillator
    const bodyOsc = obAudioCtx.createOscillator();
    const bodyGain = obAudioCtx.createGain();
    bodyOsc.type = isAggroFam ? 'sawtooth' : 'triangle';
    bodyOsc.frequency.setValueAtTime(180 + S * 60, t0);
    bodyOsc.frequency.exponentialRampToValueAtTime(120, t0 + 0.06);
    bodyGain.gain.setValueAtTime(0, t0);
    bodyGain.gain.linearRampToValueAtTime((0.14 + R * 0.08) * snareGainMul, t0 + 0.005);
    bodyGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.12);
    bodyOsc.connect(bodyGain); bodyGain.connect(blockGain);
    bodyOsc.start(t0); bodyOsc.stop(t0 + 0.15);
    // Noise tail
    const bufSize = Math.floor(obAudioCtx.sampleRate * 0.22);
    const buffer = obAudioCtx.createBuffer(1, bufSize, obAudioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let j = 0; j < bufSize; j++) data[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / bufSize, 1.5);
    const src = obAudioCtx.createBufferSource();
    const g   = obAudioCtx.createGain();
    const f   = obAudioCtx.createBiquadFilter();
    f.type = isAggroFam ? 'highpass' : 'bandpass';
    f.frequency.value = isAggroFam ? 1500 + S * 3000 : 600 + S * 2000;
    f.Q.value = isAggroFam ? 3.0 : 1.5;
    src.buffer = buffer;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime((0.10 + R * 0.06) * snareNoiseMul, t0 + 0.003);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.18 + (1 - D) * 0.15);
    src.connect(f); f.connect(g); g.connect(blockGain);
    src.start(t0);
    nodes.push({osc:bodyOsc, gain:bodyGain}, {osc:src, gain:g});
  });
  }

  // Hi-hat: metallic multi-oscillator
  if (hasPercussion && R > 0.45) {
  const hatWave = isAggroFam ? 'sawtooth' : 'square';
  const localHatGainMul = isAmbientFam ? 0.08 : isAggroFam ? 0.6 : 0.35;
  hatPattern.forEach((hit, i) => {
    if (!hit) return;
    const jitter = P * 0.008 * (Math.random() - 0.5);
    const t0 = s + i * beatDur + jitter;
    const baseFreq = 5000 + S * 6000;
    // Sum 3 waves at inharmonic ratios for metallic character
    [1, 1.47, 2.03].forEach((ratio, idx) => {
      const o = obAudioCtx.createOscillator();
      const g = obAudioCtx.createGain();
      o.type = hatWave;
      o.frequency.setValueAtTime(baseFreq * ratio, t0);
      const amp = ((0.012 + S * 0.012) / (idx + 1)) * localHatGainMul;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(amp, t0 + 0.002);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.04 + (1 - D) * 0.04);
      o.connect(g); g.connect(blockGain);
      o.start(t0); o.stop(t0 + 0.06);
      nodes.push({osc:o, gain:g});
    });
  });
  }

  // ── SF2 SOUND FONT: Primary instrument layer ──
  // Uses getGMForGenre so ALL 1318 genres get a real instrument sample
  // When SF2 is loaded, it plays BOTH chords and melody as the main instrument
  // Oscillator layers are only used as fallback when SF2 is not yet loaded
  const gm = getGMForGenre(genre, vecForTimbre);
  const sf2CacheKey = gm ? `preset_${String(gm.preset).padStart(3, '0')}` : null;
  const sf2Buf = sf2CacheKey ? sf2Buffers[sf2CacheKey] : null;
  const sf2Loaded = !!sf2Buf;
  const sf2BaseFreq = sf2Buf ? (sf2Buf._baseFreq || 261.63) : 261.63; // assume C4

  // Trigger background load if not yet loaded
  if (gm && !sf2Loaded) {
    loadSF2Sample(genre).catch(() => {});
  }

  // ── Melodic metadata from 1318 universe ──
  const universeEntry = _universe1318[genre] || (blockOrParams.genre ? _universe1318[blockOrParams.genre] : null);
  const musicRole = universeEntry?.music_role || '';
  const musicRegister = universeEntry?.music_register || 'Mid-high (C3-C5)';
  const regBase = _registerToMidiBase[musicRegister] || 48;
  const leadRootMidi = Math.max(24, Math.min(84, regBase + Math.floor(H * 12 - 6)));
  const leadScale = key.scale || [0, 2, 4, 5, 7, 9, 11];
  const leadNotes = getMelodicPattern(musicRole, barBeats, leadRootMidi, leadScale, P);

  // ── CHORD LAYER ──
  // SF2 chords: primary when sample loaded; Oscillator chords: fallback only
  const oscChordGain = sf2Loaded ? 0.15 : 0.7; // reduce oscillators when SF2 plays
  for (let ci = 0; ci < chordCount; ci++) {
    const degree = progression[ci % progression.length];
    const chordNotes = getChordNotes(rootMidi, degree, key.scale, chordQualOverride);
    const chordStart = s + (ci / chordCount) * dur;
    const chordDur = dur / chordCount;
    const playNotes = [...chordNotes];
    if (Nu > 0.6) playNotes.push(chordNotes[0] + 12);
    if (Nu > 0.85) playNotes.push(chordNotes[0] + 24);

    // SF2 chord notes
    if (sf2Loaded) {
      playNotes.forEach((noteMidi) => {
        const noteFreq = midiToFreq(noteMidi);
        const playbackRate = noteFreq / sf2BaseFreq;
        const src = obAudioCtx.createBufferSource();
        const g = obAudioCtx.createGain();
        const f = obAudioCtx.createBiquadFilter();
        src.buffer = sf2Buf;
        src.playbackRate.value = Math.max(0.25, Math.min(4.0, playbackRate));
        f.type = 'lowpass';
        f.frequency.value = Math.max(500, (timbre.cutoff || 2000) * (0.5 + S * 0.5));
        f.Q.value = 0.5;
        const atk = Math.min(chordDur * 0.2, timbre.attack || 0.05);
        const noteGain = (0.5 / playNotes.length);
        g.gain.setValueAtTime(0, chordStart);
        g.gain.linearRampToValueAtTime(noteGain, chordStart + atk);
        g.gain.setValueAtTime(noteGain * 0.8, chordStart + chordDur * 0.7);
        g.gain.exponentialRampToValueAtTime(0.001, chordStart + chordDur * 0.95);
        src.connect(f); f.connect(g); g.connect(blockGain);
        g.connect(blockRevSend);
        src.start(chordStart); src.stop(chordStart + chordDur + 0.05);
        nodes.push({osc: src, gain: g});
      });
    }

    // Oscillator chord notes (fallback or quiet background)
    playNotes.forEach((noteMidi) => {
      const freq = midiToFreq(noteMidi);
      const car     = obAudioCtx.createOscillator();
      const carGain = obAudioCtx.createGain();
      const mod     = obAudioCtx.createOscillator();
      const modGain = obAudioCtx.createGain();
      const filter  = obAudioCtx.createBiquadFilter();
      car.type = (timbre.waveform === 'sine' ? 'triangle' : timbre.waveform) || (S < 0.35 ? 'triangle' : 'sawtooth');
      car.frequency.setValueAtTime(freq, chordStart);
      car.detune.value = (G - 0.5) * 20;
      const fmAggro = isAggroFam ? 0.4 : isAmbientFam ? 0.08 : 0.2;
      const modRatio = 1 + H * 0.5 * fmAggro;
      const modDepth = (H * 15 + P * 25) * fmAggro;
      mod.frequency.setValueAtTime(freq * modRatio, chordStart);
      modGain.gain.setValueAtTime(modDepth, chordStart);
      modGain.gain.exponentialRampToValueAtTime(0.001, chordStart + chordDur);
      mod.connect(modGain); modGain.connect(car.frequency);
      filter.type = timbre.filt || 'lowpass';
      const filtStart = Math.max(400, (timbre.cutoff * 0.5) || (80 + S * 200));
      const filtEnd   = Math.max(1500, (timbre.cutoff || (300 + S * 8000)) * 1.5);
      filter.frequency.setValueAtTime(filtStart, chordStart);
      filter.frequency.exponentialRampToValueAtTime(filtEnd, chordStart + chordDur * (0.2 + D * 0.4));
      filter.Q.setValueAtTime(Math.min(4, timbre.resonance || (0.5 + H * 8)), chordStart);
      const atkTime = Math.min(chordDur * 0.3, timbre.attack || (0.1 + (1 - D) * 2.5));
      const decTime = chordDur * 0.95;
      const noteGain = (oscChordGain / chordNotes.length);
      carGain.gain.setValueAtTime(0, chordStart);
      carGain.gain.linearRampToValueAtTime(noteGain, chordStart + atkTime);
      carGain.gain.exponentialRampToValueAtTime(0.001, chordStart + decTime);
      car.connect(filter); filter.connect(carGain); carGain.connect(blockGain);
      carGain.connect(blockRevSend);
      mod.start(chordStart); mod.stop(chordStart + chordDur);
      car.start(chordStart); car.stop(chordStart + chordDur);
      nodes.push({osc:car, gain:carGain}, {osc:mod, gain:modGain});
    });
  }

  // ── MELODIC LEAD LAYER ──
  // SF2 lead: primary when sample loaded; Oscillator lead: fallback only
  const oscLeadAmp = sf2Loaded ? 0.04 : (0.18 + R * 0.12); // almost mute when SF2 plays

  // SF2 melodic lead
  if (sf2Loaded) {
    leadNotes.forEach((n) => {
      const noteFreq = midiToFreq(n.midi);
      const noteStart = s + n.time * dur;
      const noteDur = n.dur * dur;
      const src = obAudioCtx.createBufferSource();
      const sf2Gain = obAudioCtx.createGain();
      const sf2Filt = obAudioCtx.createBiquadFilter();
      src.buffer = sf2Buf;
      const playbackRate = noteFreq / sf2BaseFreq;
      src.playbackRate.value = Math.max(0.25, Math.min(4.0, playbackRate));
      sf2Filt.type = 'lowpass';
      sf2Filt.frequency.value = Math.max(800, (timbre.cutoff || 2000) * (0.7 + S * 0.5));
      const atk = Math.min(noteDur * 0.15, timbre.attack || 0.05);
      const leadAmp = 0.35 + R * 0.15;
      sf2Gain.gain.setValueAtTime(0, noteStart);
      sf2Gain.gain.linearRampToValueAtTime(leadAmp, noteStart + atk);
      sf2Gain.gain.exponentialRampToValueAtTime(0.001, noteStart + noteDur);
      src.connect(sf2Filt); sf2Filt.connect(sf2Gain); sf2Gain.connect(blockGain);
      sf2Gain.connect(blockRevSend);
      src.start(noteStart); src.stop(noteStart + noteDur + 0.05);
      nodes.push({osc: src, gain: sf2Gain});
    });
  }

  // Oscillator lead (fallback or very quiet background)
  leadNotes.forEach((n) => {
    const noteFreq = midiToFreq(n.midi);
    const noteStart = s + n.time * dur;
    const noteDur = n.dur * dur;
    const leadOsc = obAudioCtx.createOscillator();
    const leadGain = obAudioCtx.createGain();
    const leadFilt = obAudioCtx.createBiquadFilter();
    leadOsc.type = timbre.waveform || (S < 0.4 ? 'triangle' : 'sawtooth');
    leadOsc.frequency.setValueAtTime(noteFreq, noteStart);
    if (D > 0.4) {
      leadOsc.frequency.setValueAtTime(noteFreq, noteStart);
      leadOsc.frequency.linearRampToValueAtTime(noteFreq * 1.003, noteStart + noteDur * 0.5);
      leadOsc.frequency.linearRampToValueAtTime(noteFreq, noteStart + noteDur);
    }
    leadFilt.type = timbre.filt || 'lowpass';
    leadFilt.frequency.value = Math.max(600, (timbre.cutoff || 2000) * (0.6 + S * 0.6));
    leadFilt.Q.value = timbre.resonance || 1;
    const leadAtk = Math.min(noteDur * 0.2, timbre.attack || 0.05);
    leadGain.gain.setValueAtTime(0, noteStart);
    leadGain.gain.linearRampToValueAtTime(oscLeadAmp, noteStart + leadAtk);
    leadGain.gain.exponentialRampToValueAtTime(0.001, noteStart + noteDur);
    leadOsc.connect(leadFilt); leadFilt.connect(leadGain); leadGain.connect(blockGain);
    leadGain.connect(blockRevSend);
    leadOsc.start(noteStart); leadOsc.stop(noteStart + noteDur + 0.05);
    nodes.push({osc: leadOsc, gain: leadGain});
  });

  // ── TEXTURE LAYER (Spectral Noise) ──
  // h + p drive noise presence and character
  if (H > 0.5 || P > 0.6) {
    const noiseAmp = Math.max(0, (H - 0.4) * 0.3 + (P - 0.4) * 0.2);
    if (noiseAmp > 0.01) {
      const noiseLen = Math.floor(obAudioCtx.sampleRate * Math.min(dur, 8));
      const noiseBuf = obAudioCtx.createBuffer(1, noiseLen, obAudioCtx.sampleRate);
      const nd = noiseBuf.getChannelData(0);
      for (let i = 0; i < noiseLen; i++) nd[i] = (Math.random() * 2 - 1) * noiseAmp;
      const nSrc  = obAudioCtx.createBufferSource();
      const nGain = obAudioCtx.createGain();
      const nFilt = obAudioCtx.createBiquadFilter();
      nFilt.type = 'bandpass';
      nFilt.frequency.setValueAtTime(200 + S * 4000, s);  // s → noise colour
      nFilt.Q.value = 0.5 + H;
      nGain.gain.setValueAtTime(0, s);
      nGain.gain.linearRampToValueAtTime(noiseAmp * 0.06, s + dur * 0.15);
      nGain.gain.setValueAtTime(noiseAmp * 0.06, s + dur * 0.85);
      nGain.gain.linearRampToValueAtTime(0, s + dur);
      nSrc.buffer = noiseBuf;
      nSrc.connect(nFilt); nFilt.connect(nGain); nGain.connect(blockGain);
      nSrc.start(s); nSrc.stop(s + dur);
      nodes.push({osc:nSrc, gain:nGain});
    }
  }

  // ── DISTORTION (high h + high p = extreme genres) ──
  const distAmt = Math.max(0, (H - 0.65) * 0.6 + (P - 0.65) * 0.4);
  if (distAmt > 0.05) {
    const waveshaper = obAudioCtx.createWaveShaper();
    const k = distAmt * 30;
    const n_samples = 256;
    const curve = new Float32Array(n_samples);
    for (let i = 0; i < n_samples; i++) {
      const x = i * 2 / n_samples - 1;
      curve[i] = (Math.PI + k) * x / (Math.PI + k * Math.abs(x));
    }
    waveshaper.curve = curve;
    waveshaper.oversample = '4x';
    blockGain.disconnect();
    blockGain.connect(waveshaper);
    waveshaper.connect(_dest);
  }

  // Register handles so stopPlayback() can kill them
  _activeHandles.push(...nodes.map(n => n.osc));

  return { nodes, stop: () => {
    blockGain.disconnect();
    nodes.forEach(n => { try { n.osc.stop(); } catch(e){} });
  }};
  } catch (e) {
    console.error('[circuitSynthesize] Error:', e, 'block:', blockOrParams);
    return { nodes: [], stop: () => {} };
  }
}

function parseCSV(text) {
  const lines = text.trim().replace(/\r\n/g, '\n').split('\n');
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const values = [];
    let val = '';
    let inQuote = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        // handle escaped quote ("")
        if (inQuote && line[i + 1] === '"') { val += '"'; i++; }
        else { inQuote = !inQuote; }
      }
      else if (ch === ',' && !inQuote) { values.push(val.trim()); val = ''; }
      else { val += ch; }
    }
    values.push(val.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h] = values[i] || '');
    return obj;
  });
}

async function loadSF2Sample(genre) {
  let mapping = getGMForGenre(genre, null);
  if (!mapping) mapping = {preset: 0, name: 'Grand Piano', role: 'lead'};
  let preset = mapping.preset;
  let cacheKey = `preset_${String(preset).padStart(3, '0')}`;
  if (sf2Buffers[cacheKey]) return sf2Buffers[cacheKey];
  try {
    const res = await fetch(`sf2_samples/presets/preset_${String(preset).padStart(3,'0')}.wav`);
    if (!res.ok) return null;
    const arrBuf = await res.arrayBuffer();
    // Skip tiny samples (< 500 bytes = essentially empty), fall back to Grand Piano
    if (arrBuf.byteLength < 500) {
      const fallbackKey = 'preset_000';
      if (sf2Buffers[fallbackKey]) return sf2Buffers[fallbackKey];
      const fbRes = await fetch('sf2_samples/presets/preset_000.wav');
      if (!fbRes.ok) return null;
      const fbBuf = await fbRes.arrayBuffer();
      const fbAudio = await obAudioCtx.decodeAudioData(fbBuf);
      fbAudio._baseFreq = 261.63;
      sf2Buffers[fallbackKey] = fbAudio;
      return fbAudio;
    }
    const audioBuf = await obAudioCtx.decodeAudioData(arrBuf);
    // Store base frequency for pitch-shifting (assume sample is at C4=261.63Hz)
    audioBuf._baseFreq = 261.63;
    sf2Buffers[cacheKey] = audioBuf;
    return audioBuf;
  } catch (e) {
    return null;
  }
}

// Map template slot position (0~1) to Reverse_Order (1~128)
function getReverseOrderFromPosition(slotIndex, totalSlots) {
  const rel = slotIndex / Math.max(totalSlots, 1);
  return Math.min(128, Math.floor(rel * 127) + 1);
}

  // ── 3AM hysteresis zone: slots 1~16 (00:00~03:00, AB_discharge) ──
  const _hour = new Date().getHours();
  const _is3amZone = (_hour >= 0 && _hour < 3) || (order >= 1 && order <= 16);
  const _stSfHet = isStSfHeterozygous(profileKey);
  if (_is3amZone) {
    anchorVec.p  = clamp01(Math.random());
    anchorVec.s  = clamp01(0.5 + Math.random() * 0.5);
    anchorVec.nu = _stSfHet ? 0.9 + Math.random() * 0.1
                            : clamp01((anchorVec.nu || 0.5) * (0.7 + Math.random() * 0.3));
  }

  // ── Circadian parameter amplification ──
  const _isNight = _hour >= 18 || _hour < 6;
  const _slotPhase = order <= 16 ? 'deep_night' : order <= 48 ? 'morning' : order <= 96 ? 'day' : 'evening';
  const _nightProximity = _slotPhase === 'deep_night' ? 1.0 : _slotPhase === 'evening' ? 0.6 : _slotPhase === 'morning' ? 0.2 : 0.0;
  if (_isNight || _nightProximity > 0.3) {
    const amp = _nightProximity * 0.15;
    anchorVec.p = clamp01(anchorVec.p + amp * (anchorVec.p - 0.5));
    anchorVec.s = clamp01(anchorVec.s + amp * (anchorVec.s - 0.5));
  }

  // ── Energy direction: forward (slot 1→128) vs reverse (slot 128→1) ──
  const _isReverse = _energyDir === 'reverse';
  const _rhNegLayer = (_layer === 'C' || _layer === 'D');

  // ── RH cross-recommendation weighting ──
  const _rhBoostNeg = window._rhBoostNeg === true || userRH === '+';
  const _rhBoostPos = window._rhBoostPos === true;

  // ── Circadian proximity filter for 1318 pool ──
  const _windowSize = _isNight ? 32 : 20;
  const _circadianFiltered = universePool.filter(u => {
    if (!u.circadian_slot) return true;
    const dist = Math.abs(u.circadian_slot - order);
    const wrapDist = Math.min(dist, 128 - dist);
    return wrapDist <= _windowSize;
  });
  const _pool = _circadianFiltered.length >= 6 ? _circadianFiltered : universePool;

  // 5 musically-meaningful recommendation categories — from 1318 pool
  const categories = [
    {
      name: 'same_family',
      predicate: u => u.family === family && u.phaseClass === _dropPhase,
      sort: (a, b) => {
        let da = euclideanDist(a.vec8, anchorVec), db = euclideanDist(b.vec8, anchorVec);
        if (_rhNegLayer) { da -= (a.vec8.nu * 0.12); db -= (b.vec8.nu * 0.12); }
        if (_isReverse) { da -= ((1-a.vec8.r)*0.08 + (1-a.vec8.p)*0.08); db -= ((1-b.vec8.r)*0.08 + (1-b.vec8.p)*0.08); }
        if (_rhBoostNeg) { da -= (a.vec.p * 0.1); db -= (b.vec.p * 0.1); }
        if (_rhBoostPos) { da -= ((1 - a.vec.p) * 0.1); db -= ((1 - b.vec.p) * 0.1); }
        return da - db;
      }
    },
    {
      name: 'energy_up',
      predicate: u => u.phaseClass === _dropPhase && (_isReverse
        ? u.vec8.nu > anchorVec.nu + 0.1 && u.vec8.s > anchorVec.s
        : u.vec.r > anchorVec.r + 0.15 && u.vec.d > anchorVec.d),
      sort: _isReverse
        ? (a, b) => (b.vec8.nu + b.vec8.s) - (a.vec8.nu + a.vec8.s)
        : (a, b) => (b.vec.r + b.vec.d) - (a.vec.r + a.vec.d)
    },
    {
      name: 'calm_down',
      predicate: u => u.phaseClass === _dropPhase && u.vec.r < anchorVec.r * 0.6 && u.vec.d < 0.35,
      sort: (a, b) => (a.vec.r + a.vec.d) - (b.vec.r + b.vec.d)
    },
    {
      name: 'bright_shift',
      predicate: u => u.phaseClass === _dropPhase && u.vec.s > anchorVec.s + 0.2 && Math.abs(u.vec.r - anchorVec.r) < 0.25,
      sort: (a, b) => b.vec.s - a.vec.s
    },
    {
      name: 'temperament_cross',
      predicate: u => u.phaseClass === _dropPhase && u.temperament !== slot.temperament,
      sort: (a, b) => {
        let da = euclideanDist(a.vec8, anchorVec), db = euclideanDist(b.vec8, anchorVec);
        if (_rhNegLayer) { da -= (a.vec8.nu * 0.12); db -= (b.vec8.nu * 0.12); }
        if (_isReverse)  { da -= ((1-a.vec8.r)*0.08); db -= ((1-b.vec8.r)*0.08); }
        if (_rhBoostNeg) { da -= (a.vec.p * 0.1); db -= (b.vec.p * 0.1); }
        if (_rhBoostPos) { da -= ((1 - a.vec.p) * 0.1); db -= ((1 - b.vec.p) * 0.1); }
        return da - db;
      }
    },
    {
      name: 'male_enf_to_female_sj_hetero',
      predicate: u => isMaleEnfRhPlus(profileKey, userRH) && isFemaleSJHeterozygous(u.profileKey),
      sort: (a, b) => {
        let da = euclideanDist(a.vec, anchorVec), db = euclideanDist(b.vec, anchorVec);
        return da - db;
      }
    }
  ];

  const used = new Set();
  const results = [];
  categories.forEach(cat => {
    let pool = _pool.filter(u => !used.has(u.genre) && cat.predicate(u));
    if (!pool.length) {
      pool = _pool.filter(u => !used.has(u.genre));
    }
    // 3AM zone: inject random shuffle into pool ordering
    if (_is3amZone && pool.length > 1) {
      pool.forEach(u => { u._3amScore = Math.random(); });
      pool.sort((a, b) => {
        const baseCmp = cat.sort(a, b);
        return (b._3amScore - a._3amScore) * 0.5 + baseCmp * 0.5;
      });
    } else {
      pool.sort(cat.sort);
    }
    const pick = pool[0];
    if (pick) {
      used.add(pick.genre);
      const outVec = { ...pick.vec8 };
      if (_is3amZone) {
        outVec.p  = clamp01(Math.random());
        outVec.s  = clamp01(0.5 + Math.random() * 0.5);
        outVec.nu = _stSfHet ? 0.9 + Math.random() * 0.1
                             : clamp01((outVec.nu || 0.5) * (0.7 + Math.random() * 0.3));
      }
      results.push({ ...pick._row, Genre_Release: pick.genre, criteria: cat.name, _family: pick.family, _vec: outVec, _3am: _is3amZone });
    }
  });

  // Mainstream Lure: replace 1 of 5 with a mainstream genre from 1318
  // (high ref_distance = far from 128 core = mainstream)
  if (results.length >= 4) {
    const lurePool = universePool.filter(u => {
      const rd = parseFloat(u._row.ref_distance || 0);
      return rd > 0.5;
    });
    if (lurePool.length) {
      const lureIdx = Math.floor(Math.random() * results.length);
      const lure = lurePool[Math.floor(Math.random() * lurePool.length)];
      results[lureIdx] = { ...lure._row, Genre_Release: lure.genre, criteria: 'lure', _family: lure.family, _vec: lure.vec8, _3am: _is3amZone };
    }
  }

  return results;
}

function euclideanDist(a, b) {
  const dr = (a.r || 0) - (b.r || 0);
  const dh = (a.h || 0) - (b.h || 0);
  const dd = (a.d || 0) - (b.d || 0);
  const dp = (a.p || 0) - (b.p || 0);
  const ds = (a.s || 0) - (b.s || 0);
  const dga = (a.gamma || 0) - (b.gamma || 0);
  const dg  = (a.g || 0) - (b.g || 0);
  const dnu = (a.nu || 0) - (b.nu || 0);
  return Math.sqrt(dr*dr + dh*dh + dd*dd + dp*dp + ds*ds + dga*dga + dg*dg + dnu*dnu);
}

// Haplogroup matching: given selected genre vectors, find closest haplogroup
function matchHaplogroup(selectedGenres) {
  if (!_haplogroupData.Y_DNA || Object.keys(_haplogroupData.Y_DNA).length === 0) return null;
  
  // Compute average vector of selected genres
  const avgVec = { r:0, h:0, d:0, p:0, s:0, gamma:0, g:0, nu:0 };
  let count = 0;
  for (const g of selectedGenres) {
    const vec = _universe1318[g] || _unique8D[g];
    if (vec) {
      avgVec.r += parseFloat(vec.r)||0;
      avgVec.h += parseFloat(vec.h)||0;
      avgVec.d += parseFloat(vec.d)||0;
      avgVec.p += parseFloat(vec.p)||0;
      avgVec.s += parseFloat(vec.s)||0;
      avgVec.gamma += parseFloat(vec.gamma)||0;
      avgVec.g += parseFloat(vec.g)||0;
      avgVec.nu += parseFloat(vec.nu)||0;
      count++;
    }
  }
  if (count === 0) return null;
  for (const k in avgVec) avgVec[k] /= count;
  
  // Find closest haplogroup (Y-DNA only for now)
  let bestHaplo = null;
  let bestDist = Infinity;
  for (const [key, val] of Object.entries(_haplogroupData.Y_DNA)) {
    if (!val.vector8) continue;
    const dist = euclideanDist(avgVec, val.vector8);
    if (dist < bestDist) {
      bestDist = dist;
      bestHaplo = { key, ...val };
    }
  }
  return bestHaplo;
}

function hourInRange(hour, start, end) {

  const weights = { release: 1, stress_growth: 1, extreme_growth: 1 };
  let label = 'baseline';
  CIRCADIAN_PHASES.forEach(phase => {
    if (hourInRange(hour, phase.range[0], phase.range[1])) {
      label = phase.label;
      Object.entries(phase.weights).forEach(([cat, val]) => { weights[cat] *= val; });
    }
  });
  const energyPhase = getReverseEnergyPhase(hour);
  return { hour, label, weights, energyPhase };

// 8 dynamic anchor pads in 5D vector space. Each session picks a fresh
// 1318 genre near each anchor, so the pads always sound different but the

// 8 anchor points in {r,h,d} cube — corners of the personality space.
const OB_ANCHORS = [
  { r:0.20, h:0.20, d:0.20, p:0.80, s:0.20 }, // 1 calm / release
  { r:0.80, h:0.20, d:0.20, p:0.60, s:0.40 }, // 2 drive / pulse

];

// Generate pads for a given round. Round 0 = wide spread (8 corners).
// Round 1+ = pads clustered around the user's accumulated pick vector, with
// progressively tighter spread. Each pad pulls a fresh 1318 genre near its anchor.
function generateObPads() {
  const universe = _universe1318 && Object.keys(_universe1318).length ? _universe1318 : _unique8D;
  const pool = Object.keys(universe).map(g => {
    const u = universe[g];
    const v = { r:parseFloat(u.r), h:parseFloat(u.h), d:parseFloat(u.d), p:parseFloat(u.p), s:parseFloat(u.s), score:parseFloat(u.score||0.5) };
    return { g, v, score:v.score, u };
  }).filter(x => x.v.r != null && !isNaN(x.v.r));
  if (!pool.length) return OB_ANCHORS.map((a, i) => makeFallbackPad(a, i));

  const seed = (Date.now() + _obRound * 997) % 9973;

  // Round 0: use haplogroup representative samples
  if (_obRound === 0 && _haplogroupData.Y_DNA && Object.keys(_haplogroupData.Y_DNA).length > 0) {
    const haploSamples = [];
    for (const [key, val] of Object.entries(_haplogroupData.Y_DNA)) {
      if (!val.vector8) continue;
      // Find closest genre to this haplogroup vector
      const candidates = pool.map(c => {
        const dist = euclideanDist(c.v, val.vector8);
        return { ...c, dist };
      }).sort((a, b) => a.dist - b.dist);
      const pick = candidates[0];
      if (pick) {
        haploSamples.push({
          idx: haploSamples.length,
          glyph: OB_PAD_GLYPHS[haploSamples.length % OB_PAD_GLYPHS.length],
          color: OB_PAD_COLORS[haploSamples.length % OB_PAD_COLORS.length],
          genre: pick.g,
          coreGenre: pick.g,
          vec: pick.v,
          score: pick.v.score,
          bpm: getBPM(pick.g),
          freq: pick.v.s < 0.4 ? 55 : pick.v.s < 0.65 ? 110 : 220,
          haploKey: key,
          haploLabel: val.label
        });
      }
    }
    // Return up to 12 haplogroup samples
    return haploSamples.slice(0, 12);
  }

  // Round 1+: generate anchors around converged vector
  let anchors;
  if (!_obConvergedVec) {
    anchors = OB_ANCHORS;
  } else {
    const spread = Math.max(0.08, 0.40 - _obRound * 0.15);
    const cv = _obConvergedVec;
    anchors = [];
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const r = spread * (0.5 + (seed % 7) / 14);
      anchors.push({
        r: clamp01(cv.r + Math.cos(angle) * r),
        h: clamp01(cv.h + Math.sin(angle) * r),
        d: clamp01(cv.d + ((seed + i * 31) % 17) / 17 * spread * 2 - spread),
        p: clamp01(cv.p + Math.cos(angle + 1.5) * r * 0.7),
        s: clamp01(cv.s + Math.sin(angle + 0.7) * r * 0.7)
      });
    }
  }

  const out = [];
  for (let i = 0; i < anchors.length; i++) {
    const anchor = anchors[i];
    const candidates = pool.map(c => {
      const dist = euclideanDist(c.v, anchor);
      return { ...c, dist };
    }).sort((a, b) => a.dist - b.dist);
    const slicePct = _obRound === 1 ? 0.15 : _obRound === 2 ? 0.08 : 0.04;
    const slice = Math.max(3, Math.floor(candidates.length * slicePct));
    const bucket = candidates.slice(0, slice);
    const idx = (seed + i * 97) % bucket.length;
    const pick = bucket[idx];
    out.push({
      idx: i,
      glyph: OB_PAD_GLYPHS[i],
      color: OB_PAD_COLORS[i],
      genre: pick.g,
      coreGenre: pick.g,
      vec: pick.v,
      score: pick.v.score,
      bpm: getBPM(pick.g),
      freq: pick.v.s < 0.4 ? 55 : pick.v.s < 0.65 ? 110 : 220
    });
  }
  return out;
}
function makeFallbackPad(anchor, i) {
  return { idx:i, glyph:OB_PAD_GLYPHS[i], color:OB_PAD_COLORS[i], genre:'pad '+i, coreGenre:'pad '+i,
    vec:{...anchor, score:(anchor.r+anchor.h+anchor.d+anchor.p+anchor.s)/5}, score:0.5, bpm:80, freq:110 };
}
function enrichObSamplesWithVecs() {
  if (!OB_SAMPLES.length) OB_SAMPLES = generateObPads();
  OB_SAMPLES.forEach(s => {
    const v = s.vec || getTension8D(s.coreGenre, profileKey) || inferTensionFromSample(s);
    s.vec   = v;
    s.score = v.score;
    s.bpm   = s.bpm || getBPM(s.coreGenre);
    s.freq  = v.s < 0.4 ? 55 : v.s < 0.65 ? 110 : 220; // s → register
  });
}

function inferTensionFromSample(s){
  // Fallback 5D vector derived from sample static metadata when mm is unavailable
  const score = s.score || 0.5;
  return {
    r: s.rhythm != null ? s.rhythm : score,
    h: 0.2 + score * 0.6,        // higher score = more harmonic tension
    d: 0.3 + score * 0.5,        // higher score = more dynamic range
    p: 1 - score,                // high score = chaotic / low predictability
    s: s.freq ? (s.freq < 100 ? 0.3 : s.freq < 200 ? 0.55 : 0.8) : 0.5,
    score: score
  };
}

async function playObSample(idx) {
  // Toggle: if same button is playing, stop it
  if (obPlayingIdx === idx) {
    stopObAudio();
    return;
  }

  // Stop previous audio before playing new one
  stopObAudio();

  // Electron + MusicGen: play real WAV
  if (obAudioElements[idx]) {
    const audio = obAudioElements[idx];
    audio.currentTime = 0;
    audio.play();
    obPlayingIdx = idx;
    document.getElementById('obs'+idx)?.classList.add('playing');
    audio.onended = () => { if(obPlayingIdx===idx) { document.getElementById('obs'+idx)?.classList.remove('playing'); obPlayingIdx=-1; } };
    return;
  }

  // Browser: use full 5D circuitSynthesize for calibration previews
  if(!obAudioCtx) obAudioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(obAudioCtx.state==='suspended') obAudioCtx.resume();
  const s=OB_SAMPLES[idx];
  // Preload SF2 sample for this genre so first play uses real instrument
  try { await loadSF2Sample(s.genre || s.coreGenre); } catch(e){}
  
  // Add randomness to vec for variation on each play
  const baseVec = s.vec || getTension8D(s.coreGenre || s.genre, profileKey);
  const randomOffset = () => (Math.random() - 0.5) * 0.1; // ±0.05 variation
  const variedVec = {
    r: clamp01(baseVec.r + randomOffset()),
    h: clamp01(baseVec.h + randomOffset()),
    d: clamp01(baseVec.d + randomOffset()),
    p: clamp01(baseVec.p + randomOffset()),
    s: clamp01(baseVec.s + randomOffset()),
    gamma: clamp01((baseVec.gamma || 0.5) + randomOffset()),
    g: clamp01((baseVec.g || 0.5) + randomOffset()),
    nu: clamp01((baseVec.nu || 0.5) + randomOffset())
  };
  
  // Build a minimal block object with 5D vec
  const block = {
    genre: s.genre, coreGenre: s.coreGenre || s.genre,
    category: s.score < 0.35 ? 'release' : s.score < 0.65 ? 'stress_growth' : 'extreme_growth',
    score: s.score,
    vec: variedVec,
    bpm: s.bpm || getBPM(s.coreGenre || s.genre),
    col: idx % 4, lane: Math.floor(idx / 4),
    arpeggio: { enabled: false, pattern: 'up', rate: '1/16', octaveRange: 1, gate: 0.8 }
  };
  // Enrich with 1318 universe metadata for full profiling
  const uEntry = _universe1318[s.genre] || _universe1318[s.coreGenre];
  if (uEntry) {
    block.vec.gamma = parseFloat(uEntry.gamma) || block.vec.gamma;
    block.vec.g = parseFloat(uEntry.g) || block.vec.g;
    block.vec.nu = parseFloat(uEntry.nu) || block.vec.nu;
    block.vec.score = parseFloat(uEntry.score) || s.score;
  }
  const obDur = 14; // 14 seconds so user can actually hear the music
  const result = circuitSynthesize(block, obAudioCtx.currentTime, obDur);
  _obSynthHandle = result || null;
  obPlayingNodes = result ? result.nodes : [];
  obPlayingIdx = idx;
  document.getElementById('obs'+idx)?.classList.add('playing');
  setTimeout(()=>{ if(obPlayingIdx===idx) stopObAudio(); }, (obDur + 1) * 1000);

function submitRound() {
  if(!obPicks.length) return;

  obPicks.forEach(i => _obAllPicks.push({ round: _obRound, idx: i, vec: OB_SAMPLES[i].vec, genre: OB_SAMPLES[i].genre }));
  
  // Compute converged vector from all picks so far
  const acc={r:0,h:0,d:0,p:0,s:0,gamma:0,g:0,nu:0};
  _obAllPicks.forEach(p => { 
    const v = p.vec;
    acc.r += v.r||0; acc.h += v.h||0; acc.d += v.d||0; acc.p += v.p||0; acc.s += v.s||0;
    acc.gamma += v.gamma||0; acc.g += v.g||0; acc.nu += v.nu||0;
  });
  _obConvergedVec = withScore({ 
    r:acc.r/_obAllPicks.length, h:acc.h/_obAllPicks.length, d:acc.d/_obAllPicks.length, 
    p:acc.p/_obAllPicks.length, s:acc.s/_obAllPicks.length,
    gamma:acc.gamma/_obAllPicks.length, g:acc.g/_obAllPicks.length, nu:acc.nu/_obAllPicks.length
