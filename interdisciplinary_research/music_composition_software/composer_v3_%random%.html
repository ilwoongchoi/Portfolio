// ── Profile inference ─────────────────────────────────────────
// Multi-round pad picks converge to a deterministic 1318 vector.
// The nearest 1318 universe entry becomes the user's profile anchor.
function inferProfile() {
  if(!mm) return;
  if(!Object.keys(profileVectors).length) buildProfileVectors();

  // Use converged vector from all rounds
  const targetVec = _obConvergedVec || getPickVector() || neutralVec();
  lastTargetVec = targetVec;

  // Find nearest 128 profile key for deterministic seeding
  let bestKey = findNearestProfileKey(targetVec);
  if(!bestKey){
    const keys=Object.keys(mm.profiles||{});
    bestKey = keys[0];
  }
  profileKey = bestKey;
  profile    = mm.profiles[profileKey]||null;

  // Determine layer from haplogroup estimate
  let layer = 'A'; // default: homozygous RH+
  if (_obHaplogroup && _obHaplogroup.layer) {
    const layerStr = _obHaplogroup.layer;
    // Parse layer string like "A (Rh+) / C (Rh-)" or "C (Rh-) / A (Rh+)"
    if (layerStr.includes('C')) layer = 'C'; // RH- dominant
    else if (layerStr.includes('B')) layer = 'B'; // heterozygous RH+
    else if (layerStr.includes('D')) layer = 'D'; // heterozygous RH-
    // Default to A if homozygous RH+
  }
  // Store final profile with layer
  window._profileLayer = layer;
  window._profileKeyLayer = profileKey + '_layer_' + layer;

  // Load 8D vector from circadian_shift_table for this profile+layer
  if (_shiftTable && window._profileKeyLayer) {
    const slotKey = 'slot_064_layer_' + layer; // use slot 64 (midday) as anchor
    if (_shiftTable[slotKey]) {
      window._profileAnchorVec = _shiftTable[slotKey].final_vec8;
    }
  }

  // Find nearest 1318 universe entry — this is the user's deterministic anchor
  if (_universe1318 && Object.keys(_universe1318).length) {
    let bestGenre = null, bestDist = Infinity;
    Object.entries(_universe1318).forEach(([g, u]) => {
      const v = { r:parseFloat(u.r)||0.5, h:parseFloat(u.h)||0.5, d:parseFloat(u.d)||0.5, p:parseFloat(u.p)||0.5, s:parseFloat(u.s)||0.5 };
      const dist = euclideanDist(v, targetVec);
      if (dist < bestDist) { bestDist = dist; bestGenre = g; }
    });
    if (bestGenre) {
      window._userUniverseAnchor = bestGenre;
    }
  }

  // Sound signature: abstract code only (no genre names)
  const scorePct = Math.round((targetVec?.score||0.5)*99).toString().padStart(2,'0');
  const roundCount = _obAllPicks.length;
  window._soundSig = '◆' + roundCount + '-' + scorePct;
}

// ── Tension lookup ────────────────────────────────────────────
function _resolveGTPKey(genre){
  if(!mm) return null;
  const tp=mm.genre_tension_profiles;
  const g=genre.toLowerCase();
  // 1. Exact match
  if(tp[genre]) return genre;
  const exactLow=Object.keys(tp).find(k=>k.toLowerCase()===g);
  if(exactLow) return exactLow;
  // 2. Full string containment (key inside genre string, min 5 chars to avoid "rock", "pop" etc)
  const contained=Object.keys(tp).find(k=>k.length>=5&&g.includes(k.toLowerCase()));
  if(contained) return contained;
  // 3. First word match only (min 5 chars)
  const first=g.split(' ')[0];
  if(first.length>=5){
    const fw=Object.keys(tp).find(k=>k.toLowerCase().split(' ')[0]===first);
    if(fw) return fw;
  }
  return null;
}
function getTension(genre){
  if(!mm) return 0.5;
  const key=_resolveGTPKey(genre);
  if(key) return mm.genre_tension_profiles[key].score;
  const cat=resolveCategory(genre);
  return cat==='release'?0.2:cat==='stress_growth'?0.5:cat==='extreme_growth'?0.8:0.5;
}
// getTension5D removed — use getTension8D which returns full 8D vector
function getTension8D(genre, profileKey){
  const gLower = (genre||'').toLowerCase();
  // 1. 1318 annotated universe takes priority
  if(_universe1318[gLower] || _universe1318[genre]){
    const u = _universe1318[gLower] || _universe1318[genre];
    const v = {
      r:parseFloat(u.r),h:parseFloat(u.h),d:parseFloat(u.d),
      p:parseFloat(u.p),s:parseFloat(u.s),
      gamma:parseFloat(u.gamma),g:parseFloat(u.g),nu:parseFloat(u.nu)
    };
    const sc=withScore({r:v.r,h:v.h,d:v.d,p:v.p,s:v.s}).score;
    return {r:v.r,h:v.h,d:v.d,p:v.p,s:v.s,P:v.r,gamma:v.gamma,Z:v.p,q:v.d,W:v.s,H:v.h,g:v.g,nu:v.nu,score:sc};
  }
  // 2. 640 unique vectors fallback
  if(_unique8D[gLower]){
    const v=_unique8D[gLower];
    const sc=withScore({r:v.r,h:v.h,d:v.d,p:v.p,s:v.s}).score;
    return {r:v.r,h:v.h,d:v.d,p:v.p,s:v.s,P:v.r,gamma:v.gamma,Z:v.p,q:v.d,W:v.s,H:v.h,g:v.g,nu:v.nu,score:sc};
  }
  // Fallback: compute from scalar tension + profile traits
  const score=getTension(genre);
  const v5={r:score,h:score,d:score,p:score,s:score,score};
  const t=resolveUserTraits(profileKey);
  const mbti=t.mbti.toUpperCase();
  const sn=mbti[1]||'S'; const jp=mbti[3]||'J'; const tf=mbti[2]||'T'; const ei=mbti[0]||'E';
  let gamma=0.5, g=0.5, nu=0.5;
  if (t.abo==='AB') gamma=0.75; else if (t.abo==='B'||t.abo==='BO') gamma=0.6; else if (t.abo==='A'||t.abo==='AO') gamma=0.45; else if (t.abo==='O') gamma=0.3;
  if (sn==='N') gamma+=0.15; gamma=clamp01(gamma);
  if (jp==='J') g+=0.2; else g-=0.2; if (tf==='T') g+=0.1; g=clamp01(g);
  if (ei==='I') nu+=0.2; else nu-=0.1; if (t.abo==='O') nu+=0.1; nu=clamp01(nu);
  return {r:v5.r,h:v5.h,d:v5.d,p:v5.p,s:v5.s,P:v5.r,gamma:gamma,Z:v5.p,q:v5.d,W:v5.s,H:v5.h,g:g,nu:nu,score:v5.score};
}
function resolveCategory(genre){
  if(!mm) return null;
  const gc=mm._meta?.genre_categories||mm.genre_categories||{};
  for(const[cat,list]of Object.entries(gc)){
    if(cat.startsWith('_')) continue;
    const arr=Array.isArray(list)?list:(list?.genres||[]);
    if(arr.some(g=>g.toLowerCase()===genre.toLowerCase())) return cat;
  }
  return null;
}
function resolveCoreGenre(g){ return mm?.mainstream_gateway?.[g]||g; }

// ── Vector helpers for 8D inference ───────────────────────────
const _AXES = ['r','h','d','p','s','gamma','g','nu'];
const _AXES_8D = ['r','h','d','p','s','gamma','g','nu'];
const PROFILE_WEIGHTS = { release:0.5, stress_growth:0.35, extreme_growth:0.15 };

function clamp01(v){ return Math.max(0, Math.min(1, v)); }

// ── Layer A/B/C/D resolver (RH × zygosity) ──────────────────────────────────
// Layer A: Homozygous + RH+   (OO/AA/BB + RH+)  — always forward, spark irrelevant
// Layer B: Heterozygous + RH+ (AO/BO/AB + RH+)  — forward day, reverse night/spark
// Layer C: Homozygous + RH-   (OO/AA/BB + RH-)  — always forward, nu elevated
// Layer D: Heterozygous + RH- (AO/BO/AB + RH-)  — reverse bias, max 3AM random
function getLayer(profileKey, rh) {
  const homo = isHomozygous(profileKey);
  const neg  = (rh || userRH) === '-';
  if (homo && !neg) return 'A';
  if (!homo && !neg) return 'B';
  if (homo && neg)  return 'C';
  return 'D';
}

// Returns final_vec8 from shift table for a given slot (1-128) and profile
function getSlotVec(slotOrder, profileKey, rh) {
  const layer = getLayer(profileKey, rh);
  const key   = 'slot_' + String(Math.max(1, Math.min(128, Math.round(slotOrder)))).padStart(3, '0') + '_layer_' + layer;
  const entry = _shiftTable[key];
  if (!entry || !entry.final_vec8) return null;
  const v = entry.final_vec8;
  return { r: v.r, h: v.h, d: v.d, p: v.p, s: v.s, gamma: v.gamma, g: v.g, nu: v.nu,
           energy_direction: entry.energy_direction, layer, spark: entry.spark_condition };
}

function resolveUserTraits(profileKey) {
  let gender='M', abo='O', rh='+', mbti='';
  if (!profileKey) return {gender,abo,rh,mbti};
  const parts=profileKey.split('_');
  if (parts.length>=3) { mbti=parts[0]; gender=parts[1]; abo=parts.slice(2).join('_').toUpperCase().replace(/_/g,''); }
  rh = userRH || '+';
  return {gender,abo,rh,mbti};
}

// Zygosity helpers: homozygous = O/OO; heterozygous = AB/AO/BO/AB (A/B treated as hetero for mapping)
function isHeterozygous(key) {
  const t = resolveUserTraits(key);
  return ['AB','A','AO','B','BO'].includes(t.abo);
}
function isHomozygous(key) { return !isHeterozygous(key); }

// ST/SF detection (2nd MBTI letter = S)
function isStSf(key) {
  const t = resolveUserTraits(key);
  return t.mbti.length >= 2 && t.mbti[1] === 'S';
}
function isStSfHeterozygous(key) { return isStSf(key) && isHeterozygous(key); }

// Cross-temperament/gender recommendation: male ENF RH+ → female SJ heterozygous
function isMaleEnfRhPlus(key, rh) {
  const t = resolveUserTraits(key);
  return t.gender === 'M' && t.mbti.length >= 3 && t.mbti[0] === 'E' && t.mbti[1] === 'N' && t.mbti[2] === 'F' && (rh || userRH) === '+';
}
function isFemaleSJ(key) {
  const t = resolveUserTraits(key);
  return t.gender === 'F' && t.mbti.length >= 4 && t.mbti[1] === 'S' && t.mbti[3] === 'J';
}
function isFemaleSJHeterozygous(key) { return isFemaleSJ(key) && isHeterozygous(key); }
function getChordQuality(abo){
  const map={
    'AA':{quality:'M',extensions:[],voicing:'close'},
    'AO':{quality:'M7',extensions:['9','6'],voicing:'open'},
    'BB':{quality:'power',extensions:[],voicing:'stack'},

  };

}
function getRHDirection(rh){
  if (rh==='+') return {melodicContour:'ascending',progressionType:'functional',dynamicShape:'crescendo',phraseEnding:'cadential',loopBehavior:'release'};
  return {melodicContour:'descending',progressionType:'modal/static',dynamicShape:'decrescendo',phraseEnding:'open',loopBehavior:'accumulate'};
}
function getGenderRhythm(gender){
  if (gender==='M') return {emphasis:'downbeat',syncopation:0.2,gridLock:0.8};
  return {emphasis:'upbeat',syncopation:0.6,gridLock:0.4};
}

function withScore(vec){
  if(!vec) return null;
  const out={...vec};
  // 8D score: 5 primary axes weighted 0.7, 3 modulation axes weighted 0.3
  const primary = (((out.r??0)+(out.h??0)+(out.d??0)+(out.p??0)+(out.s??0))/5)*0.7;
  const modulation = (((out.gamma??0.5)+(out.g??0.5)+(out.nu??0.5))/3)*0.3;
  out.score = primary + modulation;
  return out;
}

function neutralVec(){
  return withScore({r:0.5,h:0.5,d:0.5,p:0.5,s:0.5,gamma:0.5,g:0.5,nu:0.5});
}

function avgGenreVec(genres){
  if(!genres||!genres.length) return null;
  const acc={r:0,h:0,d:0,p:0,s:0,gamma:0,g:0,nu:0};
  let count=0;
  genres.forEach(g=>{
    const vec=getTension8D(resolveCoreGenre(g), profileKey);
    if(vec){ _AXES.forEach(k=>acc[k]+=(vec[k]??0.5)); count++; }
  });
  if(!count) return null;
  const avg={};
  _AXES.forEach(k=>avg[k]=acc[k]/count);
  return withScore(avg);
}

function mergeWeightedVecs(parts){
  const acc={r:0,h:0,d:0,p:0,s:0,gamma:0,g:0,nu:0};
  let total=0;
  parts.forEach(({vec,weight})=>{
    if(!vec||!weight) return;
    _AXES.forEach(k=>acc[k]+=(vec[k]??0.5)*weight);
    total+=weight;
  });
  if(!total) return null;
  const combined={};
  _AXES.forEach(k=>combined[k]=acc[k]/total);
  return withScore(combined);
}

function vectorDistance(a,b){
  if(!a||!b) return Infinity;
  return Math.sqrt(_AXES.reduce((sum,k)=>{
    const av=a[k]??0.5,bv=b[k]??0.5;
    return sum + Math.pow(av-bv,2);
  },0));
}

function blendVectors(a,b,bias){
  if(!a&&!b) return null;
  if(!b) return withScore(a);
  if(!a) return withScore(b);
  const w2=clamp01(bias), w1=1-w2;
  const out={};
  _AXES.forEach(k=>out[k]=a[k]*w1 + b[k]*w2);
  return withScore(out);
}

function buildProfileVectors(){
  if(!mm?.profiles) return;
  profileVectors={};
  Object.entries(mm.profiles).forEach(([key,data])=>{
    const releaseVec = avgGenreVec(data.release||[]);
    const stressVec  = avgGenreVec(data.stress_growth||[]);
    const extremeVec = avgGenreVec(data.extreme_growth||[]);
    profileVectors[key]={releaseVec,stressVec,extremeVec};
  });
}

function getProfileCategoryWeights(profileKey, hour = getCurrentHour()){
  const weights = { ...PROFILE_WEIGHTS };
  const archetype = archetypeCodeFromProfileKey(profileKey);
  if (archetype) {
    const active = getActiveArchetypes(hour).filter(a=>a.code===archetype);
    active.forEach(a=>{
      weights[a.category] = (weights[a.category]||0) + 0.3;
    });
  }
  const total = Object.values(weights).reduce((sum,v)=>sum+v,0) || 1;
  Object.keys(weights).forEach(k=>weights[k]/=total);
  return weights;
}

function getProfileFullVec(profileKey, hour = getCurrentHour()){
  const data = profileVectors[profileKey];
  if(!data) return null;
  const weights = getProfileCategoryWeights(profileKey, hour);
  const parts = [];
  if(data.releaseVec) parts.push({vec:data.releaseVec, weight:weights.release});
  if(data.stressVec)  parts.push({vec:data.stressVec,  weight:weights.stress_growth});
  if(data.extremeVec) parts.push({vec:data.extremeVec, weight:weights.extreme_growth});
  const combined = mergeWeightedVecs(parts);
  return combined || data.releaseVec || data.stressVec || data.extremeVec || neutralVec();
}

function findNearestProfileKey(vec){
  if(!vec||!Object.keys(profileVectors).length) return null;
  let bestKey=null,bestDist=Infinity;
  Object.keys(profileVectors).forEach(key=>{
    const dist=vectorDistance(vec,getProfileFullVec(key));
    if(dist<bestDist){bestDist=dist;bestKey=key;}
  });
  return bestKey;
}

function getPickVector(){
  if(!obPicks.length) return null;
  const acc={r:0,h:0,d:0,p:0,s:0,gamma:0,g:0,nu:0};
  obPicks.forEach(i=>{
    const sample=OB_SAMPLES[i];
    const vec=sample?.vec||getTension8D(sample?.coreGenre||sample?.genre, profileKey);
    if(vec){ _AXES.forEach(k=>acc[k]+=(vec[k]??0.5)); }
  });
  const avg={};
  _AXES.forEach(k=>avg[k]=acc[k]/obPicks.length);
  return withScore(avg);
}

// ── BPM ───────────────────────────────────────────────────────
const BPM_OVERRIDE={drone:40,'minimalistic ambient':60,'dark ambient':55,grouper:65,hauntology:80,'boards of canada':88,'lofi hip hop':82,'lofi nujabes':84,nujabes:86,'indie folk':85,folk:90,ghibli:88,'neo-classical':72,'city pop':108,shoegaze:95,'dream pop':90,'cocteau twins':100,synthwave:110,radiohead:95,britpop:120,oasis:118,soul:88,'neo-soul':82,'psychedelic rock':96,'stoner rock':68,'post rock':90,'progressive rock':105,'math rock':150,krautrock:120,'art rock':105,'post-metal':80,björk:100,'kate bush':108,'big beat':138,IDM:170,autechre:155,hyperpop:160,arca:130,'industrial electronic':140,'witch house':100,'hip hop':88,'emotional hip hop':88,'conventional classical':72,'k-pop structured':128,edm:128,'mainstream R&B':90,pop:120,'dance pop':128,'synth pop':120};
const BPM = BPM_OVERRIDE;
function getBPM(g){
  // First try override table
  const ok=Object.keys(BPM_OVERRIDE).find(k=>g.toLowerCase().includes(k)||k.includes(g.toLowerCase().split(' ')[0]));
  if(ok) return BPM_OVERRIDE[ok];
  // Derive from r axis: r=0 → 45bpm, r=1 → 185bpm
  const vec=getTension8D(g, profileKey);
  return Math.round(45 + (vec?.r??0.5) * 140);
}

function isObserverGenre(g){
  if(!mm) return false;
  const obs=mm._meta?.genre_categories?.observer?.genres||mm.genre_categories?.observer?.genres||[];
  const gw=Object.keys(mm._meta?.mainstream_gateway||mm.mainstream_gateway||{}).filter(k=>k!=='_note');
  const gl=g.toLowerCase();
  return obs.some(o=>o.toLowerCase()===gl)||gw.some(o=>o.toLowerCase()===gl);
}

// ── Sound panel ───────────────────────────────────────────────
function buildSoundPanel(){
  const el=document.getElementById('panel-body');
  if(activeTab!=='sounds') return;
  if(!mm){
    mm = createMinimalMusicMap();
    onMusicMapReady();
  }
  if(!mm){
    el.innerHTML='<div style="font-size:9px;color:var(--text-dim);letter-spacing:2px;padding:16px;line-height:2">Loading sounds…</div>';
    return;
  }
  el.innerHTML='';

  // No genre search — sounds are accessed via recommendation panel only
  const infoDiv = document.createElement('div');
  infoDiv.style.cssText = 'font-size:9px;color:var(--text-dim);letter-spacing:2px;padding:8px 0;line-height:1.8';
  infoDiv.textContent = 'Use the RECS tab to browse sounds. Press ▶ to preview, click to select.';
  el.appendChild(infoDiv);

  const cats=['release','stress_growth','extreme_growth'];
  const gc=mm._meta?.genre_categories||mm.genre_categories||{};
  if(profile){
    cats.forEach(cat=>{
      const genres=profile[cat]||[];
      if(!genres.length) return;
      el.appendChild(makeChipSection(CLABEL[cat],genres,cat));
    });
    const div=document.createElement('div');div.style.cssText='border-top:1px solid var(--border);margin:10px 0';el.appendChild(div);
  } else {
    // Fallback: no profile match — show all category genres directly
    cats.forEach(cat=>{
      const raw=gc[cat]; if(!raw) return;
      const genres=(Array.isArray(raw)?raw:(raw.genres||[])).filter(g=>!isObserverGenre(g));
      if(!genres.length) return;
      el.appendChild(makeChipSection(CLABEL[cat],genres.slice(0,12),cat));
    });
    const div2=document.createElement('div');div2.style.cssText='border-top:1px solid var(--border);margin:10px 0';el.appendChild(div2);
  }
  // Mainstream section: only show if no non-mainstream blocks placed yet
  const hasRealBlock=timeline.some(b=>!isObserverGenre(b.genre));
  const gw=mm._meta?.mainstream_gateway||mm.mainstream_gateway||{};
  const mg=Object.keys(gw).filter(k=>k!=='_note');
  if(!hasRealBlock){
    el.appendChild(makeChipSection('◆◆◆',mg,'mainstream'));
  } else {
    const tog=document.createElement('div');
    tog.style.cssText='font-size:8px;color:var(--text-dim);letter-spacing:2px;cursor:pointer;padding:6px 0;border-top:1px solid var(--border);margin-top:6px;transition:color .15s';
    tog.textContent='+ ◆◆◆';
    let expanded=false;
    const msec=makeChipSection('◆◆◆',mg,'mainstream');
    msec.style.display='none';
    tog.onclick=()=>{expanded=!expanded;msec.style.display=expanded?'':'none';tog.textContent=(expanded?'− ':'+ ')+'◆◆◆';};
    el.appendChild(tog);el.appendChild(msec);
  }
}

function makeChipSection(label,genres,cat){
  const sec=document.createElement('div');sec.className='gsec';
  const lbl=document.createElement('div');lbl.className=`gsec-lbl ${cat}`;lbl.textContent=label;
  sec.appendChild(lbl);
  const chips=document.createElement('div');chips.className='chips';
  genres.forEach(g=>{
    const score=getTension(g);
    const ch=document.createElement('div');
    ch.className=`chip ${cat==='stress_growth'?'stress_growth':cat}`;
    ch.dataset.genre=g;ch.dataset.cat=cat;
    const barW=Math.round(score*22);
    const dotColor=scoreColor(score,0.7);
    ch.innerHTML=`<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${dotColor};margin-right:4px"></span><span class="chip-score" style="width:${barW}px;background:${scoreColor(score,0.5)}"></span>`;
    ch.onclick=()=>selectChip(g,cat,ch);
    chips.appendChild(ch);
  });
  sec.appendChild(chips);return sec;
}

function selectChip(genre,cat,el){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  const core=resolveCoreGenre(genre);
  const coreCat=resolveCategory(core)||resolveCategory(genre)||cat;
  const genreVec=getTension8D(core, profileKey);
  let vec=genreVec;
  if(profileKey){
    const profileVec=getProfileFullVec(profileKey);
    if(profileVec){
      vec={
        r:genreVec.r*0.6+profileVec.r*0.4,
        h:genreVec.h*0.6+profileVec.h*0.4,
        d:genreVec.d*0.6+profileVec.d*0.4,
        p:genreVec.p*0.6+profileVec.p*0.4,
        s:genreVec.s*0.6+profileVec.s*0.4,
        score:genreVec.score
      };
    }
  }
  const isGw=(core!==genre);
  selGenre={genre,coreGenre:core,category:coreCat,score:vec.score,vec,isGateway:isGw};
  document.getElementById('bpm-val').textContent=getBPM(core);
  const routeStr=isGw?` → ${core}`:'';
  setInfo(`Selected: ${isGw?'gateway':'sound'}  ·  r${Math.round(vec.r*100)} h${Math.round(vec.h*100)} d${Math.round(vec.d*100)} p${Math.round(vec.p*100)} s${Math.round(vec.s*100)}`);
}

// ── Timeline ──────────────────────────────────────────────────
function resizeTL(){
  const cols=Math.max(20,timeline.length+6);
  tlCanvas.width=cols*(BLOCK_W+6)+PAD*2;
  tlCanvas.height=LANES*LANE_H+PAD*2;
  drawTL();
}
const MARKER_COLORS = { Intro:'#4a7a4a', Verse:'#9a9acc', Chorus:'#7a4a4a', Bridge:'#7a7a3a', Drop:'#7a3a7a', Break:'#3a7a7a', Outro:'#5a5a5a' };

function addMarker() {
  const type = document.getElementById('marker-type').value;
  const bar = parseInt(document.getElementById('marker-bar').value, 10) || 1;
  const col = (bar - 1) * 4;
  // remove existing marker at same position
  _markers = _markers.filter(m => m.col !== col);
  _markers.push({ col, type, color: MARKER_COLORS[type] });
  _markers.sort((a, b) => a.col - b.col);
  drawTL();
  saveToStorage();
}
function removeMarkerAt(col) {
  _markers = _markers.filter(m => m.col !== col);
  drawTL();
  saveToStorage();
}
function clearMarkers() {
  _markers = [];
  drawTL();
  saveToStorage();
}

function drawTL(){
  const W=tlCanvas.width,H=tlCanvas.height;
  tlCtx.clearRect(0,0,W,H);
  tlCtx.fillStyle='#12121f';tlCtx.fillRect(0,0,W,H);

  // Draw loop region
  if (_loopEnd !== null && _loopStart <= _loopEnd) {
    const lsX = PAD + _loopStart * (BLOCK_W + 6);
    const leX = PAD + (_loopEnd + 1) * (BLOCK_W + 6);
    tlCtx.fillStyle = 'rgba(106,106,204,0.08)';
    tlCtx.fillRect(lsX, PAD, leX - lsX, H - PAD * 2);
    tlCtx.strokeStyle = 'rgba(106,106,204,0.3)';
    tlCtx.lineWidth = 1;
    tlCtx.setLineDash([4, 4]);
    tlCtx.beginPath();
    tlCtx.moveTo(lsX, PAD); tlCtx.lineTo(lsX, H - PAD);
    tlCtx.moveTo(leX, PAD); tlCtx.lineTo(leX, H - PAD);
    tlCtx.stroke();
    tlCtx.setLineDash([]);
    tlCtx.fillStyle = 'rgba(106,106,204,0.4)';
    tlCtx.font = '7px Consolas, monospace';
    tlCtx.fillText('LOOP', lsX + 3, PAD + 10);
  }

  // Draw markers before grid so labels sit above bar lines
  _markers.forEach(m => {
    const x = PAD + m.col * (BLOCK_W + 6);
    const color = m.color || MARKER_COLORS[m.type] || '#ddd';
    tlCtx.fillStyle = color + '44';
    tlCtx.fillRect(x, 0, BLOCK_W + 6, H);
    tlCtx.fillStyle = color;
    tlCtx.font = 'bold 9px Consolas, monospace';
    tlCtx.fillText(m.type, x + 3, 11);
  });

  for(let l=0;l<=LANES;l++){tlCtx.strokeStyle='#2a2a3e';tlCtx.lineWidth=1;tlCtx.beginPath();tlCtx.moveTo(0,PAD+l*LANE_H);tlCtx.lineTo(W,PAD+l*LANE_H);tlCtx.stroke();}
  const cols=Math.floor((W-PAD*2)/(BLOCK_W+6));
  for(let c=0;c<cols;c++){
    const x=PAD+c*(BLOCK_W+6);
    tlCtx.strokeStyle=c%4===0?'#4a4a6a':'#1e1e34';tlCtx.lineWidth=1;
    tlCtx.beginPath();tlCtx.moveTo(x,PAD);tlCtx.lineTo(x,H-PAD);tlCtx.stroke();
    if(c%4===0){tlCtx.fillStyle='#3a3a5a';tlCtx.font='8px Consolas, monospace';tlCtx.fillText('B'+(c/4+1),x+3,PAD-1);}
  }

  // Empty timeline hint
  if (!timeline.length) {
    tlCtx.fillStyle = 'rgba(106,106,204,0.25)';
    tlCtx.font = 'bold 10px Consolas, monospace';
    const hint = 'Select a genre in Sounds tab, then click here to place';
    const tw = tlCtx.measureText(hint).width;
    tlCtx.fillText(hint, (W - tw) / 2, H / 2);
  }

  // Playhead
  if(_playhead >= 0){
    const px=PAD+_playhead*(BLOCK_W+6);
    tlCtx.strokeStyle='rgba(255,255,255,0.15)';tlCtx.lineWidth=2;
    tlCtx.beginPath();tlCtx.moveTo(px,PAD);tlCtx.lineTo(px,H-PAD);tlCtx.stroke();
  }

  timeline.forEach(b=>{
    const x=PAD+b.col*(BLOCK_W+6),y=PAD+b.lane*LANE_H+4;
    const col=b.color||CCOLOR[b.category]||'#bbb';
    const isPlaying=(_playhead===b.col);

    // Block body
    const dur = b.duration || 1;
    const tileW = BLOCK_W + (dur-1)*(BLOCK_W+6);
    tlCtx.fillStyle=col+(isPlaying?'88':'44');
    tlCtx.strokeStyle=col+(b.genStatus==='ready'?'ff':b.genStatus==='error'?'55':'88');
    tlCtx.lineWidth=isPlaying?2:1;
    rRect(tlCtx,x,y,tileW,BLOCK_H,3);tlCtx.fill();tlCtx.stroke();
    if (_selectedBlock === b) {
      tlCtx.shadowColor = '#ffcc00';
      tlCtx.shadowBlur = 8;
      tlCtx.strokeStyle = '#ffcc00';
      tlCtx.lineWidth = 2;
      tlCtx.stroke();
      tlCtx.shadowBlur = 0;
    }
    // Duration indicator
    if(dur>1){
      tlCtx.fillStyle=col+'aa';
      tlCtx.fillRect(x+2,y+BLOCK_H-4,tileW-4,2);
    }

    // Tension bar
    const barW=Math.round(b.score*BLOCK_W);
    tlCtx.fillStyle=scoreColor(b.score,0.6);tlCtx.fillRect(x,y,barW,3);

    // No genre labels — color + score only
    tlCtx.fillStyle='#ddd';tlCtx.font='8px Consolas, monospace';
    tlCtx.fillText(Math.round(b.score*100)+'%',x+5,y+16);
    if(b.bpm&&b.bpm!=='—')tlCtx.fillText(b.bpm+'bpm',x+5,y+28);

    // Key indicator
    if (b.key !== undefined && b.scale) {
      tlCtx.fillStyle='#7a7a9a';tlCtx.font='7px Consolas, monospace';
      const keyText = KEYS[b.key] + ' ' + b.scale;
      tlCtx.fillText(keyText, x + 5, y + 38);
    }

    // Gen status indicator (bottom-right of block)
    if(b.genStatus==='ready'){
      tlCtx.fillStyle='rgba(60,180,60,0.7)';tlCtx.font='8px Consolas, monospace';
      tlCtx.fillText('▶',x+BLOCK_W-12,y+BLOCK_H-4);
    } else if(b.genStatus==='generating'||b.genStatus==='queued'){
      tlCtx.fillStyle='rgba(120,120,180,0.7)';tlCtx.font='7px Consolas, monospace';
      tlCtx.fillText(b.genStatus==='queued'?'Q…':'⧗',x+BLOCK_W-14,y+BLOCK_H-4);
    } else if(b.genStatus==='error'){
      tlCtx.fillStyle='rgba(180,60,60,0.7)';tlCtx.font='8px Consolas, monospace';
      tlCtx.fillText('⚠',x+BLOCK_W-12,y+BLOCK_H-4);
    }
    // Audio buffer indicator (top-right)
    if (_blockAudio[b.block_id]?.buffer) {
      tlCtx.fillStyle = 'rgba(138,138,170,0.6)';
      tlCtx.font = '7px Consolas, monospace';
      tlCtx.fillText('~', x + tileW - 10, y + 8);
    }
    // Reversed flag indicator
    if (b._reversed) {
      tlCtx.fillStyle = 'rgba(255,160,60,0.7)';
      tlCtx.font = '7px Consolas, monospace';
      tlCtx.fillText('R', x + tileW - 10, y + BLOCK_H - 14);
    }
    // Notes indicator
    if (b.notes && b.notes.length) {
      tlCtx.fillStyle = 'rgba(60,180,180,0.6)';
      tlCtx.font = '7px Consolas, monospace';
      tlCtx.fillText('♪' + b.notes.length, x + 5, y + BLOCK_H - 14);
    }
    // Steps indicator
    if (b.steps && b.steps.some(s => s > 0)) {
      tlCtx.fillStyle = 'rgba(180,60,180,0.6)';
      tlCtx.font = '7px Consolas, monospace';
      tlCtx.fillText('▣', x + 5, y + BLOCK_H - 14);
    }
    // Arpeggio indicator
    if (b.arpeggio && b.arpeggio.enabled) {
      tlCtx.fillStyle = 'rgba(60,120,220,0.7)';
      tlCtx.font = '7px Consolas, monospace';
      tlCtx.fillText('arp', x + tileW - 20, y + BLOCK_H - 14);
    }
    // Fade indicator
    if (b.fadeIn || b.fadeOut) {
      tlCtx.fillStyle = 'rgba(200,180,100,0.5)';
      tlCtx.font = '7px Consolas, monospace';
      tlCtx.fillText('F', x + tileW - 18, y + 8);
    }
    // Clip gain indicator
    if (b.clipGain && b.clipGain !== 1) {
      tlCtx.fillStyle = 'rgba(100,180,200,0.6)';
      tlCtx.font = '7px Consolas, monospace';
      tlCtx.fillText((b.clipGain > 1 ? '+' : '') + Math.round((b.clipGain - 1) * 10) + 'dB', x + 5, y + 8);
    }
    // Trim indicator
    if (b.trimStart || b.trimEnd) {
      tlCtx.fillStyle = 'rgba(180,100,180,0.5)';
      tlCtx.font = '7px Consolas, monospace';
      tlCtx.fillText('T', x + tileW - 26, y + 8);
    }
    // Playback rate indicator
    if (b.playbackRate && b.playbackRate !== 1) {
      tlCtx.fillStyle = 'rgba(100,220,120,0.6)';
      tlCtx.font = '7px Consolas, monospace';
      tlCtx.fillText('×' + b.playbackRate, x + tileW - 28, y + BLOCK_H - 22);
    }
  });
  const infoText = _playhead >= 0
    ? `Col ${_playhead} · Bar ${Math.floor(_playhead/4)+1} · ${timeline.length} blocks`
    : timeline.length + ' blocks';
  document.getElementById('tl-info').textContent = infoText;
  if (_mixerVisible) renderMixer();

  // Auto-scroll to keep playhead visible during playback
  if (isPlaying && _playhead >= 0) {
    const wrap = document.getElementById('tl-wrap');
    if (wrap) {
      const colX = PAD + _playhead * (BLOCK_W + 6);
      const viewLeft = wrap.scrollLeft;
      const viewRight = viewLeft + wrap.clientWidth;
      if (colX < viewLeft + BLOCK_W || colX > viewRight - BLOCK_W * 2) {
        wrap.scrollLeft = Math.max(0, colX - wrap.clientWidth / 2);
      }
    }
  }
}
function rRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

tlCanvas.addEventListener('click',e=>{
  if (_suppressClick) { _suppressClick = false; return; }
  const rect=tlCanvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const col=Math.floor((mx-PAD)/(BLOCK_W+6));
  const lane=Math.floor((my-PAD)/LANE_H);
  if(col<0||lane<0||lane>=LANES) return;

  const existing=timeline.find(b=>b.col===col&&b.lane===lane);

  // Click on ready block — preview it
  if(existing && existing.genStatus==='ready' && !selGenre) {
    if(_blockAudio[existing.block_id]){
      const {audio}=_blockAudio[existing.block_id];
      audio.currentTime=0; audio.play().catch(()=>{});
    } else {
      if(!obAudioCtx) obAudioCtx=new(window.AudioContext||window.webkitAudioContext)();
      if(obAudioCtx.state==='suspended') obAudioCtx.resume();
      const handle=circuitSynthesize(existing, obAudioCtx.currentTime+0.05, 4);
      if(handle) setTimeout(()=>{try{handle.stop();}catch(e){}},4500);
    }
    setInfo(`Previewing sound`);
    return;
  }

  if (!selGenre) {
    if (existing) {
      _selectedBlock = existing;
      setInfo('Selected sound · open Piano/Seq/Arp tab to edit');
      drawTL();
      if (activeTab === 'piano') buildPianoPanel();
      if (activeTab === 'seq') buildSeqPanel();
      if (activeTab === 'arp') buildArpPanel();
      return;
    }
    setInfo('Select a sound first');
    return;
  }

  _pushHistory();
  // Remove existing at slot
  const idx=timeline.findIndex(b=>b.col===col&&b.lane===lane);
  if(idx!==-1) timeline.splice(idx,1);

  const block_id = `b${++_blockIdCounter}`;
  const block = {
    genre:selGenre.genre, coreGenre:selGenre.coreGenre,
    category:selGenre.category, score:selGenre.score,
    vec:selGenre.vec||getTension8D(selGenre.coreGenre, profileKey),
    isGateway:selGenre.isGateway||false,
    lane, col, bpm:getBPM(selGenre.coreGenre),
    block_id, genStatus: window.circuit ? 'queued' : 'na', wavPath: null,
    duration: 1,
    arpeggio: { enabled: false, pattern: 'up', rate: '1/16', octaveRange: 1, gate: 0.8 }
  };
  timeline.push(block);
  timeline.sort((a,b)=>a.col-b.col);
  _selectedBlock = null;
  resizeTL();drawCurve();
  if(activeTab==='recs') buildRecPanel();
  saveToStorage();
  setInfo(`Sound placed · generating…`);
  generateBlock(block);
});

// ── Drag-to-move blocks ──────────────────────────────────────
let _dragBlock = null;
let _dragStart = null;
let _dragHasMoved = false;
let _suppressClick = false;

tlCanvas.addEventListener('mousedown', e => {
  const rect = tlCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const col = Math.floor((mx - PAD) / (BLOCK_W + 6));
  const lane = Math.floor((my - PAD) / LANE_H);
  const block = timeline.find(b => b.col === col && b.lane === lane);
  if (block && e.button === 0) {
    _dragBlock = block;
    _dragStart = { x: mx, y: my, col, lane };
    _dragHasMoved = false;
  }
});

tlCanvas.addEventListener('mousemove', e => {
  if (!_dragBlock) return;
  const rect = tlCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const dx = mx - _dragStart.x, dy = my - _dragStart.y;
  if (Math.abs(dx) > 5 || Math.abs(dy) > 5) _dragHasMoved = true;
  if (!_dragHasMoved) return;
  const col = Math.floor((mx - PAD) / (BLOCK_W + 6));
  const lane = Math.floor((my - PAD) / LANE_H);
  if (col >= 0 && lane >= 0 && lane < LANES && (col !== _dragBlock.col || lane !== _dragBlock.lane)) {
    // Check collision
    const collision = timeline.find(b => b !== _dragBlock && b.col === col && b.lane === lane);
    if (!collision) {
      _pushHistory();
      _dragBlock.col = col;
      _dragBlock.lane = lane;
      timeline.sort((a, b) => a.col - b.col);
      drawTL();
    }
  }
});

tlCanvas.addEventListener('mouseup', e => {
  if (_dragBlock && _dragHasMoved) {
    _suppressClick = true;
    saveToStorage();
    setInfo('Sound moved');
  }
  _dragBlock = null;
  _dragStart = null;
  _dragHasMoved = false;
});

tlCanvas.addEventListener('dblclick',e=>{

  const rect=tlCanvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const col=Math.floor((mx-PAD)/(BLOCK_W+6));
  const lane=Math.floor((my-PAD)/LANE_H);
  if(col<0||lane<0||lane>=LANES) return;
  const block=timeline.find(b=>b.col===col&&b.lane===lane);
  if(!block) return;
  const cycles=[1,2,4,8];
  const idx=cycles.indexOf(block.duration||1);

  drawTL();

});

// Right-click context menu on blocks
tlCanvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const rect = tlCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const col = Math.floor((mx - PAD) / (BLOCK_W + 6));
  const lane = Math.floor((my - PAD) / LANE_H);
  if (col < 0 || lane < 0 || lane >= LANES) return;
  const block = timeline.find(b => b.col === col && b.lane === lane);
  if (!block) return;

  // Remove existing menu
  const existing = document.getElementById('block-ctx-menu');
  if (existing) existing.remove();

  const menu = document.createElement('div');
  menu.id = 'block-ctx-menu';
  // Keep menu inside viewport with max-height scrolling
  const maxH = Math.min(window.innerHeight - 20, 520);

function reverseBlock(block) {
  const entry = _blockAudio[block.block_id];
  if (entry && entry.buffer) {
    const buf = entry.buffer;
    const reversed = obAudioCtx.createBuffer(buf.numberOfChannels, buf.length, buf.sampleRate);
    for (let ch = 0; ch < buf.numberOfChannels; ch++) {
      const src = buf.getChannelData(ch);
      const dst = reversed.getChannelData(ch);
      for (let i = 0; i < buf.length; i++) dst[i] = src[buf.length - 1 - i];
    }
    entry.buffer = reversed;
    if (block._audioBuffer) block._audioBuffer = reversed;
    setInfo('Block reversed');
    saveToStorage();
  } else {
    block._reversed = !block._reversed;
    setInfo('Reverse flag toggled');
    saveToStorage();
  }
}
function normalizeBlock(block) {
  const entry = _blockAudio[block.block_id];
  if (entry && entry.buffer) {
    const buf = entry.buffer;
    let peak = 0;
    for (let ch = 0; ch < buf.numberOfChannels; ch++) {
      const data = buf.getChannelData(ch);
      for (let i = 0; i < data.length; i++) { const a = Math.abs(data[i]); if (a > peak) peak = a; }
    }
    if (peak > 0) {
      const gain = 0.95 / peak;
      for (let ch = 0; ch < buf.numberOfChannels; ch++) {
        const data = buf.getChannelData(ch);
        for (let i = 0; i < data.length; i++) data[i] *= gain;
      }
    }
    setInfo('Block normalized');
    saveToStorage();
  } else {
    setInfo('No audio buffer to normalize');
  }
}

// ── Tension curve ─────────────────────────────────────────────
function detectSlope(){
  if(timeline.length<2) return 'flat';
  const recent=timeline.slice(-4),scores=recent.map(b=>b.score);
  let rising=0,falling=0;
  for(let i=1;i<scores.length;i++){const d=scores[i]-scores[i-1];if(d>0.05)rising++;else if(d<-0.05)falling++;}
  if(rising>falling&&rising>=scores.length/2) return 'rising';
  if(falling>rising&&falling>=scores.length/2) return 'falling';
  const last=scores[scores.length-1];
  if(last>0.65) return 'peak';
  if(last<0.3)  return 'valley';
  return 'flat';
}
function drawCurve(){
  const wrap = document.getElementById('curve-area');
  cvCanvas.width = wrap.offsetWidth;
  cvCanvas.height = wrap.offsetHeight;
  const W = cvCanvas.width, H = cvCanvas.height, PC = 30;
  cvCtx.clearRect(0,0,W,H);
  
  // 1. Background Grid
  cvCtx.strokeStyle = '#1e1e34';
  cvCtx.lineWidth = 1;
  for(let x=PC; x<W-PC; x+=(W-PC*2)/16) { cvCtx.beginPath(); cvCtx.moveTo(x,0); cvCtx.lineTo(x,H); cvCtx.stroke(); }
  for(let y=PC; y<H-PC; y+=(H-PC*2)/4) { cvCtx.beginPath(); cvCtx.moveTo(0,y); cvCtx.lineTo(W,y); cvCtx.stroke(); }

  // 2. Threshold Lines
  const th = v => PC + (1-v) * (H-PC*2);
  [{v:0.65,c:'#3a3a6a',l:'EXTREME'},{v:0.35,c:'#2a4a2a',l:'RELEASE'}].forEach(({v,c,l})=>{
    const y = th(v);
    cvCtx.strokeStyle = c;
    cvCtx.setLineDash([4,6]);
    cvCtx.beginPath(); cvCtx.moveTo(PC,y); cvCtx.lineTo(W-PC,y); cvCtx.stroke();
    cvCtx.setLineDash([]);
    cvCtx.fillStyle = '#4a4a6a';
    cvCtx.font = 'bold 8px Consolas, monospace';
    cvCtx.fillText(l, W-PC-40, y-4);
  });

  if(!timeline.length) return;
  const cols = [...new Set(timeline.map(b=>b.col))].sort((a,b)=>a-b);
  const pts = cols.map(col=>{
    const bl = timeline.filter(b=>b.col===col);
    return {col, score: bl.reduce((s,b)=>s+b.score,0)/bl.length};
  });
  const maxCol = cols[cols.length-1] || 1;
  const cx = col => PC + (col/maxCol) * (W-PC*2);
  const cy = s => th(s);

  if(pts.length > 1){
    // 3. Area Gradient
    const grad = cvCtx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, 'rgba(106, 106, 204, 0.15)');
    grad.addColorStop(1, 'rgba(10, 10, 20, 0)');
    cvCtx.fillStyle = grad;
    cvCtx.beginPath();
    cvCtx.moveTo(cx(pts[0].col), H);
    pts.forEach(p => cvCtx.lineTo(cx(p.col), cy(p.score)));
    cvCtx.lineTo(cx(pts[pts.length-1].col), H);
    cvCtx.closePath();
    cvCtx.fill();

    // 4. Smooth Bezier Line with Glow
    cvCtx.shadowBlur = 10;
    cvCtx.shadowColor = 'rgba(106, 106, 204, 0.4)';
    cvCtx.strokeStyle = '#9999bb';
    cvCtx.lineWidth = 2;
    cvCtx.beginPath();
    cvCtx.moveTo(cx(pts[0].col), cy(pts[0].score));
    
    for(let i=1; i<pts.length; i++) {
      const p = pts[i];
      const prev = pts[i-1];
      const cp1x = cx(prev.col) + (cx(p.col) - cx(prev.col)) / 2;
      cvCtx.bezierCurveTo(cp1x, cy(prev.score), cp1x, cy(p.score), cx(p.col), cy(p.score));
    }
    cvCtx.stroke();
    cvCtx.shadowBlur = 0;
  }

  // 5. Tension Points
  pts.forEach(p => {
    cvCtx.fillStyle = scoreColor(p.score, 1);
    cvCtx.beginPath();
    cvCtx.arc(cx(p.col), cy(p.score), 2.5, 0, Math.PI*2);
    cvCtx.fill();
  });

  const slope = detectSlope();
  const lastScore = pts[pts.length-1].score;
  const trend = {rising:'↑', falling:'↓', flat:'—', peak:'▲', valley:'▼'}[slope];
  document.getElementById('curve-info').textContent = `${Math.round(lastScore*100)}% · ${trend}`;

  // FFT Spectrum overlay
  if (_mixer && _mixer.analyser) {
    const data = new Uint8Array(_mixer.analyser.frequencyBinCount);
    _mixer.analyser.getByteFrequencyData(data);
    const barW = (W - PC*2) / data.length;
    cvCtx.fillStyle = 'rgba(106,106,204,0.1)';
    for (let i = 0; i < data.length; i++) {
      const h = (data[i] / 255) * (H * 0.35);
      cvCtx.fillRect(PC + i * barW, H - h, barW - 1, h);
    }
  }
}

function getProfileReverseOrder(){
  if(!profileKey || !profileVectors[profileKey]) return null;
  const profileVec = getProfileFullVec(profileKey);
  if(!profileVec) return null;
  let bestDist=Infinity, bestOrder=1;
  _slotFamilies.forEach(s => {
    const dist = euclideanDist(s.vec, profileVec);
    if(dist < bestDist){ bestDist=dist; bestOrder=s.order; }
  });
  return bestOrder;
}

const KEYS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

// Diatonic chord qualities by scale
const SCALE_CHORDS = {

// Semitone offsets for chord qualities (root-relative)
const CHORD_INTERVALS = {
  'M':    [0, 4, 7],
  'm':    [0, 3, 7],
  'dim':  [0, 3, 6],
  'aug':  [0, 4, 8],
  'M7':   [0, 4, 7, 11],

// Common progressions by tension level
const PROGRESSIONS = {
  low: [      // resolved / consonant
    [0, 4, 5, 0],      // I – V – IV – I
    [0, 5, 3, 4],      // I – V – vi – IV
    [0, 4, 0],         // I – IV – I

  ],
  mid: [      // moderate tension
    [5, 3, 4, 0],      // V – vi – IV – I

    [2, 5, 0],         // iii – V – I

  ],

    [1, 4, 0, 5],      // ii – IV – I – V (circular)
    [3, 0, 4, 6],      // vi – I – IV – vii°
    [1, 3, 5, 0],      // ii – vi – V – I
    [4, 1, 5, 0]       // IV – ii – V – I
  ]
};

// Genre → preferred chord extension for distinct harmonic flavour
const GENRE_CHORD_OVERRIDES = {
  'jazz': 'm7', 'nu-jazz': '7', 'ambient jazz': 'm7', 'blues': '7',
  'metal': 'power', 'prog metal': 'm', 'technical metal': 'power',
  'symphonic metal': 'M', 'industrial': 'power', 'noise': 'dim',
  'ambient': 'sus2', 'drone': 'sus4', 'aero ambient': 'sus2',
  'minimalistic ambient': 'dim', 'folk': 'M', 'indie folk': 'm',
  'country rock': 'M', 'psych': 'M7', 'heavy psych': 'M7',
  'space rock': 'sus2', 'prog rock': 'M7', 'synthwave': 'm',
  'idm': 'm7', 'glitch': 'dim', 'hauntology': 'm'
};

function getGenreChordQuality(genre, defaultQuality) {
  const g = (genre || '').toLowerCase();
  for (const [key, qual] of Object.entries(GENRE_CHORD_OVERRIDES)) {
    if (g.includes(key) || key.includes(g)) return qual;
  }
  return defaultQuality;
}

function getChordNotes(rootMidi, degree, scaleName, qualityOverride) {
  const scale = SCALES[scaleName] || SCALES.major;
  const qualities = SCALE_CHORDS[scaleName] || SCALE_CHORDS.major;
  const deg = degree % scale.length;
  const scaleDegree = scale[deg];
  const chordRoot = rootMidi + scaleDegree;
  const quality = qualityOverride || qualities[deg];
  const intervals = CHORD_INTERVALS[quality] || CHORD_INTERVALS.M;
  return intervals.map(interval => chordRoot + interval);
}

function pickProgression(tension, seed) {
  const bucket = tension < 0.35 ? 'low' : tension < 0.65 ? 'mid' : 'high';
  const opts = PROGRESSIONS[bucket];
  const idx = Math.floor((seed || Math.random()) * opts.length) % opts.length;
  return opts[idx];
}

// Genre → default scale mapping for distinct harmonic character
const GENRE_DEFAULT_SCALES = {
  'jazz': 'dorian', 'nu-jazz': 'mixolydian', 'ambient jazz': 'dorian',
  'blues': 'blues', 'soul': 'mixolydian', 'funk': 'mixolydian',
  'metal': 'minor', 'prog metal': 'harmonic minor', 'technical metal': 'phrygian',
  'symphonic metal': 'minor', 'industrial': 'locrian', 'noise': 'locrian',
  'ambient': 'major', 'drone': 'whole tone', 'aero ambient': 'lydian',
  'minimalistic ambient': 'diminished', 'berliner schule': 'minor',
  'folk': 'dorian', 'indie folk': 'dorian', 'country rock': 'mixolydian',
  'psych': 'mixolydian', 'heavy psych': 'dorian', 'space rock': 'lydian',
  'prog rock': 'lydian', 'classic rock': 'major',
  'synthwave': 'minor', 'vaporwave': 'major', 'chillwave': 'major',
  'idm': 'minor', 'glitch': 'diminished', 'hauntology': 'minor'
};

function getGenreScale(genre) {
  const g = (genre || '').toLowerCase();
  for (const [key, scale] of Object.entries(GENRE_DEFAULT_SCALES)) {
    if (g.includes(key) || key.includes(g)) return scale;
  }
  return _globalKey.scale;
}

function getBlockKey(block) {
  // Use block-specific key if set, otherwise genre default, otherwise global
  if (block.key !== undefined && block.scale) {
    return { root: block.key, scale: block.scale };
  }
  const genreScale = getGenreScale(block.coreGenre || block.genre);
  return { root: _globalKey.root, scale: genreScale };
}

function getStepPitch(block, stepIndex) {
  const key = getBlockKey(block);
  const scale = SCALES[key.scale] || SCALES.major;
  const octave = 4;
  const noteInScale = scale[stepIndex % scale.length];
  const octaveOffset = Math.floor(stepIndex / scale.length) * 12;
  return (octave + 1) * 12 + key.root + noteInScale + octaveOffset;
}

function getArpChordNotes(block) {
  const vec = block.vec || getTension8D(block.coreGenre || block.genre, profileKey);
  const H = vec.h;
  const key = getBlockKey(block);
  const rootMidi = getRootMidi(block, H);
  const progression = pickProgression(H, block.col * 0.3 + block.lane * 0.1);
  const degree = progression[0];
  // Internal ABO chord quality mapping (no UI exposure)
  const traits = resolveUserTraits(profileKey);
  const aboQual = getChordQuality(traits.abo);
  const chordQualOverride = getGenreChordQuality((block.coreGenre || block.genre || '').toLowerCase(), aboQual.quality);
  return getChordNotes(rootMidi, degree, key.scale, chordQualOverride);
}

function buildArpSequence(chordNotes, pattern, octaveRange, steps) {
  if (!chordNotes || !chordNotes.length) return [];
  let notes = [];
  for (let o = 0; o < (octaveRange || 1); o++) {
    chordNotes.forEach(n => notes.push(n + o * 12));
  }
  const seq = [];
  switch (pattern || 'up') {
    case 'up':
      for (let i = 0; i < steps; i++) seq.push(notes[i % notes.length]);
      break;
    case 'down':
      for (let i = 0; i < steps; i++) seq.push(notes[notes.length - 1 - (i % notes.length)]);
      break;
    case 'updown':
    case 'pingpong': {
      const cycle = Math.max(1, notes.length * 2 - 2);
      for (let i = 0; i < steps; i++) {
        const pos = i % cycle;
        const idx = pos < notes.length ? pos : cycle - pos;
        seq.push(notes[idx]);
      }
      break;
    }
    case 'random':
      for (let i = 0; i < steps; i++) seq.push(notes[Math.floor(Math.random() * notes.length)]);
      break;
    default:
      for (let i = 0; i < steps; i++) seq.push(notes[i % notes.length]);
  }
  return seq;
}

function isInScale(midi, root, scaleName) {
  const semitone = (midi - root + 12) % 12;
  return SCALES[scaleName].includes(semitone);

  const activeOscs = new Map();

      const note = PIANO_KEYS[i];

      const isBlack = note.includes('#');
      const inScale = isInScale(midi, _scaleRoot, _currentScale);
      const key = document.createElement('div');
      const hasNote = targetBlock.notes.some(n => n.pitch === midi);
      const noteColor = hasNote ? (isBlack ? '#5a3a5a' : '#3a3a5a') : null;

      key.textContent = octaveLabel;

      const playNote = () => {
        if (!obAudioCtx) obAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (obAudioCtx.state === 'suspended') obAudioCtx.resume();
        const noteTimbre = getTimbreForGenre(targetBlock.coreGenre || targetBlock.genre, targetBlock.vec);
        const osc = obAudioCtx.createOscillator();
        const gain = obAudioCtx.createGain();
        const noteFilter = obAudioCtx.createBiquadFilter();
        osc.frequency.value = midiToFreq(midi);
        osc.type = noteTimbre.waveform || 'triangle';
        noteFilter.type = noteTimbre.filt || 'lowpass';
        noteFilter.frequency.value = (noteTimbre.cutoff || 2000) * 0.6;
        noteFilter.Q.value = noteTimbre.resonance || 1;
        osc.connect(noteFilter); noteFilter.connect(gain);
        const mixer = ensureMixer();
        gain.connect(mixer.getTrackInput(targetBlock.lane ?? 0) || mixer.master.gain);
        gain.gain.setValueAtTime(0, obAudioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.25, obAudioCtx.currentTime + 0.01);
        osc.start();
        activeOscs.set(midi, { osc, gain });
        key.style.transform = 'translateY(2px)';
        key.style.borderColor = '#fff';
      };
      const stopNote = () => {
        const h = activeOscs.get(midi);
        if (h) {
          h.gain.gain.cancelScheduledValues(obAudioCtx.currentTime);
          h.gain.gain.setValueAtTime(h.gain.gain.value, obAudioCtx.currentTime);
          h.gain.gain.exponentialRampToValueAtTime(0.001, obAudioCtx.currentTime + 0.1);
          h.osc.stop(obAudioCtx.currentTime + 0.1);
          activeOscs.delete(midi);

      };

      key.onmousedown = (e) => { e.preventDefault(); playNote(); };
      key.onmouseup = () => stopNote();
      key.onmouseleave = () => stopNote();
      key.ontouchstart = (e) => { e.preventDefault(); playNote(); };
      key.ontouchend = () => stopNote();
      // Add note to block on click (short click behavior handled by mouseup timing)
      let clickStart = 0;
      key.addEventListener('mousedown', () => { clickStart = Date.now(); });
      key.addEventListener('mouseup', () => {
        if (Date.now() - clickStart < 300) {
          const tc = targetBlock._pianoCursor || { time: 0, dur: 0.25 };
          targetBlock.notes.push({ pitch: midi, time: tc.time, dur: tc.dur, vel: 0.8 });
          saveToStorage();
          buildPianoPanel();

    timeIn.onchange = () => { n.time = Math.max(0, Math.min(1, parseFloat(timeIn.value) || 0)); saveToStorage(); };
    row.appendChild(document.createTextNode('t'));
    row.appendChild(timeIn);

    const durIn = document.createElement('input');
    durIn.type = 'number'; durIn.min = '0.01'; durIn.max = '1'; durIn.step = '0.01';

    durIn.onchange = () => { n.dur = Math.max(0.01, Math.min(1, parseFloat(durIn.value) || 0.25)); saveToStorage(); };
    row.appendChild(document.createTextNode('d'));
    row.appendChild(durIn);

    const delBtn = document.createElement('button');

  });

  // Randomize / Clear buttons
  const btnWrap = document.createElement('div');
  btnWrap.style.cssText = 'display:flex;gap:4px;margin-top:8px';

function quantizeNotes(block, grid = 1/8, strength = 1) {
  if (!block.notes || !block.notes.length) return;
  block.notes.forEach(n => {
    const target = Math.round(n.time / grid) * grid;
    n.time = n.time + (target - n.time) * strength;
  });
  saveToStorage();
  setInfo('Quantized ' + block.notes.length + ' notes');
}

const MAX_HISTORY = 40;

function _snapshot() {

    mixerState: _mixer ? _serializeMixerState() : null
  };
}
function _pushHistory() {
  const snap = _snapshot();
  // truncate redo branch
  if (_historyIdx < _history.length - 1) _history = _history.slice(0, _historyIdx + 1);
  _history.push(snap);
  if (_history.length > MAX_HISTORY) _history.shift();
  else _historyIdx++;
}
function undoLast() {
  if (_historyIdx <= 0) return;
  _historyIdx--;
  _restoreHistory(_history[_historyIdx]);
  setInfo('Undo');
}
function redoLast() {
  if (_historyIdx >= _history.length - 1) return;
  _historyIdx++;
  _restoreHistory(_history[_historyIdx]);
  setInfo('Redo');
}

  stopPlayback();

function _serializeMixerState() {
  if (!_mixer) return null;
  const trackState = _mixer.tracks.map(t => ({
    gain: t.gain.gain.value,
    pan: t.pan.pan.value,
    eqLow: t.eqLow.gain.value,
    eqMid: t.eqMid.gain.value,
    eqHigh: t.eqHigh.gain.value,
    delayGain: t.delayGain.gain.value,
    reverbSend: t.reverbSend.gain.value,
    mute: t.mute,
    solo: t.solo,
    _trackDelay: t._trackDelay || 0,
    _phaseInvert: t._phaseInvert || false
  }));
  return {
    tracks: trackState,
    master: {
      gain: _mixer.master.gain.gain.value,
      eqLow: _mixer.master.eqLow.gain.value,
      eqMid: _mixer.master.eqMid.gain.value,
      eqHigh: _mixer.master.eqHigh.gain.value
    }
  };
}

function _applyMixerState(state) {
  if (!_mixer || !state) return;
  state.tracks.forEach((s, i) => {
    const t = _mixer.tracks[i]; if (!t) return;
    t.gain.gain.value = s.gain;
    t.pan.pan.value = s.pan;
    t.eqLow.gain.value = s.eqLow;
    t.eqMid.gain.value = s.eqMid;
    t.eqHigh.gain.value = s.eqHigh;
    t.delayGain.gain.value = s.delayGain;
    t.reverbSend.gain.value = s.reverbSend;
    t.mute = s.mute;
    t.solo = s.solo;
    t._trackDelay = s._trackDelay || 0;
    t._phaseInvert = s._phaseInvert || false;
  });
  _mixer.applySoloMute();
  if (state.master) {
    _mixer.master.gain.gain.value = state.master.gain;
    _mixer.master.eqLow.gain.value = state.master.eqLow;
    _mixer.master.eqMid.gain.value = state.master.eqMid;
    _mixer.master.eqHigh.gain.value = state.master.eqHigh;
  }
}

function bufferToWave(abuffer, len) {
  let numOfChan = abuffer.numberOfChannels, length = len * numOfChan * 2 + 44,
    buffer = new ArrayBuffer(length), view = new DataView(buffer),
    channels = [], i, sample, offset = 0, pos = 0;
  // write WAVE header
  setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
  setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
  setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan);
  setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164);
  setUint32(length - pos - 4);
  for(i = 0; i < abuffer.numberOfChannels; i++)
    channels.push(abuffer.getChannelData(i));
  while(pos < length) {
    for(i = 0; i < numOfChan; i++) {
      sample = Math.max(-1, Math.min(1, channels[i][offset]));
      sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0;
      view.setInt16(pos, sample, true); pos += 2;
    }
    offset++;
  }
  return new Blob([buffer], {type: 'audio/wav'});
  function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
  function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
}

// ── MIDI Export ──────────────────────────────────────────────
function freqToMidi(freq) {
  if (freq <= 0) return 60;
  return Math.round(69 + 12 * Math.log2(freq / 440));
}

function writeVarLen(value) {
  const bytes = [];
  let v = value;
  bytes.push(v & 0x7F);
  v >>= 7;
  while (v > 0) {
    bytes.push((v & 0x7F) | 0x80);
    v >>= 7;
  }
  return bytes.reverse();
}

function midiEventBytes(delta, status, data1, data2) {
  const d = writeVarLen(delta);
  return [...d, status, data1, data2 ?? 0];
}

function generateMidiEvents(block, startTick, ticksPerBeat, barDuration) {
  const events = []; // { tick, status, data1, data2 }
  const vec = block.vec || getTension8D(block.coreGenre || block.genre, profileKey);
  const R = vec.r, H = vec.h, D = vec.d, P = vec.p, S = vec.s;
  const bpm = getBPM(block.coreGenre || block.genre);
  const traits = resolveUserTraits(profileKey);
  const gRhythm = getGenderRhythm(traits.gender);
  const velKickMul = gRhythm.emphasis === 'downbeat' ? 1.12 : 0.92;
  const velSnareMul = gRhythm.emphasis === 'downbeat' ? 0.95 : 1.15;
  const velHatMul = gRhythm.emphasis === 'downbeat' ? 0.95 : 1.08;
  const beatDur = 60 / bpm;
  const dur = barDuration || Math.min(16, Math.max(4, (8 * 60) / bpm));
  const barBeats = Math.max(4, Math.floor(dur / beatDur));
  const ticksPerBeat_ = ticksPerBeat;
  const ticksPerBar = ticksPerBeat_ * barBeats;

  // Percussion patterns (same as circuitSynthesize)
  const density = Math.max(1, Math.round(R * 16));
  const kickPulses = Math.max(1, Math.round(density * (0.3 + P * 0.2)));
  const snrPulses = Math.max(0, Math.round(density * (0.2 + P * 0.15)));
  const hatPulses = Math.max(1, Math.round(density * (0.5 + P * 0.3)));
  const kickPattern = euclideanRhythm(kickPulses, barBeats);
  const snrPattern = euclideanRhythm(snrPulses, barBeats);
  const hatPattern = euclideanRhythm(hatPulses, barBeats);

  const ticksPerStep = ticksPerBeat_ / 4; // 16th note resolution
  const stepsPerBeat = 4;

  // Kick (MIDI 36), Snare (38), Hi-hat (42) on channel 10
  kickPattern.forEach((hit, i) => {
    if (!hit) return;
    const tick = startTick + i * ticksPerBeat_;
    events.push({ tick, status: 0x99, data1: 36, data2: Math.round((70 + R * 30) * velKickMul) });
    events.push({ tick: tick + ticksPerBeat_ / 4, status: 0x89, data1: 36, data2: 0 });
  });
  snrPattern.forEach((hit, i) => {
    if (!hit) return;
    const tick = startTick + i * ticksPerBeat_;
    events.push({ tick, status: 0x99, data1: 38, data2: Math.round((60 + R * 20) * velSnareMul) });
    events.push({ tick: tick + ticksPerBeat_ / 4, status: 0x89, data1: 38, data2: 0 });
  });
  hatPattern.forEach((hit, i) => {
    if (!hit) return;
    const tick = startTick + i * ticksPerBeat_;
    events.push({ tick, status: 0x99, data1: 42, data2: Math.round((40 + S * 40) * velHatMul) });
    events.push({ tick: tick + ticksPerBeat_ / 8, status: 0x89, data1: 42, data2: 0 });
  });

  // Tonal layer (channel 0) — chord notes using key-aware progression
  const key = getBlockKey(block);
  const rootMidi = getRootMidi(block, H);
  const progression = pickProgression(H, block.col * 0.3 + block.lane * 0.1);
  const chordCount = Math.min(4, Math.max(1, Math.floor(dur / 2)));
  const midiChordQual = getGenreChordQuality((block.coreGenre || block.genre || '').toLowerCase(), null);
  for (let ci = 0; ci < chordCount; ci++) {
    const degree = progression[ci % progression.length];
    const chordNotes = getChordNotes(rootMidi, degree, key.scale, midiChordQual);
    const chordStart = (ci / chordCount) * dur;
    const chordTick = startTick + Math.round(chordStart * ticksPerBeat_);
    const chordDur = Math.round((dur / chordCount) * ticksPerBeat_);
    chordNotes.forEach(note => {
      const vel = Math.round(40 + (1 - D) * 30);
      events.push({ tick: chordTick, status: 0x90, data1: Math.min(127, Math.max(0, note)), data2: vel });
      events.push({ tick: chordTick + chordDur, status: 0x80, data1: Math.min(127, Math.max(0, note)), data2: 0 });
    });
  }

  return events;
}

function writeMidiFile(allEvents, ticksPerQuarter) {
  // Sort all events by tick
  allEvents.sort((a, b) => a.tick - b.tick);

  // Build track data
  const trackData = [];
  let lastTick = 0;
  allEvents.forEach(ev => {
    const delta = ev.tick - lastTick;
    lastTick = ev.tick;
    const bytes = midiEventBytes(delta, ev.status, ev.data1, ev.data2);
    trackData.push(...bytes);
  });
  // End of track
  trackData.push(0x00, 0xFF, 0x2F, 0x00);

  // Build file
  const headerLen = 14;
  const trackLen = 8 + trackData.length;
  const fileLen = headerLen + trackLen;
  const buf = new ArrayBuffer(fileLen);
  const v = new DataView(buf);

  // Header: "MThd"
  const ws = (off, str) => { for (let i = 0; i < str.length; i++) v.setUint8(off + i, str.charCodeAt(i)); };
  ws(0, 'MThd');
  v.setUint32(4, 6, false);    // header length
  v.setUint16(8, 0, false);    // format 0 (single track)
  v.setUint16(10, 1, false);   // 1 track
  v.setUint16(12, ticksPerQuarter, false); // ticks per quarter

  // Track: "MTrk"
  const trackOff = 14;
  ws(trackOff, 'MTrk');
  v.setUint32(trackOff + 4, trackData.length, false);
  trackData.forEach((b, i) => v.setUint8(trackOff + 8 + i, b));

  return buf;
}

function exportMidi() {
  if (!timeline.length) { setInfo('No blocks to export'); return; }
  const cols = [...new Set(timeline.map(b => b.col))].sort((a, b) => a - b);
  const ticksPerQuarter = 480;

  // Compute bar durations in ticks
  let totalTicks = 0;
  const barTicks = [];
  cols.forEach(col => {
    barTicks.push(totalTicks);
    const cb = timeline.filter(b => b.col === col);
    const bpm = cb.length ? Math.max(...cb.map(b => b.bpm || 90)) : 90;
    const dur = Math.min(16, Math.max(4, (8 * 60) / bpm));
    const beats = Math.max(4, Math.floor(dur / (60 / bpm)));
    totalTicks += beats * ticksPerQuarter;
  });

  // Generate events for all blocks
  const allEvents = [];
  // Add tempo meta event at start
  const firstBpm = timeline[0]?.bpm || 90;
  const tempoUs = Math.round(60000000 / firstBpm);
  allEvents.push({ tick: 0, status: 0xFF, data1: 0x51, data2: 0x03, meta: [
    (tempoUs >> 16) & 0xFF, (tempoUs >> 8) & 0xFF, tempoUs & 0xFF
  ] });

  cols.forEach((col, i) => {
    const blocks = timeline.filter(b => b.col === col);
    const cb = blocks.length ? blocks : [];
    const bpm = cb.length ? Math.max(...cb.map(b => b.bpm || 90)) : 90;
    const barDur = Math.min(16, Math.max(4, (8 * 60) / bpm));
    blocks.forEach(b => {
      const evs = generateMidiEvents(b, barTicks[i], ticksPerQuarter, barDur);
      allEvents.push(...evs);
    });
    // User piano-roll notes
    const beats = Math.max(4, Math.floor(barDur / (60 / bpm)));
    const tpb = beats * ticksPerQuarter;
    blocks.forEach(b => {
      if (b.notes && b.notes.length) {
        b.notes.forEach(n => {
          const onTick = barTicks[i] + Math.round(Math.max(0, n.time || 0) * tpb);
          const offTick = onTick + Math.round(Math.max(0.05, n.dur || 0.25) * tpb);
          const vel = Math.min(127, Math.max(1, Math.round((n.vel || 0.8) * 127)));
          allEvents.push({ tick: onTick, status: 0x90, data1: Math.min(127, Math.max(0, n.pitch)), data2: vel });
          allEvents.push({ tick: offTick, status: 0x80, data1: Math.min(127, Math.max(0, n.pitch)), data2: 0 });
        });
      }
      if (b.steps && b.steps.length) {
        b.steps.forEach((vel, si) => {
          if (vel <= 0) return;
          const stepTick = barTicks[i] + Math.round((si / _seqSteps) * tpb);
          const stepOff = stepTick + Math.max(1, Math.round(tpb / _seqSteps));
          const pitch = Math.min(127, Math.max(0, getStepPitch(b, si)));
          const v = Math.min(127, Math.max(1, Math.round(vel * 127)));
          allEvents.push({ tick: stepTick, status: 0x90, data1: pitch, data2: v });
          allEvents.push({ tick: stepOff, status: 0x80, data1: pitch, data2: 0 });
        });
      }
      if (b.arpeggio && b.arpeggio.enabled) {
        const rateMap = { '1/4': 4, '1/8': 8, '1/16': 16, '1/32': 32 };
        const steps = rateMap[b.arpeggio.rate] || 16;
        const gate = b.arpeggio.gate || 0.8;
        const chordNotes = getArpChordNotes(b);
        const arpNotes = buildArpSequence(chordNotes, b.arpeggio.pattern, b.arpeggio.octaveRange, steps);
        const stepTicks = Math.round(tpb / steps);
        const noteLen = Math.max(1, Math.round(stepTicks * gate));
        arpNotes.forEach((noteMidi, ai) => {
          const onTick = barTicks[i] + ai * stepTicks;
          const pitch = Math.min(127, Math.max(0, noteMidi));
          const vel = Math.min(127, Math.max(1, Math.round(80)));
          allEvents.push({ tick: onTick, status: 0x90, data1: pitch, data2: vel });
          allEvents.push({ tick: onTick + noteLen, status: 0x80, data1: pitch, data2: 0 });
        });
      }
    });
  });

  // Handle meta events in writeMidiFile
  const midiBuf = writeMidiFileWithMeta(allEvents, ticksPerQuarter);
  const blob = new Blob([midiBuf], { type: 'audio/midi' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'circuit-composition.mid'; a.click();
  URL.revokeObjectURL(url);
  setInfo('MIDI export complete → circuit-composition.mid');
}

function writeMidiFileWithMeta(allEvents, ticksPerQuarter) {
  allEvents.sort((a, b) => a.tick - b.tick);
  const trackData = [];
  let lastTick = 0;
  allEvents.forEach(ev => {
    const delta = ev.tick - lastTick;
    lastTick = ev.tick;
    if (ev.meta) {
      // Meta event: FF type len data
      const d = writeVarLen(delta);
      trackData.push(...d, ev.status, ev.data1, ev.data2);
      trackData.push(...ev.meta);
    } else {
      const bytes = midiEventBytes(delta, ev.status, ev.data1, ev.data2);
      trackData.push(...bytes);
    }
  });
  trackData.push(0x00, 0xFF, 0x2F, 0x00);

  const headerLen = 14;
  const trackLen = 8 + trackData.length;
  const fileLen = headerLen + trackLen;
  const buf = new ArrayBuffer(fileLen);
  const v = new DataView(buf);
  const ws = (off, str) => { for (let i = 0; i < str.length; i++) v.setUint8(off + i, str.charCodeAt(i)); };
  ws(0, 'MThd');
  v.setUint32(4, 6, false);
  v.setUint16(8, 0, false);
  v.setUint16(10, 1, false);
  v.setUint16(12, ticksPerQuarter, false);
  ws(14, 'MTrk');
  v.setUint32(18, trackData.length, false);
  trackData.forEach((b, i) => v.setUint8(22 + i, b));
  return buf;
}

async function exportStems() {
  if (!timeline.length) { setInfo('No blocks to export'); return; }
  const cols = [...new Set(timeline.map(b => b.col))].sort((a, b) => a - b);
  let totalDur = 0;
  const barTimes = [];
  const barDurs = [];
  cols.forEach(col => {
    barTimes.push(totalDur);
    const cb = timeline.filter(b => b.col === col);
    const bpm = cb.length ? Math.max(...cb.map(b => b.bpm || 90)) : 90;
    const dur = Math.min(16, Math.max(4, (8 * 60) / bpm));
    barDurs.push(dur);
    totalDur += dur;
  });

  const SR = 44100;
  const usedLanes = [...new Set(timeline.map(b => b.lane ?? 0))].sort();
  const savedMixer = _mixer;
  const savedCtx = obAudioCtx;

  for (const lane of usedLanes) {
    setInfo(`Rendering lane ${lane + 1}…`);
    const offCtx = new OfflineAudioContext(2, Math.ceil(totalDur * SR), SR);
    obAudioCtx = offCtx;
    _mixer = null; _masterCompressor = null;
    ensureMixer();

    cols.forEach((col, i) => {
      const blocks = timeline.filter(b => b.col === col && (b.lane ?? 0) === lane);
      blocks.forEach(b => {
        circuitSynthesize(b, barTimes[i], barDurs[i] * (b.duration || 1));
        if (b.notes && b.notes.length) {
          b.notes.forEach(n => {
            const noteTime = barTimes[i] + n.time * barDurs[i];
            const noteDur = n.dur * barDurs[i];
            const freq = midiToFreq(n.pitch);
            const noteTimbre = getTimbreForGenre(b.coreGenre || b.genre, b.vec);
            const osc = offCtx.createOscillator();
            const gain = offCtx.createGain();
            const noteFilter = offCtx.createBiquadFilter();
            osc.frequency.value = freq;
            osc.type = noteTimbre.waveform || 'triangle';
            noteFilter.type = noteTimbre.filt || 'lowpass';
            noteFilter.frequency.value = (noteTimbre.cutoff || 2000) * 0.6;
            noteFilter.Q.value = noteTimbre.resonance || 1;
            gain.gain.setValueAtTime(0, noteTime);
            gain.gain.linearRampToValueAtTime(n.vel * 0.3, noteTime + 0.02);
            gain.gain.linearRampToValueAtTime(0, noteTime + noteDur);
            const trackInput = _mixer.getTrackInput(b.lane ?? 0);
            osc.connect(noteFilter); noteFilter.connect(gain); gain.connect(trackInput || _mixer.master.gain);
            osc.start(noteTime); osc.stop(noteTime + noteDur);
          });
        }
        else if (b.steps && b.steps.some(s => s > 0)) {
          const stepDur = barDurs[i] / b.steps.length;
          b.steps.forEach((vel, idx) => {
            if (vel > 0) {
              const stepTime = barTimes[i] + idx * stepDur;
              const stepTimbre = getTimbreForGenre(b.coreGenre || b.genre, b.vec);
              const osc = offCtx.createOscillator();
              const gain = offCtx.createGain();
              const filt = offCtx.createBiquadFilter();
              osc.type = stepTimbre.waveform || 'triangle';
              osc.frequency.setValueAtTime(midiToFreq(getStepPitch(b, idx)), stepTime);
              filt.type = stepTimbre.filt || 'lowpass';
              filt.frequency.value = stepTimbre.cutoff || 2000;
              filt.Q.value = stepTimbre.resonance || 1;
              gain.gain.setValueAtTime(0, stepTime);
              gain.gain.linearRampToValueAtTime(vel * 0.12, stepTime + 0.01);
              gain.gain.exponentialRampToValueAtTime(0.001, stepTime + 0.15);
              osc.connect(filt); filt.connect(gain);
              const trackInput = _mixer.getTrackInput(b.lane ?? 0);
              gain.connect(trackInput || _mixer.master.gain);
              osc.start(stepTime); osc.stop(stepTime + 0.2);
            }
          });
        }
        // Arpeggiator overlay
        if (b.arpeggio && b.arpeggio.enabled) {
          const rateMap = { '1/4': 4, '1/8': 8, '1/16': 16, '1/32': 32 };
          const steps = rateMap[b.arpeggio.rate] || 16;
          const gate = b.arpeggio.gate || 0.8;
          const chordNotes = getArpChordNotes(b);
          const arpNotes = buildArpSequence(chordNotes, b.arpeggio.pattern, b.arpeggio.octaveRange, steps);
          const stepDur = barDurs[i] / steps;
          const timbre = getTimbreForGenre((b.coreGenre || b.genre || 'ambient').toLowerCase(), b.vec);
          arpNotes.forEach((noteMidi, i2) => {
            const noteTime = barTimes[i] + i2 * stepDur;
            const noteLen = stepDur * gate;
            const freq = midiToFreq(noteMidi);
            const osc = offCtx.createOscillator();
            const gain = offCtx.createGain();
            const noteFilter = offCtx.createBiquadFilter();
            osc.frequency.value = freq;
            osc.type = timbre.waveform || 'triangle';
            noteFilter.type = timbre.filt || 'lowpass';
            noteFilter.frequency.value = (timbre.cutoff || 2000) * 0.6;
            noteFilter.Q.value = timbre.resonance || 1;
            gain.gain.setValueAtTime(0, noteTime);
            gain.gain.linearRampToValueAtTime(0.15, noteTime + 0.02);
            gain.gain.linearRampToValueAtTime(0, noteTime + noteLen);
            const trackInput = _mixer.getTrackInput(b.lane ?? 0);
            osc.connect(noteFilter); noteFilter.connect(gain); gain.connect(trackInput || _mixer.master.gain);
            osc.start(noteTime); osc.stop(noteTime + noteLen);
          });
        }
      });
    });

    try {
      const rendered = await offCtx.startRendering();
      const wav = _encodeWAV(rendered);
      const blob = new Blob([wav], { type: 'audio/wav' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `circuit-stem-lane${lane + 1}.wav`; a.click();
      URL.revokeObjectURL(url);
    } catch (e) { setInfo('Stem export failed: ' + e.message); return; }
  }
  obAudioCtx = savedCtx;
  _mixer = savedMixer;
  _masterCompressor = null;
  if (_mixer && _mixerVisible) renderMixer();
  setInfo(`Stems exported → ${usedLanes.length} lanes`);
}

function _encodeWAV(audioBuffer){
  const nCh=audioBuffer.numberOfChannels,SR=audioBuffer.sampleRate,n=audioBuffer.length;
  const bD=16,bA=nCh*(bD/8),byteR=SR*bA,dataSz=n*bA;
  const buf=new ArrayBuffer(44+dataSz),v=new DataView(buf);
  const ws=(off,str)=>{for(let i=0;i<str.length;i++)v.setUint8(off+i,str.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+dataSz,true);ws(8,'WAVE');
  ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);
  v.setUint16(22,nCh,true);v.setUint32(24,SR,true);
  v.setUint32(28,byteR,true);v.setUint16(32,bA,true);
  v.setUint16(34,bD,true);ws(36,'data');v.setUint32(40,dataSz,true);
  let off=44;
  const ch0=audioBuffer.getChannelData(0);
  const ch1=nCh>1?audioBuffer.getChannelData(1):ch0;
  for(let i=0;i<n;i++){
    const s0=Math.max(-1,Math.min(1,ch0[i]));
    const s1=Math.max(-1,Math.min(1,ch1[i]));
    v.setInt16(off,s0<0?s0*0x8000:s0*0x7FFF,true);off+=2;
    v.setInt16(off,s1<0?s1*0x8000:s1*0x7FFF,true);off+=2;
  }
  return buf;
}

        const audio = new Audio(window.circuit.wavUrl(data.wav_path));
        audio.preload = 'auto';
        obAudioElements[data.calib_index] = audio;
        updateCalibCard(data.calib_index, 'ready');
      } else if (data.status === 'generating') {
        updateCalibCard(data.calib_index, 'generating');
      }
      return;
    }

    // 2. Handle Timeline block events
    const block = timeline.find(b => b.block_id === data.block_id);
    if (!block) return;
    if (data.status === 'generating') {
      block.genStatus = 'generating';
    } else if (data.status === 'done') {
      block.genStatus = 'ready';
      block.wavPath = data.wav_path;
      const audio = new Audio(window.circuit.wavUrl(data.wav_path));
      audio.preload = 'auto';
      _blockAudio[block.block_id] = { wavPath: data.wav_path, audio };
      saveToStorage();
    } else if (data.status === 'error') {
      block.genStatus = 'error';
    }
    drawTL();
    setInfo(`Sound ${data.status}`);
  });
}

// Web MIDI Input
let _midiAccess = null;
async function initMIDI() {
  try {
    _midiAccess = await navigator.requestMIDIAccess({ sysex: false });
    _midiAccess.inputs.forEach(input => {
      input.onmidimessage = (msg) => {
        const [cmd, note, vel] = msg.data;
        if ((cmd & 0xf0) === 0x90 && vel > 0) {
          // Note on
          if (!obAudioCtx) obAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (obAudioCtx.state === 'suspended') obAudioCtx.resume();
          const osc = obAudioCtx.createOscillator();
          const gain = obAudioCtx.createGain();
          osc.frequency.value = midiToFreq(note);
          osc.type = 'triangle';
          gain.gain.setValueAtTime(vel / 127 * 0.3, obAudioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, obAudioCtx.currentTime + 0.5);
          osc.connect(gain); gain.connect(obAudioCtx.destination);
          osc.start(); osc.stop(obAudioCtx.currentTime + 0.5);
          // Add to current block if exists
          if (timeline.length) {
            const targetBlock = _selectedBlock || timeline[timeline.length - 1];
            if (!targetBlock.notes) targetBlock.notes = [];
            targetBlock.notes.push({ pitch: note, time: 0, dur: 0.25, vel: vel / 127 });
            saveToStorage();
          }
          setInfo(`MIDI note ${note}`);
        }
      };
    });
    setInfo('MIDI connected');
  } catch (e) { setInfo('MIDI unavailable'); }
}

function applyAutomation(lane, time, duration) {
  if (!_mixer || !_mixer.tracks[lane]) return;
  const t = _mixer.tracks[lane];
  if (!t.automation || !t.automation.length) return;
  const pt = t.automation[0];
  if (pt.param === 'vol') {
    t.gain.gain.linearRampToValueAtTime(pt.value, time + duration);
  } else if (pt.param === 'pan') {
    t.pan.pan.linearRampToValueAtTime(pt.value, time + duration);
  }
}

let _sidechainSource = 0; // lane that triggers ducking
let _sidechainAmount = 0.5;
function toggleSidechain(lane) {
  _sidechainSource = lane;
  setInfo(`Sidechain source → L${lane + 1}`);
}
function applySidechain(time, barDuration) {
  if (_sidechainAmount <= 0 || !_mixer) return;
  // Simple ducking: when sidechain source plays, dip other lanes briefly
  const dipDur = 0.15;
  const recoverDur = 0.3;
  _mixer.tracks.forEach((t, i) => {
    if (i === _sidechainSource) return;
    t.gain.gain.setValueAtTime(t.gain.gain.value, time);
    t.gain.gain.exponentialRampToValueAtTime(t.gain.gain.value * (1 - _sidechainAmount), time + dipDur);
    t.gain.gain.exponentialRampToValueAtTime(t.gain.gain.value, time + dipDur + recoverDur);
  });
}

}

function scheduleMetronome(startTime, bpm, beats) {
  if (!_metronomeOn || !obAudioCtx) return;
  const interval = 60 / bpm;
  for (let i = 0; i < beats; i++) {
    const t = startTime + i * interval;
    const osc = obAudioCtx.createOscillator();
    const gain = obAudioCtx.createGain();
    osc.connect(gain);
    gain.connect(obAudioCtx.destination);
    osc.frequency.value = i === 0 ? 1000 : 800;
    gain.gain.setValueAtTime(_metronomeVol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    osc.start(t);
    osc.stop(t + 0.05);
  }
}
