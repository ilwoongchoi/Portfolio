// Simple MIDI parser — extracts note-on events
function parseMidiNotes(data) {
  const notes = [];
  let i = 0;
  // Skip header
  if (data[i] === 0x4D && data[i+1] === 0x54 && data[i+2] === 0x68 && data[i+3] === 0x64) {
    i += 14; // header chunk
  }
  const readVarLen = () => { let v = 0, b; do { b = data[i++]; v = (v << 7) | (b & 0x7F); } while (b & 0x80); return v; };
  while (i < data.length - 4) {
    if (data[i] === 0x4D && data[i+1] === 0x54 && data[i+2] === 0x72 && data[i+3] === 0x6B) {
      i += 4; // track header
      const len = (data[i] << 24) | (data[i+1] << 16) | (data[i+2] << 8) | data[i+3];
      i += 4;
      const end = i + len;
      let runningStatus = 0;
      let absTick = 0;
      while (i < end) {
        const delta = readVarLen();
        absTick += delta;
        let status = data[i];
        if (status & 0x80) { runningStatus = status; i++; }
        else status = runningStatus;
        const cmd = status & 0xF0;
        const ch = status & 0x0F;
        if (cmd === 0x90) { // note on
          const note = data[i++];
          const vel = data[i++];
          if (vel > 0) notes.push({ pitch: note, time: absTick / 480, dur: 0.25, vel: vel / 127 });
        } else if (cmd === 0x80 || cmd === 0xB0 || cmd === 0xE0) { i += 2; }
        else if (cmd === 0xC0 || cmd === 0xD0) { i += 1; }
        else if (status === 0xFF) { const type = data[i++]; const l = readVarLen(); i += l; }
        else { i++; }
      }
    } else { i++; }
  }
  // Normalize times
  if (notes.length) {
    const minT = Math.min(...notes.map(n => n.time));
    notes.forEach(n => n.time -= minT);
  }
  return notes;
}

function tapTempo() {
  const now = Date.now();
  _tapTimes.push(now);
  _tapTimes = _tapTimes.filter(t => now - t < 2000);
  if (_tapTimes.length >= 2) {
    const intervals = [];
    for (let i = 1; i < _tapTimes.length; i++) intervals.push(_tapTimes[i] - _tapTimes[i-1]);
    const avg = intervals.reduce((a,b)=>a+b,0) / intervals.length;
    const bpm = Math.round(60000 / avg);
    document.getElementById('bpm-val').textContent = bpm;
    setInfo(`Tap tempo → ${bpm} BPM`);
  }
}

// ═══════════════════════════════════════════════════════════════
// MULTI-TRACK MIXER + EFFECT CHAIN SYSTEM
// 4 lanes → 4 tracks → master bus → destination
// Each track: volume, pan, 3-band EQ, delay, reverb send
// Master: EQ, compressor, limiter
// ═══════════════════════════════════════════════════════════════
let _mixer = null;

function initMixer(ctx) {
  if (_mixer && _mixer.ctx === ctx) return _mixer;

  // ── Master bus ──
  const masterGain = ctx.createGain();
  masterGain.gain.value = 0.85;

  // Master EQ — 3-band
  const masterEqLow  = ctx.createBiquadFilter();
  masterEqLow.type = 'lowshelf'; masterEqLow.frequency.value = 200; masterEqLow.gain.value = 0;
  const masterEqMid  = ctx.createBiquadFilter();
  masterEqMid.type = 'peaking';  masterEqMid.frequency.value = 1000; masterEqMid.Q.value = 0.7; masterEqMid.gain.value = 0;
  const masterEqHigh = ctx.createBiquadFilter();
  masterEqHigh.type = 'highshelf'; masterEqHigh.frequency.value = 4000; masterEqHigh.gain.value = 0;
  masterGain.connect(masterEqLow); masterEqLow.connect(masterEqMid); masterEqMid.connect(masterEqHigh);

  // Master compressor
  const masterComp = ctx.createDynamicsCompressor();
  masterComp.threshold.value = -12; masterComp.knee.value = 6;
  masterComp.ratio.value = 6; masterComp.attack.value = 0.003; masterComp.release.value = 0.25;
  masterEqHigh.connect(masterComp);

  // Master limiter (waveshaper soft-clip)
  const masterLimiter = ctx.createWaveShaper();
  const limCurve = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    const x = (i - 128) / 128;
    limCurve[i] = Math.tanh(x * 2.5) / Math.tanh(2.5);
  }
  masterLimiter.curve = limCurve;
  masterComp.connect(masterLimiter);
  // Analyser for visualizer
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 256;
  masterLimiter.connect(analyser);
  analyser.connect(ctx.destination);

  // Master mono toggle node
  const masterMonoGain = ctx.createGain();
  masterMonoGain.channelCount = 1;
  masterMonoGain.channelCountMode = 'explicit';

  // ── Shared reverb bus ──
  const reverbGain = ctx.createGain();
  reverbGain.gain.value = 0.3;
  const reverbConv = ctx.createConvolver();
  const revLen = Math.min(ctx.sampleRate * 2.5, ctx.sampleRate * 4);
  const revImpulse = ctx.createBuffer(2, revLen, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = revImpulse.getChannelData(ch);
    for (let i = 0; i < revLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / revLen, 2.5);
  }
  reverbConv.buffer = revImpulse;
  reverbGain.connect(reverbConv); reverbConv.connect(masterGain);

  // ── Per-track strips (4 lanes) ──
  const tracks = [];
  for (let lane = 0; lane < LANES; lane++) {
    const strip = {};

    // Input gain (track fader — user controlled)
    strip.gain = ctx.createGain();
    strip.gain.gain.value = 0.8;

    // Mute gate (VCA-style, separate from user fader)
    strip.muteGate = ctx.createGain();
    strip.muteGate.gain.value = 1;
    strip.gain.connect(strip.muteGate);

    // Pan
    strip.pan = ctx.createStereoPanner();
    strip.pan.pan.value = 0;
    strip.muteGate.connect(strip.pan);

    // 3-band EQ
    strip.eqLow  = ctx.createBiquadFilter();
    strip.eqLow.type = 'lowshelf';  strip.eqLow.frequency.value = 250;  strip.eqLow.gain.value = 0;
    strip.eqMid  = ctx.createBiquadFilter();
    strip.eqMid.type = 'peaking';   strip.eqMid.frequency.value = 800;   strip.eqMid.Q.value = 0.8; strip.eqMid.gain.value = 0;
    strip.eqHigh = ctx.createBiquadFilter();
    strip.eqHigh.type = 'highshelf'; strip.eqHigh.frequency.value = 3000; strip.eqHigh.gain.value = 0;
    strip.pan.connect(strip.eqLow); strip.eqLow.connect(strip.eqMid); strip.eqMid.connect(strip.eqHigh);

    // Delay (feedback)
    strip.delay = ctx.createDelay(2.0);
    strip.delay.delayTime.value = 0.25;
    strip.delayGain = ctx.createGain();
    strip.delayGain.gain.value = 0;
    strip.delay.connect(strip.delayGain); strip.delayGain.connect(strip.delay); // feedback loop
    strip.eqHigh.connect(strip.delay);

    // Dry + wet mix
    strip.dryGain = ctx.createGain();
    strip.dryGain.gain.value = 1;
    strip.wetGain = ctx.createGain();
    strip.wetGain.gain.value = 0;
    strip.eqHigh.connect(strip.dryGain);
    strip.delayGain.connect(strip.wetGain);

    // Reverb send
    strip.reverbSend = ctx.createGain();
    strip.reverbSend.gain.value = 0.15;
    strip.eqHigh.connect(strip.reverbSend);
    strip.reverbSend.connect(reverbGain);

    // Sum dry + wet → master
    strip.dryGain.connect(masterGain);
    strip.wetGain.connect(masterGain);

    // Automation storage
    strip.automation = [];

    // State
    strip.solo = false;
    strip.mute = false;
    strip._lane = lane;

    tracks.push(strip);
  }

  _mixer = {
    ctx,
    tracks,
    master: { gain: masterGain, eqLow: masterEqLow, eqMid: masterEqMid, eqHigh: masterEqHigh, comp: masterComp, limiter: masterLimiter, monoGain: masterMonoGain },
    reverb: { gain: reverbGain, conv: reverbConv },
    analyser,
    getTrackInput(lane) { return tracks[lane]?.gain; },
    applySoloMute() {
      const anySolo = tracks.some(t => t.solo);
      tracks.forEach(t => {
        const audible = anySolo ? t.solo : !t.mute;
        t.muteGate.gain.linearRampToValueAtTime(audible ? 1 : 0, ctx.currentTime + 0.01);
      });
    }
  };
  return _mixer;
}

function ensureMixer() {
  if (!obAudioCtx) obAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return initMixer(obAudioCtx);
}

  const limiter = _mixer.master.limiter;
  const monoGain = _mixer.master.monoGain;
  const analyser = _mixer.analyser;
  try { limiter.disconnect(); } catch(e) {}
  try { monoGain.disconnect(); } catch(e) {}
  if (_masterMono) {
    limiter.connect(monoGain);
    monoGain.connect(analyser);
  } else {
    limiter.connect(analyser);

  renderMixer();

        <button class="mix-btn${t.solo?' on':''}" id="mbtn-solo-${i}" onclick="toggleSolo(${i})">S</button>
        <button class="mix-btn${t._phaseInvert?' on':''}" onclick="togglePhaseInvert(${i})">∅</button>
      </div>
    </div>`;
  }).join('');

  // Master strip
  const mg = _mixer.master.gain.gain.value;
  html += `<div class="mix-strip master">
    <div class="mix-label" style="color:#5a5a8a">MASTER</div>
    <input type="range" class="mix-fader" min="0" max="150" value="${Math.round(mg*100)}"
      oninput="setMasterVol(this.value/100)" title="Master Volume">
    <div class="mix-val">${Math.round(mg*100)}%</div>
    <div class="mix-knob-row">
      <div class="mix-knob-wrap">
        <input type="range" class="mix-knob" min="-12" max="12" value="${_mixer.master.eqLow.gain.value}"
          oninput="setMasterEQ('low',this.value)" title="Master Low">
        <div class="mix-knob-lbl">LO</div>
      </div>
      <div class="mix-knob-wrap">
        <input type="range" class="mix-knob" min="-12" max="12" value="${_mixer.master.eqMid.gain.value}"
          oninput="setMasterEQ('mid',this.value)" title="Master Mid">
        <div class="mix-knob-lbl">MID</div>
      </div>
      <div class="mix-knob-wrap">
        <input type="range" class="mix-knob" min="-12" max="12" value="${_mixer.master.eqHigh.gain.value}"
          oninput="setMasterEQ('high',this.value)" title="Master High">
        <div class="mix-knob-lbl">HI</div>
      </div>
    </div>
    <div class="mix-val" style="color:var(--text-med)">COMP: ${_mixer.master.comp.threshold.value}dB</div>
    <div class="mix-btn-row">
      <button class="mix-btn${_masterMono?' on':''}" onclick="toggleMasterMono()">MONO</button>
      <button class="mix-btn" onclick="muteAllTracks()">M All</button>
      <button class="mix-btn" onclick="clearAllSolo()">Clr S</button>
    </div>
    <div style="width:100%;height:4px;background:var(--dark);border-radius:2px;margin-top:4px;overflow:hidden">
      <div id="vu-meter" style="width:0%;height:100%;background:var(--accent);transition:width .05s"></div>
    </div>
  </div>`;

  panel.innerHTML = html;
}

function setTrackVol(lane, val) {
  if (!_mixer) return;
  _mixer.tracks[lane].gain.gain.value = val;
  if (_mixerVisible) renderMixer();
  saveToStorage();
}
function setTrackPan(lane, val) {
  if (!_mixer) return;
  _mixer.tracks[lane].pan.pan.value = val;
  saveToStorage();
}
function setTrackEQ(lane, band, val) {
  if (!_mixer) return;
  const t = _mixer.tracks[lane];
  const node = band === 'low' ? t.eqLow : band === 'mid' ? t.eqMid : t.eqHigh;
  node.gain.value = parseFloat(val);
  saveToStorage();
}
function resetTrackEQ(lane) {
  if (!_mixer) return;
  const t = _mixer.tracks[lane];
  t.eqLow.gain.value = 0;
  t.eqMid.gain.value = 0;
  t.eqHigh.gain.value = 0;
  if (_mixerVisible) renderMixer();
  saveToStorage();
}
function resetAllEQ() {
  if (!_mixer) return;
  _mixer.tracks.forEach((t, i) => resetTrackEQ(i));
  _mixer.master.eqLow.gain.value = 0;
  _mixer.master.eqMid.gain.value = 0;
  _mixer.master.eqHigh.gain.value = 0;
  if (_mixerVisible) renderMixer();
  saveToStorage();
}
function setTrackDelay(lane, val) {
  if (!_mixer) return;
  _mixer.tracks[lane].delayGain.gain.value = val;
  saveToStorage();
}
function setTrackReverb(lane, val) {
  if (!_mixer) return;
  _mixer.tracks[lane].reverbSend.gain.value = val;
  saveToStorage();
}
function setTrackDelayOffset(lane, val) {
  if (!_mixer) return;
  const t = _mixer.tracks[lane];
  t._trackDelay = val;
  if (t.delay) t.delay.delayTime.value = Math.max(0.01, 0.25 + val);
  if (_mixerVisible) renderMixer();
  saveToStorage();
}
function togglePhaseInvert(lane) {
  if (!_mixer) return;
  const t = _mixer.tracks[lane];
  t._phaseInvert = !t._phaseInvert;
  // Apply by inverting gain on eqHigh output temporarily (simplified)
  const nodes = [t.eqLow, t.eqMid, t.eqHigh];
  nodes.forEach(n => { if (n && n.gain) n.gain.value = (n.gain.value || 0) * (t._phaseInvert ? -1 : 1); });
  if (_mixerVisible) renderMixer();
  saveToStorage();
}
function toggleMute(lane) {
  if (!_mixer) return;
  const t = _mixer.tracks[lane];
  t.mute = !t.mute;
  if (t.mute) t.solo = false;
  _mixer.applySoloMute();
  if (_mixerVisible) renderMixer();
  saveToStorage();
}
function toggleSolo(lane) {
  if (!_mixer) return;
  const t = _mixer.tracks[lane];
  t.solo = !t.solo;
  if (t.solo) t.mute = false;
  _mixer.applySoloMute();
  if (_mixerVisible) renderMixer();
  saveToStorage();
}
function muteAllTracks() {
  if (!_mixer) return;
  _mixer.tracks.forEach(t => { t.mute = true; t.solo = false; });
  _mixer.applySoloMute();
  if (_mixerVisible) renderMixer();
  saveToStorage();
}
function clearAllSolo() {
  if (!_mixer) return;
  _mixer.tracks.forEach(t => { t.solo = false; });
  _mixer.applySoloMute();
  if (_mixerVisible) renderMixer();
  saveToStorage();
}
function setMasterVol(val) {
  if (!_mixer) return;
  _mixer.master.gain.gain.value = val;
  if (_mixerVisible) renderMixer();
  saveToStorage();
}
function setMasterEQ(band, val) {
  if (!_mixer) return;
  const node = band === 'low' ? _mixer.master.eqLow : band === 'mid' ? _mixer.master.eqMid : _mixer.master.eqHigh;
  node.gain.value = parseFloat(val);
  saveToStorage();
}

// Legacy compat — returns master compressor node for old code paths
let _masterCompressor = null;
function getMasterCompressor() {
  const m = ensureMixer();
  return m.master.comp;
}

async function startPlayback() {
  if (!timeline.length) { setInfo('No blocks to play'); return; }
  if (!obAudioCtx) obAudioCtx = new(window.AudioContext||window.webkitAudioContext)();
  if (obAudioCtx.state === 'suspended') await obAudioCtx.resume();
  if (obAudioCtx.state !== 'running') {
    console.warn('Audio context not running, state:', obAudioCtx.state);
    // Attempt to continue anyway; some Electron versions report incorrectly
  }
  getMasterCompressor(); // ensure compressor is wired

  isPlaying = true;
  _activeHandles = []; // clear stale handles from previous playbacks
  const btn = document.getElementById('btn-play');
  btn.textContent = '\u25A0 Stop'; btn.classList.add('on');

  const cols = [...new Set(timeline.map(b => b.col))].sort((a,b) => a-b);
  let startIdx = 0;
  if (_seekToCol !== null) {
    startIdx = cols.findIndex(c => c >= _seekToCol);
    if (startIdx === -1) startIdx = 0;
    _seekToCol = null;
  }
  _nextBarTime = obAudioCtx.currentTime + 0.1;
  console.log('[Playback] Starting at idx', startIdx, 'cols', cols, 'nextBarTime', _nextBarTime);

  schedulerLoop(cols, startIdx);
}

async function schedulerLoop(cols, idx) {
  if (!isPlaying) return;

  // Determine loop bounds
  const loopS = Math.max(0, _loopStart);
  const loopE = _loopEnd !== null ? Math.min(cols.length - 1, _loopEnd) : cols.length - 1;
  const inRegion = idx >= loopS && idx <= loopE;

  if (idx >= cols.length || (isLooping && !inRegion)) {
    if (isLooping) { idx = loopS; }
    else { stopPlayback(); return; }
  }

  const lookahead = 0.2;
  const now = obAudioCtx.currentTime;

  // Defensive: if _nextBarTime became NaN, reset it to avoid infinite stall
  if (Number.isNaN(_nextBarTime)) {
    console.error('[Scheduler] _nextBarTime is NaN, resetting');
    _nextBarTime = now + 0.1;
  }

  while (_nextBarTime < now + lookahead && isPlaying) {
    try {
      const colBlocks = timeline.filter(b => b.col === cols[idx]);
      const maxBpm = colBlocks.length ? Math.max(...colBlocks.map(b => b.bpm || 90)) : 90;
      if (Number.isNaN(maxBpm)) {
        console.error('[Scheduler] NaN maxBpm at idx', idx, 'col', cols[idx], 'blocks', colBlocks);
      }
      const barDuration = Math.min(16, Math.max(4, (8 * 60) / maxBpm));
      if (Number.isNaN(barDuration)) {
        console.error('[Scheduler] NaN barDuration, using fallback 4');
      }
      const safeBarDuration = Number.isNaN(barDuration) ? 4 : barDuration;
      console.log('[Scheduler] Scheduling bar', cols[idx], 'at time', _nextBarTime, 'duration', safeBarDuration, 'idx', idx, 'of', cols.length);
      await scheduleBar(cols[idx], _nextBarTime, safeBarDuration, Number.isNaN(maxBpm) ? 90 : maxBpm);
      _nextBarTime += safeBarDuration;
      idx++;
      if (idx > loopE) {
        if (isLooping) idx = loopS;
        else if (idx >= cols.length) {
          // Let scheduled audio play out before stopping
          const remainingMs = Math.max(0, (_nextBarTime - obAudioCtx.currentTime) * 1000);
          console.log('[Scheduler] End of timeline, stopping in', remainingMs, 'ms');
          _schedulerTimer = setTimeout(() => stopPlayback(), remainingMs);
          return;
        }
        else break;
      }
    } catch (err) {
      console.error('[Scheduler] Error scheduling bar at idx', idx, 'col', cols[idx], err);
      const msg = 'Playback error: ' + (err?.message || err);
      setInfo(msg);
      alert(msg + '\n\nCheck console (Ctrl+Shift+J) for details.');
      stopPlayback();
      return;
    }
  }

  _schedulerTimer = setTimeout(() => schedulerLoop(cols, idx), 50);
}

async function scheduleBar(col, time, barDuration=8, bpm=120) {
  _playhead = col;
  drawTL();
  const bar = Math.floor(col / 4) + 1;
  const beat = (col % 4) + 1;
  document.getElementById('time-display').textContent = `B${bar}.${beat}`;
  // Schedule metronome clicks for this bar
  const beats = Math.max(4, Math.round(barDuration / (60 / bpm)));
  scheduleMetronome(time, bpm, beats);

  const uiDelay = (time - obAudioCtx.currentTime) * 1000;
  setTimeout(() => {
    if(!isPlaying) return;
    drawTL();
    document.getElementById('tl-info').style.color = '#fff';
    document.getElementById('tl-info').style.textShadow = '0 0 10px rgba(255,255,255,0.5)';
  }, uiDelay);
  setTimeout(() => {
    if(!isPlaying) return;
    document.getElementById('tl-info').style.color = '';
    document.getElementById('tl-info').style.textShadow = '';
  }, uiDelay + 200);

  const blocks = timeline.filter(b => b.col === col);
  if (!blocks.length) return;

  // ── Multi-lane: synthesize ALL lanes simultaneously ──
  // Each lane = independent circuit path firing in compound state
  const genreNames = [];
  applySidechain(time, barDuration);
  for (const b of blocks) {
    try {
      const trackDelay = (_mixer?.tracks[b.lane ?? 0]?._trackDelay) || 0;
      const laneTime = time + trackDelay;
      applyAutomation(b.lane ?? 0, laneTime, barDuration);
      // Piano notes: play stored note pitches
      if (b.notes && b.notes.length) {
        b.notes.forEach(n => {
          const noteTime = laneTime + n.time * barDuration;
          const noteDur = n.dur * barDuration;
          const freq = midiToFreq(n.pitch);
          if (Number.isNaN(freq)) { console.warn('NaN freq for note', n); return; }
          const noteTimbre = getTimbreForGenre(b.coreGenre || b.genre, b.vec);
          const osc = obAudioCtx.createOscillator();
          const gain = obAudioCtx.createGain();
          const noteFilter = obAudioCtx.createBiquadFilter();
          osc.frequency.value = freq;
          osc.type = noteTimbre.waveform || 'triangle';
          noteFilter.type = noteTimbre.filt || 'lowpass';
          noteFilter.frequency.value = (noteTimbre.cutoff || 2000) * 0.6;
          noteFilter.Q.value = noteTimbre.resonance || 1;
          gain.gain.setValueAtTime(0, noteTime);
          gain.gain.linearRampToValueAtTime(n.vel * 0.3, noteTime + 0.02);
          gain.gain.linearRampToValueAtTime(0, noteTime + noteDur);
          const mixer = ensureMixer();
          const trackInput = mixer.getTrackInput(b.lane ?? 0);
          osc.connect(noteFilter); noteFilter.connect(gain); gain.connect(trackInput || mixer.master.gain);
          osc.start(noteTime); osc.stop(noteTime + noteDur);
          _activeHandles.push(osc);
        });
      }
      // Step sequencer override: if steps exist, trigger per-step
      else if (b.steps && b.steps.some(s => s > 0)) {
        const stepDur = barDuration / b.steps.length;
        const swing = b.swing || 0;
        b.steps.forEach((vel, i) => {
          if (vel > 0) {
            let offset = 0;
            if (swing > 0 && i % 2 === 1) offset = stepDur * swing * 0.66;
            const stepTime = laneTime + i * stepDur + offset;
            const stepTimbre = getTimbreForGenre(b.coreGenre || b.genre, b.vec);
            const osc = obAudioCtx.createOscillator();
            const gain = obAudioCtx.createGain();
            const filt = obAudioCtx.createBiquadFilter();
            osc.type = stepTimbre.waveform || 'triangle';
            const stepFreq = midiToFreq(getStepPitch(b, i));
            if (Number.isNaN(stepFreq)) { console.warn('NaN step freq at', i); }
            else osc.frequency.setValueAtTime(stepFreq, stepTime);
            filt.type = stepTimbre.filt || 'lowpass';
            filt.frequency.value = stepTimbre.cutoff || 2000;
            filt.Q.value = stepTimbre.resonance || 1;
            gain.gain.setValueAtTime(0, stepTime);
            gain.gain.linearRampToValueAtTime(vel * 0.12, stepTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, stepTime + 0.15);
            osc.connect(filt); filt.connect(gain);
            const mixer = ensureMixer();
            const trackInput = mixer.getTrackInput(b.lane ?? 0);
            gain.connect(trackInput || mixer.master.gain);
            osc.start(stepTime); osc.stop(stepTime + 0.2);
            _activeHandles.push(osc);
          }
        });
      } else if (b.genStatus === 'ready' && _blockAudio[b.block_id]) {
        const { wavPath, buffer } = _blockAudio[b.block_id];
        playWavWithFade(wavPath, laneTime, barDuration, b.lane ?? 0, buffer, b.fadeIn || 0, b.fadeOut || 0, b.clipGain || 1, b.trimStart || 0, b.trimEnd || 0, b.playbackRate || 1);
      } else {
        await playVirtualWithFade(b, laneTime, barDuration);
      }
      // Arpeggiator overlay: plays on top of any main audio path
      if (b.arpeggio && b.arpeggio.enabled) {
        const rateMap = { '1/4': 4, '1/8': 8, '1/16': 16, '1/32': 32 };
        const steps = rateMap[b.arpeggio.rate] || 16;
        const gate = b.arpeggio.gate || 0.8;
        const chordNotes = getArpChordNotes(b);
        const arpNotes = buildArpSequence(chordNotes, b.arpeggio.pattern, b.arpeggio.octaveRange, steps);
        const stepDur = barDuration / steps;
        const timbre = getTimbreForGenre((b.coreGenre || b.genre || 'ambient').toLowerCase(), b.vec);
        arpNotes.forEach((noteMidi, i) => {
          const noteTime = laneTime + i * stepDur;
          const noteLen = stepDur * gate;
          const freq = midiToFreq(noteMidi);
          if (Number.isNaN(freq)) { console.warn('NaN arp freq at', i, 'noteMidi', noteMidi); return; }
          const osc = obAudioCtx.createOscillator();
          const gain = obAudioCtx.createGain();
          const noteFilter = obAudioCtx.createBiquadFilter();
          osc.frequency.value = freq;
          osc.type = timbre.waveform || 'triangle';
          noteFilter.type = timbre.filt || 'lowpass';
          noteFilter.frequency.value = (timbre.cutoff || 2000) * 0.6;
          noteFilter.Q.value = timbre.resonance || 1;
          gain.gain.setValueAtTime(0, noteTime);
          gain.gain.linearRampToValueAtTime(0.15, noteTime + 0.02);
          gain.gain.linearRampToValueAtTime(0, noteTime + noteLen);
          const mixer = ensureMixer();
          const trackInput = mixer.getTrackInput(b.lane ?? 0);
          osc.connect(noteFilter); noteFilter.connect(gain); gain.connect(trackInput || mixer.master.gain);
          osc.start(noteTime); osc.stop(noteTime + noteLen);
          _activeHandles.push(osc);
        });
      }
    } catch (blockErr) {
      console.error('[scheduleBar] Block error at col', col, 'lane', b.lane, 'genre', b.genre, blockErr);
      setInfo('Block error: ' + (blockErr?.message || blockErr));
    }
    genreNames.push(b.genre);
  }
  setInfo(`Bar ${Math.floor(col/4)+1} · ${genreNames.length} sound${genreNames.length>1?'s':''}`);
}

function playWavWithFade(path, startTime, duration, lane, preloadedBuf, fadeIn=0, fadeOut=0, clipGain=1, trimStart=0, trimEnd=0, playbackRate=1) {
  const play = (audioBuf) => {
    const source = obAudioCtx.createBufferSource();
    const gain = obAudioCtx.createGain();
    source.buffer = audioBuf;
    source.playbackRate.value = playbackRate;
    const bufDur = audioBuf.duration;
    const offset = Math.min(trimStart, bufDur);
    const playDur = Math.min(duration, bufDur - offset - trimEnd);
    const fi = Math.min(fadeIn * playDur, playDur * 0.5);
    const fo = Math.min(fadeOut * playDur, playDur * 0.5);
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(clipGain, startTime + fi + 0.01);
    if (fo > 0) {
      gain.gain.setValueAtTime(clipGain, startTime + playDur - fo);
      gain.gain.linearRampToValueAtTime(0, startTime + playDur);
    }
    const mixer = ensureMixer();
    const trackInput = mixer.getTrackInput(lane ?? 0);
    source.connect(gain);
    gain.connect(trackInput || mixer.master.gain);
    source.start(startTime, offset, playDur);
    _activeHandles.push(source);
  };
  if (preloadedBuf) { play(preloadedBuf); return; }
  fetch(window.circuit.wavUrl(path))
    .then(r => r.arrayBuffer())
    .then(buf => obAudioCtx.decodeAudioData(buf))
    .then(audioBuf => play(audioBuf));
}

let _activeHandles = [];

function stopPlayback() {
  isPlaying = false;
  if (_schedulerTimer) { clearTimeout(_schedulerTimer); _schedulerTimer = null; }
  _activeHandles.forEach(h=>{try{h.stop();}catch(e){}});
  _activeHandles=[];

  _playhead = -1;
  drawTL();
  const td = document.getElementById('time-display');
  if (td) td.textContent = '00:00';
  const btn = document.getElementById('btn-play');
  btn.textContent = '\u25B6 Play'; btn.classList.remove('on');
  setInfo('Stopped');
}
window.addEventListener('beforeunload', () => {
  if (obAudioCtx && obAudioCtx.state !== 'closed') obAudioCtx.close();
  saveToStorage();
});

// ── Init ──────────────────────────────────────────────────────
resizeTL();drawCurve();
renderStep2();
initBlockProgressListener();
// Start fresh every launch — no auto-restore. User loads explicitly via import.
try { localStorage.removeItem('circuit_project'); } catch(e) {}
window.addEventListener('resize',()=>{resizeTL();drawCurve();});
setInterval(()=>{ if(timeline.length) saveToStorage(); }, 60000);

// VU meter update
setInterval(() => {
  if (!_mixer || !_mixer.analyser || !_mixerVisible) return;
  const data = new Uint8Array(_mixer.analyser.frequencyBinCount);
  _mixer.analyser.getByteFrequencyData(data);
  const avg = data.reduce((a, b) => a + b, 0) / data.length;
  const pct = Math.min(100, (avg / 255) * 140);
  const el = document.getElementById('vu-meter');
  if (el) el.style.width = pct + '%';
}, 100);

document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undoLast(); }
  if ((e.ctrlKey && e.key === 'y') || (e.ctrlKey && e.shiftKey && e.key === 'Z')) { e.preventDefault(); redoLast(); }
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    // Delete block at playhead
    if (_playhead >= 0) {
      const block = timeline.find(b => b.col === _playhead);
      if (block) { _pushHistory(); const i = timeline.indexOf(block); timeline.splice(i, 1); delete _blockAudio[block.block_id]; if (_selectedBlock === block) _selectedBlock = null; drawTL(); saveToStorage(); setInfo('Block deleted'); }
    }
  }
  if (e.key === 'l' || e.key === 'L') { toggleLoop(); }
  // Copy / Paste block
  if (e.ctrlKey && e.key === 'c') {
    e.preventDefault();
    const source = _selectedBlock || (_playhead >= 0 ? timeline.find(b => b.col === _playhead) : null);
    if (source) {
      _clipboardBlock = JSON.parse(JSON.stringify(source));
      setInfo('Copied sound');
    }
  }
  if (e.ctrlKey && e.key === 'v') {
    e.preventDefault();
    if (!_clipboardBlock) { setInfo('Nothing to paste'); return; }
    _pushHistory();
    const newBlock = JSON.parse(JSON.stringify(_clipboardBlock));
    newBlock.block_id = `b${++_blockIdCounter}`;
    // Determine paste position: playhead if empty, else next empty col on same lane
    let targetCol = _playhead >= 0 ? _playhead : (_clipboardBlock.col + 1);
    let targetLane = _clipboardBlock.lane;
    // Find first empty slot at or after targetCol
    while (timeline.find(b => b.col === targetCol && b.lane === targetLane)) {
      targetCol += 1;
    }
    newBlock.col = targetCol;
    newBlock.lane = targetLane;
    timeline.push(newBlock);
    timeline.sort((a, b) => a.col - b.col);
    _selectedBlock = newBlock;
    drawTL(); saveToStorage();
    setInfo('Pasted sound at col ' + targetCol);
  }
  // Arrow keys: move selected block or navigate playhead
  if (!isPlaying) {
    if (e.shiftKey && _selectedBlock) {
      _pushHistory();
      const block = _selectedBlock;
      if (e.key === 'ArrowRight') { block.col += 1; }
      if (e.key === 'ArrowLeft') { block.col = Math.max(0, block.col - 1); }
      if (e.key === 'ArrowUp') { block.lane = Math.max(0, block.lane - 1); }
      if (e.key === 'ArrowDown') { block.lane = Math.min(LANES - 1, block.lane + 1); }
      timeline.sort((a, b) => a.col - b.col);
      drawTL(); saveToStorage();
    } else if (!e.shiftKey) {
      if (_playhead < 0) _playhead = 0;
      if (e.key === 'ArrowRight') { _playhead += 1; }
      if (e.key === 'ArrowLeft') { _playhead = Math.max(0, _playhead - 1); }
      drawTL();
    }
  }
});
